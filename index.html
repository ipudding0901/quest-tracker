<!DOCTYPE html>
<html>
<head>
  <title>Quest RPG</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #0f172a;
      color: #e2e8f0;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 15px;
    }

    .card {
      background: #1e293b;

      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* CHARACTER */
    .avatar {
      position: relative;
      width: 140px;
      height: 140px;
      margin: auto;
    }

    .layer {
      position: absolute;
      width: 100%;
      image-rendering: pixelated;
    }

    #helmet { top: 0; left: 25px; width: 60%; }
    #chest { top: 40px; left: 25px; width: 60%; }
    #weapon { top: 50px; left: 90px; width: 40%; }
    #shoes { top: 90px; left: 35px; width: 50%; }

    .pet {
      position: absolute;
      right: -40px;
      bottom: 0;
      width: 50px;
    }

    /* BARS */
    .bar {
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin: 5px 0;
    }

    .fill {
      height: 100%;
      background: #22c55e;
    }

    /* BUTTON */
    button {
      background: #3b82f6;
      border: none;
      padding: 8px 12px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    input {

      width: 70%;
      margin-right: 5px;
      border-radius: 6px;
      border: none;
    }

    /* INVENTORY */

      display: grid;

    }

      padding: 5px;

      border-radius: 6px;

    }

  </style>
</head>

<body>

<div class="app">
  <h1>⚔️ Quest RPG</h1>

  <div class="grid">

    <!-- CHARACTER -->
    <div class="card">
      <div class="title">Character</div>

      <div class="avatar">
        <img id="base" class="layer" src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png">
        <img id="helmet" class="layer">
        <img id="chest" class="layer">
        <img id="weapon" class="layer">
        <img id="shoes" class="layer">
        <img class="pet" src="https://kenney.nl/assets/animal-pack/PNG/Round/bee.png">
      </div>

      <div id="stats"></div>

      HP
      <div class="bar"><div id="hpBar" class="fill"></div></div>

    </div>

    <!-- QUESTS -->
    <div class="card">
      <div class="title">Quests</div>

      <input id="questInput">
      <button onclick="addQuest()">Add</button>

      <div id="quests"></div>
    </div>

    <!-- BATTLE -->
    <div class="card">
      <div class="title">Battle</div>

      <div class="battle">
        <div>
          <img src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png" width="70">
          <div class="bar"><div id="pHP" class="fill"></div></div>
        </div>

        <div>
          <img src="https://kenney.nl/assets/monster-pack/PNG/Slime/slimeBlock.png" width="70">
          <div class="bar"><div id="mHP" class="fill"></div></div>
        </div>
      </div>

      <button onclick="attack()">Attack</button>

      <div id="log" class="log"></div>

      <div class="title">Inventory</div>
      <div id="inventory" class="inventory"></div>
    </div>

  </div>
</div>

<script>
let player={
  hp:100,
  maxHp:100,
  atk:5,
  helmet:null,
  chest:null,
  weapon:null,
  shoes:null,
  inventory:[]
};

let monster={hp:50,maxHp:50};
let quests=[];

function addQuest(){
  let t=document.getElementById("questInput").value;
  quests.push({text:t});
  render();
}

function attack(){
  monster.hp-=player.atk;

  if(monster.hp<=0){
    log("Monster defeated!");
    monster.hp=50;
    player.inventory.push(rollLoot());
  } else {
    player.hp-=5;
    log("You attacked!");
  }

  render();
}

function rollLoot(){
  let types=["helmet","chest","weapon","shoes"];
  return {type:types[Math.floor(Math.random()*4)],
    img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/sword.png"};
}

function equip(i){
  player[i.type]=i;
  render();
}

function log(t){
  document.getElementById("log").innerHTML+=t+"<br>";
}

function render(){
  document.getElementById("stats").innerHTML="ATK:"+player.atk;

  document.getElementById("hpBar").style.width=(player.hp/player.maxHp*100)+"%";
  document.getElementById("pHP").style.width=(player.hp/player.maxHp*100)+"%";
  document.getElementById("mHP").style.width=(monster.hp/monster.maxHp*100)+"%";

  document.getElementById("helmet").src=player.helmet?player.helmet.img:"";
  document.getElementById("chest").src=player.chest?player.chest.img:"";
  document.getElementById("weapon").src=player.weapon?player.weapon.img:"";
  document.getElementById("shoes").src=player.shoes?player.shoes.img:"";

  let q="";
  quests.forEach(x=>q+=x.text+"<br>");
  document.getElementById("quests").innerHTML=q;

  let inv="";
  player.inventory.forEach(i=>{
    inv+=`<div class="item" onclick='equip(${JSON.stringify(i)})'>
      <img src="${i.img}" width="30">
    </div>`;
  });
  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

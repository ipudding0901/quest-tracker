<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest RPG: Chronicles Edition</title>
  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --text: #c9d1d9;
      --accent: #58a6ff; --gold: #f2cc60; --danger: #f85149; --success: #3fb950;
      --slot: rgba(255,255,255,0.03); --border: #30363d;
    }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 1100px; margin: 20px auto; padding: 20px; }

    /* NAVIGATION */
    .nav { display: flex; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; align-items: center; }
    .gold-box { margin-left: auto; color: var(--gold); font-weight: bold; font-size: 1.1em; }

    /* PRO GRID LAYOUT */
    .char-grid { display: grid; grid-template-columns: 200px 1fr 200px; gap: 20px; }
    .slot-col { display: flex; flex-direction: column; gap: 12px; }
    .slot { 
        background: var(--slot); border: 1px solid var(--border); border-radius: 8px; 
        padding: 12px; min-height: 70px; text-align: center; position: relative;
    }
    .slot.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }
    .slot-label { font-size: 9px; color: #8b949e; text-transform: uppercase; display: block; margin-bottom: 4px; }

    /* HERO & PET PAPER DOLL */
    .doll-house { 
        background: radial-gradient(circle, #1c2128, #0d1117); border-radius: 12px; 
        height: 400px; position: relative; border: 1px solid var(--border); overflow: hidden;
    }
    .hero-base { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80px; height: 180px; }
    .h-head { width: 40px; height: 40px; background: #e3b341; border-radius: 50%; margin: 0 auto; }
    .h-body { width: 60px; height: 70px; background: #30363d; border-radius: 6px; margin: 4px auto; }
    .h-legs { display: flex; justify-content: space-around; width: 50px; margin: 0 auto; }
    .h-leg { width: 20px; height: 50px; background: #21262d; border-radius: 3px; }

    .pet-base { position: absolute; bottom: 40px; right: 40px; width: 50px; height: 50px; }
    .p-body { width: 40px; height: 30px; background: #8b949e; border-radius: 15px 15px 5px 5px; position: absolute; bottom: 0; left: 5px; }
    .p-head { width: 25px; height: 25px; background: #8b949e; border-radius: 50%; position: absolute; top: 0; right: 0; }

    .ov { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; text-align: center; }
    #ov-helmet { top: -8px; font-size: 55px; z-index: 10; }
    #ov-armor { top: 40px; font-size: 85px; z-index: 9; }
    #ov-weapon { top: 60px; left: -25px; font-size: 55px; z-index: 11; transform: rotate(-15deg); }
    #ov-shield { top: 60px; left: 105px; font-size: 55px; z-index: 11; }
    #ov-shoes { bottom: -20px; font-size: 70px; width: 90px; display: flex; justify-content: space-around; }
    #ov-pet { font-size: 45px; position: absolute; bottom: 0; left: 0; }
    #ov-collar { top: 12px; font-size: 20px; z-index: 5; }
    #ov-charm { top: 25px; left: 10px; font-size: 18px; z-index: 6; }

    /* 2.5D ARENA */
    .arena { 
        position: relative; width: 100%; height: 300px; background: #010409; 
        border-radius: 12px; overflow: hidden; perspective: 800px; border: 1px solid var(--border);
    }
    .floor { 
        position: absolute; bottom: 0; width: 100%; height: 140px; 
        background: linear-gradient(to bottom, #161b22 1px, transparent 1px), linear-gradient(to right, #161b22 1px, transparent 1px);
        background-size: 40px 40px; transform: rotateX(60deg); transform-origin: bottom; opacity: 0.4;
    }
    .combatant { position: absolute; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hero-team { bottom: 40px; left: 60px; display: flex; align-items: flex-end; gap: 10px; }
    .monster-pos { top: 60px; right: 80px; text-align: center; }
    .lunge { transform: translate(140px, -80px) scale(1.1); }

    /* PANEL & QUESTS */
    .panel { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border); }
    .btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; transition: 0.2s; }
    .btn-p { background: var(--accent); color: #fff; }
    .btn-s { background: var(--gold); color: #000; }
    .btn-d { background: var(--danger); color: #fff; }

    .q-row { background: #0d1117; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

    /* COLLAPSIBLE HISTORY */
    .history-container { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    .history-header { 
        display: flex; justify-content: space-between; align-items: center; 
        cursor: pointer; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 6px;
    }
    .history-header:hover { background: rgba(255,255,255,0.05); }
    .history-content { 
        max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; 
        margin-top: 10px; display: flex; flex-direction: column; gap: 5px;
    }
    .history-content.open { max-height: 500px; overflow-y: auto; }
    .hist-item { font-size: 0.85em; color: #8b949e; padding: 8px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; }

    .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 8px; margin-top: 10px; }
    .inv-item { background: var(--card); min-width: 60px; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <strong>🛡️ QUEST MASTER</strong>
        <select onchange="state.role=this.value; render();" style="background:#21262d; color:#fff; border:1px solid var(--border); border-radius:4px; padding:4px;">
            <option value="child">Child Mode</option>
            <option value="parent">Parent Mode</option>
        </select>
        <div class="gold-box">💰 <span id="gold">0</span></div>
        <button class="btn btn-s" onclick="openM('shopM')">SHOP</button>
        <button class="btn btn-p" onclick="openM('battleM')">BATTLE</button>
    </div>

    <div class="char-grid">
        <div class="slot-col">
            <div class="slot" id="s-helmet"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
            <div class="slot" id="s-weapon"><span class="slot-label">Weapon</span><div id="v-weapon"></div></div>
            <div class="slot" id="s-shield"><span class="slot-label">Off-hand</span><div id="v-shield"></div></div>
        </div>

        <div class="doll-house">
            <div class="hero-base">
                <div class="h-head"></div><div class="h-body"></div><div class="h-legs"><div class="h-leg"></div><div class="h-leg"></div></div>
                <div class="ov" id="ov-helmet"></div><div class="ov" id="ov-armor"></div><div class="ov" id="ov-weapon"></div><div class="ov" id="ov-shield"></div><div class="ov" id="ov-shoes"></div>
            </div>
            <div class="pet-base" id="pet-doll">
                <div class="p-body"></div><div class="p-head"></div>
                <div id="ov-pet" class="ov"></div><div id="ov-collar" class="ov"></div><div id="ov-charm" class="ov"></div>
            </div>
            <div style="position:absolute; bottom:15px; width:100%; text-align:center;">
                <small>LVL <span id="lvl">1</span></small>
                <div style="width:100px; height:4px; background:#000; margin:4px auto; border-radius:2px; overflow:hidden;"><div id="xp-bar" style="width:0%; height:100%; background:var(--accent);"></div></div>
            </div>
        </div>

        <div class="slot-col">
            <div class="slot" id="s-armor"><span class="slot-label">Body</span><div id="v-armor"></div></div>
            <div class="slot" id="s-shoes"><span class="slot-label">Boots</span><div id="v-shoes"></div></div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
                <div class="slot" id="s-collar"><span class="slot-label">Pet Collar</span><div id="v-collar"></div></div>
                <div class="slot" id="s-charm" style="margin-top:12px;"><span class="slot-label">Pet Charm</span><div id="v-charm"></div></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>🎒 Inventory</h3>
        <div class="inv-grid" id="inv"></div>
    </div>

    <div class="panel">
        <h3>📜 Quest Log</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="qIn" style="flex:1; background:#0d1117; border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px;" placeholder="Add a new task...">
            <button class="btn btn-p" onclick="addQ()">Add Task</button>
        </div>
        <div id="qList"></div>

        <div class="history-container">
            <div class="history-header" onclick="toggleHistory()">
                <span style="font-weight:bold; font-size: 0.9em; color: var(--success);">📜 VIEW COMPLETED QUESTS</span>
                <span id="hist-toggle-icon">▼</span>
            </div>
            <div class="history-content" id="hist-content">
                </div>
        </div>
    </div>
</div>

<div id="battleM" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center;">
    <div class="panel" style="width:700px;">
        <div class="arena">
            <div class="floor"></div>
            <div class="combatant hero-team" id="hTeam"><div style="font-size:40px; transform:scaleX(-1)" id="b-pet"></div><div style="font-size:70px; transform:scaleX(-1)">🧑‍🚀</div></div>
            <div class="combatant monster-pos" id="mPos">
                <div id="mImg" style="font-size:80px;">👾</div>
                <div style="width:100px; height:8px; background:#000; border-radius:4px; overflow:hidden;"><div id="mHp" style="width:100%; height:100%; background:var(--danger);"></div></div>
            </div>
        </div>
        <button id="atkBtn" class="btn btn-p" style="width:100%; margin-top:15px;" onclick="fight()">STRIKE!</button>
        <button onclick="closeM('battleM')" class="btn" style="width:100%; margin-top:10px; background:#30363d; color:#fff;">RUN AWAY</button>
    </div>
</div>

<div id="shopM" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center;">
    <div class="panel" style="width:400px;">
        <h2>The Village Shop</h2>
        <div class="q-row"><span>🧪 HP Potion</span> <button class="btn btn-s" onclick="buy('pot')">50G</button></div>
        <div class="q-row"><span>🦴 Pet Treat</span> <button class="btn btn-s" onclick="buy('luck')">200G</button></div>
        <button onclick="closeM('shopM')" class="btn" style="width:100%; margin-top:10px; background:#30363d; color:#fff;">Leave</button>
    </div>
</div>

<script>
let state = {
    role: 'child', gold: 100, lvl: 1, xp: 0, hp: 100, mHp: 60, mMax: 60,
    quests: [], 
    history: [], // Added for collapsible history
    inv: [],
    equip: { helmet:null, weapon:null, shield:null, armor:null, shoes:null, collar:null, charm:null, pet: {name:"Dog", icon:"🐕", slot:"pet"} }
};

const DROPS = [
    { name: "Sword", icon: "🗡️", slot: "weapon" }, { name: "Shield", icon: "🛡️", slot: "shield" },
    { name: "Cape", icon: "🧥", slot: "armor" }, { name: "Bell", icon: "🔔", slot: "collar" },
    { name: "Gem", icon: "💎", slot: "charm" }, { name: "Cat", icon: "🐈", slot: "pet" }
];

function openM(id) { document.getElementById(id).style.display = 'flex'; render(); }
function closeM(id) { document.getElementById(id).style.display = 'none'; }

function addQ() {
    const v = document.getElementById('qIn').value;
    if(!v) return;
    state.quests.push({txt: v, status: 'open', date: new Date().toLocaleDateString()});
    document.getElementById('qIn').value = '';
    render();
}

function toggleHistory() {
    const content = document.getElementById('hist-content');
    const icon = document.getElementById('hist-toggle-icon');
    content.classList.toggle('open');
    icon.innerText = content.classList.contains('open') ? '▲' : '▼';
}

function updateQ(i, s) {
    if(s === 'done') {
        const finishedTask = state.quests.splice(i, 1)[0];
        finishedTask.approvedAt = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        state.history.unshift(finishedTask); // Add to history
        state.gold += 50; state.xp += 40;
        if(Math.random() < 0.4) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
    } else {
        state.quests[i].status = s;
    }
    if(state.xp >= 100) { state.lvl++; state.xp -= 100; }
    render();
}

function fight() {
    const team = document.getElementById('hTeam');
    team.classList.add('lunge');
    setTimeout(() => {
        state.mHp -= 20;
        if(state.mHp <= 0) { state.gold += 30; state.mMax = Math.floor(state.mMax * 1.3); state.mHp = state.mMax; closeM('battleM'); }
        team.classList.remove('lunge'); render();
    }, 400);
}

function equip(i) {
    const item = state.inv[i];
    const old = state.equip[item.slot];
    state.equip[item.slot] = item;
    state.inv.splice(i, 1);
    if(old) state.inv.push(old);
    render();
}

function buy(t) { if(t === 'pot' && state.gold >= 50) { state.gold -= 50; state.hp = 100; } render(); }

function render() {
    document.getElementById('gold').innerText = state.gold;
    document.getElementById('lvl').innerText = state.lvl;
    document.getElementById('xp-bar').style.width = state.xp + "%";
    document.getElementById('mHp').style.width = (state.mHp/state.mMax*100) + "%";

    // Equipment
    for(let s in state.equip) {
        const item = state.equip[s];
        const vEl = document.getElementById('v-'+s);
        const ovEl = document.getElementById('ov-'+s);
        if(vEl) vEl.innerText = item ? item.icon : '';
        if(ovEl) ovEl.innerText = item ? item.icon : '';
        if(vEl && vEl.parentElement) vEl.parentElement.className = item ? 'slot active' : 'slot';
    }
    document.getElementById('b-pet').innerText = state.equip.pet ? state.equip.pet.icon : '';

    // Active Quests
    let qH = '';
    state.quests.forEach((q, i) => {
        let b = '';
        if(state.role === 'child' && q.status === 'open') b = `<button onclick="updateQ(${i},'pending')" class="btn btn-p">Submit</button>`;
        if(state.role === 'parent') {
            if(q.status === 'pending') b = `<button onclick="updateQ(${i},'done')" class="btn btn-s">Approve</button>`;
            b += ` <button onclick="state.quests.splice(${i},1); render();" class="btn btn-d">×</button>`;
        }
        qH += `<div class="q-row"><span>${q.txt} <small style="color:var(--gold)">(${q.status})</small></span> <div>${b}</div></div>`;
    });
    document.getElementById('qList').innerHTML = qH || '<p style="text-align:center; opacity:0.5">No active tasks.</p>';

    // Historical Quests
    let hH = '';
    state.history.forEach(h => {
        hH += `<div class="hist-item"><span>✅ ${h.txt}</span> <span>${h.approvedAt}</span></div>`;
    });
    document.getElementById('hist-content').innerHTML = hH || '<p style="text-align:center; font-size:12px; padding:10px;">No history yet.</p>';

    // Inventory
    let iH = '';
    state.inv.forEach((it, i) => iH += `<div class="inv-item" onclick="equip(${i})">${it.icon}</div>`);
    document.getElementById('inv').innerHTML = iH;
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest RPG: Vector Smithy Edition</title>
  <style>
    :root {
      --bg: #0b0e14; --card: #161b22; --text: #c9d1d9;
      --accent: #58a6ff; --gold: #f2cc60; --danger: #f85149; --success: #3fb950;
      --slot: rgba(255,255,255,0.03); --border: #30363d;
      /* Equipment Colors */
      --iron: #848d97; --wood: #7a5230; --steel: #cbd5e1;
    }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 1100px; margin: 20px auto; padding: 20px; }

    /* LAYOUT & NAVIGATION */
    .nav { display: flex; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; align-items: center; }
    .gold-box { margin-left: auto; color: var(--gold); font-weight: bold; font-size: 1.1em; }

    .char-grid { display: grid; grid-template-columns: 200px 1fr 200px; gap: 20px; }
    .slot-col { display: flex; flex-direction: column; gap: 12px; }
    .slot { background: var(--slot); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 70px; text-align: center; cursor: pointer; }
    .slot.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }
    .slot-label { font-size: 9px; color: #8b949e; text-transform: uppercase; display: block; margin-bottom: 4px; }

    /* PAPER DOLL SYSTEM */
    .doll-house { background: radial-gradient(circle, #1c2128, #0d1117); border-radius: 12px; height: 400px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    
    /* Hero Base */
    .hero-base { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80px; height: 180px; }
    .h-head { width: 40px; height: 40px; background: #e3b341; border-radius: 50%; margin: 0 auto; position: relative; }
    .h-body { width: 60px; height: 70px; background: #30363d; border-radius: 6px; margin: 4px auto; position: relative; }
    .h-legs { display: flex; justify-content: space-around; width: 50px; margin: 0 auto; }
    .h-leg { width: 20px; height: 50px; background: #21262d; border-radius: 3px; position: relative; }

    /* CSS EQUIPMENT STYLES (The Vector Art) */
    .vis-helm { width: 44px; height: 25px; background: var(--iron); position: absolute; top: -2px; left: -2px; border-radius: 20px 20px 5px 5px; border: 2px solid #000; display: none; }
    .vis-armor { width: 64px; height: 74px; background: var(--iron); position: absolute; top: -2px; left: -2px; border-radius: 6px; border: 2px solid #000; display: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .vis-weapon { width: 10px; height: 60px; background: var(--steel); position: absolute; top: 10px; left: -25px; border: 2px solid #000; transform: rotate(-15deg); display: none; }
    .vis-weapon::after { content:''; position:absolute; bottom:-10px; left:-2px; width:14px; height:15px; background:var(--wood); border:1px solid #000; }
    .vis-shield { width: 40px; height: 50px; background: var(--wood); position: absolute; top: 10px; right: -35px; border: 3px solid #543b26; border-radius: 5px 5px 20px 20px; display: none; }
    .vis-boot { width: 24px; height: 15px; background: #000; position: absolute; bottom: -2px; left: -2px; border-radius: 3px; display: none; }

    /* PET SYSTEM */
    .pet-base { position: absolute; bottom: 40px; right: 40px; width: 50px; height: 50px; }
    .p-body { width: 40px; height: 30px; background: #8b949e; border-radius: 15px 15px 5px 5px; position: absolute; bottom: 0; left: 5px; }
    .p-head { width: 25px; height: 25px; background: #8b949e; border-radius: 50%; position: absolute; top: 0; right: 0; }
    .p-collar { width: 20px; height: 4px; background: var(--danger); position: absolute; top: 22px; right: 2px; border-radius: 2px; display: none; }

    /* 2.5D ARENA */
    .arena { position: relative; width: 100%; height: 300px; background: #010409; border-radius: 12px; overflow: hidden; perspective: 800px; border: 1px solid var(--border); }
    .floor { position: absolute; bottom: 0; width: 100%; height: 140px; background: linear-gradient(to bottom, #161b22 1px, transparent 1px), linear-gradient(to right, #161b22 1px, transparent 1px); background-size: 40px 40px; transform: rotateX(60deg); transform-origin: bottom; opacity: 0.4; }
    .combatant { position: absolute; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hero-team { bottom: 40px; left: 60px; display: flex; align-items: flex-end; gap: 10px; }
    .monster-pos { top: 60px; right: 80px; text-align: center; }
    .lunge { transform: translate(140px, -80px) scale(1.1); }

    /* UI ELEMENTS */
    .panel { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border); }
    .btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px; font-weight: bold; transition: 0.2s; }
    .btn-p { background: var(--accent); color: #fff; }
    .btn-s { background: var(--gold); color: #000; }
    .q-row { background: #0d1117; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    
    .history-container { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    .history-content { max-height: 0; overflow: hidden; transition: 0.3s; }
    .history-content.open { max-height: 400px; overflow-y: auto; }

    .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 8px; margin-top: 10px; min-height: 80px; }
    .inv-item { background: var(--card); min-width: 65px; padding: 5px; border-radius: 8px; border: 1px solid var(--border); text-align: center; font-size: 10px; cursor: pointer; }
    .inv-item:hover { border-color: var(--gold); }
  </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <strong>🛡️ RPG MASTER</strong>
        <select onchange="state.role=this.value; render();" style="background:#21262d; color:#fff; border:1px solid var(--border); padding:4px;">
            <option value="child">Child Mode</option>
            <option value="parent">Parent Mode</option>
        </select>
        <div class="gold-box">💰 <span id="gold">0</span></div>
        <button class="btn btn-s" onclick="openM('shopM')">SHOP</button>
        <button class="btn btn-p" onclick="openM('battleM')">BATTLE</button>
    </div>

    <div class="char-grid">
        <div class="slot-col">
            <div class="slot" id="s-helmet" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
            <div class="slot" id="s-weapon" onclick="unequip('weapon')"><span class="slot-label">Weapon</span><div id="v-weapon"></div></div>
            <div class="slot" id="s-shield" onclick="unequip('shield')"><span class="slot-label">Off-hand</span><div id="v-shield"></div></div>
        </div>

        <div class="doll-house">
            <div class="hero-base">
                <div class="h-head"><div id="vis-helmet" class="vis-helm"></div></div>
                <div class="h-body">
                    <div id="vis-armor" class="vis-armor"></div>
                    <div id="vis-weapon" class="vis-weapon"></div>
                    <div id="vis-shield" class="vis-shield"></div>
                </div>
                <div class="h-legs">
                    <div class="h-leg"><div id="vis-shoes-l" class="vis-boot"></div></div>
                    <div class="h-leg"><div id="vis-shoes-r" class="vis-boot"></div></div>
                </div>
            </div>
            <div class="pet-base">
                <div class="p-body"></div><div class="p-head"></div>
                <div id="vis-collar" class="p-collar"></div>
                <div id="pet-emoji" style="position:absolute; top:5px; right:2px; font-size:20px;">🐕</div>
            </div>
            <div style="position:absolute; bottom:15px; width:100%; text-align:center;">
                <small>LVL <span id="lvl">1</span></small>
                <div style="width:100px; height:4px; background:#000; margin:4px auto; border-radius:2px; overflow:hidden;"><div id="xp-bar" style="width:0%; height:100%; background:var(--accent);"></div></div>
            </div>
        </div>

        <div class="slot-col">
            <div class="slot" id="s-armor" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor"></div></div>
            <div class="slot" id="s-shoes" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes"></div></div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
                <div class="slot" id="s-collar" onclick="unequip('collar')"><span class="slot-label">Pet Collar</span><div id="v-collar"></div></div>
                <div class="slot" id="s-pet" onclick="unequip('pet')"><span class="slot-label">Pet Type</span><div id="v-pet"></div></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>🎒 Inventory (Click to Equip)</h3>
        <div class="inv-grid" id="inv"></div>
    </div>

    <div class="panel">
        <h3>📜 Quest Log</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="qIn" style="flex:1; background:#0d1117; border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px;" placeholder="Add a new task...">
            <button class="btn btn-p" onclick="addQ()">Add Task</button>
        </div>
        <div id="qList"></div>

        <div class="history-container">
            <div class="q-row" style="cursor:pointer; background:rgba(255,255,255,0.02)" onclick="toggleHistory()">
                <span style="color:var(--success)">📜 VIEW ARCHIVED TASKS</span>
                <span id="hIcon">▼</span>
            </div>
            <div class="history-content" id="hist-content"></div>
        </div>
    </div>
</div>

<div id="battleM" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center;">
    <div class="panel" style="width:600px;">
        <div class="arena">
            <div class="floor"></div>
            <div class="combatant hero-team" id="hTeam">
                <div id="b-pet" style="font-size:30px; transform:scaleX(-1)">🐕</div>
                <div style="font-size:60px; transform:scaleX(-1)">🧑‍🚀</div>
            </div>
            <div class="combatant monster-pos">
                <div style="font-size:80px;">👾</div>
                <div style="width:100px; height:8px; background:#000; border-radius:4px; overflow:hidden;"><div id="mHp" style="width:100%; height:100%; background:var(--danger);"></div></div>
            </div>
        </div>
        <button id="atkBtn" class="btn btn-p" style="width:100%; margin-top:15px; font-size:1.1em;" onclick="fight()">STRIKE!</button>
        <button onclick="closeM('battleM')" class="btn" style="width:100%; margin-top:10px; background:#30363d; color:#fff;">RETREAT</button>
    </div>
</div>

<div id="shopM" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; align-items:center; justify-content:center;">
    <div class="panel" style="width:400px;">
        <h2>Village Shop</h2>
        <div class="q-row"><span>🧪 Heal Potion</span> <button class="btn btn-s" onclick="buy('pot')">50G</button></div>
        <button onclick="closeM('shopM')" class="btn" style="width:100%; margin-top:10px; background:#30363d; color:#fff;">Close</button>
    </div>
</div>

<script>
let state = {
    role: 'child', gold: 100, lvl: 1, xp: 0, hp: 100, mHp: 50, mMax: 50,
    quests: [], history: [], inv: [],
    equip: { helmet:null, weapon:null, shield:null, armor:null, shoes:null, collar:null, pet:{name:"Dog", icon:"🐕", slot:"pet"} }
};

const DROPS = [
    { name: "Iron Helm", icon: "🪖", slot: "helmet", cssId: "vis-helmet" },
    { name: "Iron Sword", icon: "⚔️", slot: "weapon", cssId: "vis-weapon" },
    { name: "Iron Plate", icon: "🛡️", slot: "armor", cssId: "vis-armor" },
    { name: "Wood Shield", icon: "🛡️", slot: "shield", cssId: "vis-shield" },
    { name: "Iron Boots", icon: "👢", slot: "shoes", cssId: "vis-shoes" },
    { name: "Red Collar", icon: "🎀", slot: "collar", cssId: "vis-collar" },
    { name: "Cat Companion", icon: "🐈", slot: "pet" }
];

function openM(id) { document.getElementById(id).style.display = 'flex'; }
function closeM(id) { document.getElementById(id).style.display = 'none'; }
function toggleHistory() { 
    const el = document.getElementById('hist-content');
    el.classList.toggle('open');
    document.getElementById('hIcon').innerText = el.classList.contains('open') ? '▲' : '▼';
}

function addQ() {
    const v = document.getElementById('qIn').value;
    if(!v) return;
    state.quests.push({txt: v, status: 'open'});
    document.getElementById('qIn').value = '';
    render();
}

function updateQ(i, s) {
    if(s === 'done') {
        const t = state.quests.splice(i, 1)[0];
        t.time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        state.history.unshift(t);
        state.gold += 50; state.xp += 40;
        if(Math.random() < 0.5) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
    } else state.quests[i].status = s;
    if(state.xp >= 100) { state.lvl++; state.xp -= 100; }
    render();
}

function fight() {
    const team = document.getElementById('hTeam');
    team.classList.add('lunge');
    setTimeout(() => {
        state.mHp -= 20;
        if(state.mHp <= 0) { state.gold += 30; state.mMax *= 1.2; state.mHp = state.mMax; closeM('battleM'); }
        team.classList.remove('lunge'); render();
    }, 400);
}

function equip(i) {
    const it = state.inv[i];
    const old = state.equip[it.slot];
    state.equip[it.slot] = it;
    state.inv.splice(i, 1);
    if(old) state.inv.push(old);
    render();
}

function unequip(slot) {
    if(state.equip[slot]) {
        state.inv.push(state.equip[slot]);
        state.equip[slot] = null;
        render();
    }
}

function buy(t) { if(t === 'pot' && state.gold >= 50) { state.gold -= 50; state.hp = 100; } render(); }

function render() {
    document.getElementById('gold').innerText = state.gold;
    document.getElementById('lvl').innerText = state.lvl;
    document.getElementById('xp-bar').style.width = state.xp + "%";
    document.getElementById('mHp').style.width = (state.mHp/state.mMax*100) + "%";

    // Equipment Visibility Logic
    const allVis = document.querySelectorAll('.vis-helm, .vis-armor, .vis-weapon, .vis-shield, .vis-boot, .p-collar');
    allVis.forEach(v => v.style.display = 'none');

    for(let s in state.equip) {
        const item = state.equip[s];
        if(document.getElementById('v-'+s)) document.getElementById('v-'+s).innerText = item ? item.icon : '';
        if(document.getElementById('s-'+s)) document.getElementById('s-'+s).className = item ? 'slot active' : 'slot';
        
        if(item && item.cssId) {
            if(item.slot === 'shoes') {
                document.getElementById('vis-shoes-l').style.display = 'block';
                document.getElementById('vis-shoes-r').style.display = 'block';
            } else {
                document.getElementById(item.cssId).style.display = 'block';
            }
        }
    }
    
    // Pet Special Case
    document.getElementById('pet-emoji').innerText = state.equip.pet ? state.equip.pet.icon : '';
    document.getElementById('b-pet').innerText = state.equip.pet ? state.equip.pet.icon : '';

    // Lists
    let qH = '';
    state.quests.forEach((q, i) => {
        let b = '';
        if(state.role === 'child' && q.status === 'open') b = `<button onclick="updateQ(${i},'pending')" class="btn btn-p">Submit</button>`;
        if(state.role === 'parent') {
            if(q.status === 'pending') b = `<button onclick="updateQ(${i},'done')" class="btn btn-s">Approve</button>`;
            b += ` <button onclick="state.quests.splice(${i},1); render();" class="btn" style="color:var(--danger)">×</button>`;
        }
        qH += `<div class="q-row"><span>${q.txt} <small>(${q.status})</small></span> ${b}</div>`;
    });
    document.getElementById('qList').innerHTML = qH || '<p style="text-align:center; opacity:0.5">No active tasks.</p>';

    let hH = '';
    state.history.forEach(h => hH += `<div class="q-row" style="font-size:0.8em; opacity:0.7"><span>✅ ${h.txt}</span> <span>${h.time}</span></div>`);
    document.getElementById('hist-content').innerHTML = hH;

    let iH = '';
    state.inv.forEach((it, i) => iH += `<div class="inv-item" onclick="equip(${i})"><strong>${it.icon}</strong><br>${it.name}</div>`);
    document.getElementById('inv').innerHTML = iH;
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid RPG - V16.9</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569; --purple: #a855f7; --heal: #fb7185;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow-x: hidden; }
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .app { max-width: 1000px; margin: 0 auto; padding: 10px; display: none; }
    
    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    .streak-badge { background: linear-gradient(to right, #f97316, #fbbf24); color: black; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 8px 15px; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    
    .stats-bar { display: flex; gap: 15px; font-size: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: var(--accent); justify-content: center; border: 1px solid var(--border); position: relative;}
    
    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 160px 1fr 160px; } }
    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
    
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; min-height: 60px; text-align: center; cursor: pointer; position: relative; }
    .slot-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 20px; height: 320px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; z-index: 5; }
    .h-head { width: 40px; height: 40px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
    .h-body { width: 55px; height: 70px; background: #3b82f6; border-radius: 8px; margin: 4px auto; }
    
    .panel { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--success); font-weight: bold; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; margin-top: 10px; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }
    
    .inv-section-title { font-size: 11px; color: var(--accent); margin: 10px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-left: 3px solid var(--accent); padding-left: 8px; }
    .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: var(--bg); border-radius: 10px; min-height: 60px; border: 1px solid var(--border); margin-bottom: 10px; }
    .inv-item { background: var(--card); min-width: 65px; padding: 10px; border-radius: 10px; border: 2px solid var(--border); text-align: center; cursor: pointer; position: relative; flex-shrink: 0; }
    
    .q-row { background: var(--bg); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid var(--border); }
    .pending-row { border: 1px solid var(--gold); background: rgba(251, 191, 36, 0.05); }
    
    .btn { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-sm { padding: 4px 8px; font-size: 10px; }
    
    .chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 100px; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 15px 5px 5px 5px; margin-top: 10px; gap: 2px; }
    .bar { width: 6px; border-radius: 2px 2px 0 0; }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color:var(--accent); letter-spacing: 2px;">QUEST KID</h1>
        <button class="btn btn-p" style="width:100%; padding:20px; margin-bottom:15px;" onclick="doLogin('child')">🧒 HERO LOGIN</button>
        <button class="btn" style="width:100%; padding:20px; background:var(--gold); color:black;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong id="roleLabel" style="color:var(--accent);">HERO</strong>
            <span id="streakDisplay" class="streak-badge">🔥 0 DAY STREAK</span>
            <button class="btn btn-sm" style="background:var(--success); color:black;" onclick="save()">💾 SAVE</button>
            <button class="btn btn-sm" style="background:var(--border);" onclick="location.reload()">EXIT</button>
        </div>
        <div id="heroStatsNav" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box">💰 <span id="goldVal">0</span></div>
            <button class="btn btn-p btn-sm" onclick="alert('Battle Logic Engaged!')">⚔️ BATTLE (<span id="tokenVal">0</span>)</button>
        </div>
    </div>

    <div id="childGameView">
        <div class="stats-bar">
            <span>⚔️ <b id="sAtk">0</b></span> | 🛡️ <b id="sDef">0</b> | ❤️ <b id="sHp">0/0</b>
            <button class="btn btn-sm" style="background:var(--heal); position:absolute; right:5px; top:5px;">🍷 HEAL</button>
        </div>
        <div class="char-grid">
            <div class="slot-col">
                <div class="slot"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
                <div class="slot"><span class="slot-label">Weapon</span><div id="v-weapon"></div></div>
            </div>
            <div class="doll-house">
                <div class="hero-base"><div class="h-head"></div><div class="h-body"></div></div>
                <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:11px;">
                    LVL <span id="lvlVal">1</span>
                    <div style="width:80px; height:4px; background:rgba(0,0,0,0.5); margin:4px auto; border-radius:2px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot"><span class="slot-label">Body</span><div id="v-armor"></div></div>
                <div class="slot"><span class="slot-label">Pet</span><div id="v-pet"></div></div>
            </div>
        </div>

        <button class="collapse-btn" onclick="toggleCol('inventoryBox')"><span>🎒 BAG & PETS</span><span>▼</span></button>
        <div id="inventoryBox" class="collapse-content show">
            <div class="panel" style="margin-top:0;">
                <div class="inv-section-title">⚔️ Equipment</div>
                <div id="gearGrid" class="inv-grid"></div>
                <div class="inv-section-title">🐾 Pets</div>
                <div id="petGrid" class="inv-grid"></div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3 id="questBoardTitle">📜 Quest Board</h3>
        <div id="parentQuestInput">
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <input id="qInput" class="p-input" style="flex:1;" placeholder="Enter new quest...">
                <select id="qDiff" class="p-input">
                    <option value="easy">Easy (25g)</option>
                    <option value="medium" selected>Medium (50g)</option>
                    <option value="hard">Hard (100g)</option>
                </select>
                <button class="btn btn-p" onclick="addQuest()" style="width:40px;">+</button>
            </div>
        </div>
        <div id="questList"></div>
    </div>

    <button class="collapse-btn" onclick="toggleCol('moneyBox')"><span>💵 MONEY & ANALYTICS</span><span>▼</span></button>
    <div id="moneyBox" class="collapse-content show">
        <div class="panel">
            <div style="text-align:center; font-size:20px; color:var(--gold); margin-bottom:10px;">Balance: $<span id="realBalance">0.00</span></div>
            <div id="chartContainer" class="chart-container"></div>
            <div id="ledger" style="margin-top:10px; max-height:150px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<script>
let state = { role:'child', gold:0, lvl:1, xp:0, hp:100, tokens:0, quests:[], inv:[], ledger:[], streak:0, lastDate:null };
const GEAR_DB = [{n:"Sword",i:"⚔️",s:"weapon"},{n:"Dog",i:"🐶",s:"pet"},{n:"Shield",i:"🛡️",s:"shield"}];

function save() { localStorage.setItem('QuestKid_Global_Save', JSON.stringify(state)); }
function load() {
    const s = localStorage.getItem('QuestKid_Global_Save');
    if(s) state = JSON.parse(s);
    render();
}

function doLogin(r) { state.role = r; document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; render(); }

function addQuest() {
    const txt = document.getElementById('qInput').value;
    if(!txt) return;
    state.quests.push({ id: Date.now(), txt: txt, tier: document.getElementById('qDiff').value, status: 'open' });
    document.getElementById('qInput').value = '';
    render();
}

// THE FIX: Status management functions
function setQuestStatus(id, newStatus) {
    const q = state.quests.find(x => x.id === id);
    if(q) q.status = newStatus;
    render();
}

function approveQuest(id) {
    const idx = state.quests.findIndex(x => x.id === id);
    const q = state.quests.splice(idx, 1)[0];
    const rewards = { easy: 25, medium: 50, hard: 100 };
    state.gold += rewards[q.tier];
    state.xp += 20;
    state.tokens++;
    state.ledger.push({ date: new Date().toLocaleDateString(), amt: rewards[q.tier]/10, desc: `Quest: ${q.txt}`, type: 'income' });
    render();
}

function render() {
    const isP = state.role === 'parent';
    document.getElementById('roleLabel').innerText = isP ? "👑 PARENT" : "🛡️ HERO";
    document.getElementById('childGameView').style.display = isP ? 'none' : 'block';
    document.getElementById('parentQuestInput').style.display = isP ? 'block' : 'none';
    document.getElementById('goldVal').innerText = state.gold;
    document.getElementById('tokenVal').innerText = state.tokens;
    
    // Quest Rendering Logic
    let qH = '';
    state.quests.forEach(q => {
        let actionBtn = '';
        if (isP) {
            // Parent sees APPROVE/REJECT if pending, or DELETE if open
            if (q.status === 'pending') {
                actionBtn = `
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-sm" style="background:var(--success); color:black;" onclick="approveQuest(${q.id})">APPROVE</button>
                        <button class="btn btn-sm" style="background:var(--danger);" onclick="setQuestStatus(${q.id}, 'open')">REJECT</button>
                    </div>`;
            } else {
                actionBtn = `<button class="btn btn-sm" style="background:var(--danger);" onclick="state.quests = state.quests.filter(x=>x.id!==${q.id}); render();">DELETE</button>`;
            }
        } else {
            // Child sees DONE if open, or RECALL if pending
            if (q.status === 'open') {
                actionBtn = `<button class="btn btn-p btn-sm" onclick="setQuestStatus(${q.id}, 'pending')">DONE</button>`;
            } else {
                actionBtn = `
                    <div style="text-align:right;">
                        <span style="font-size:9px; color:var(--gold); display:block;">PENDING...</span>
                        <button class="btn btn-sm" style="background:var(--danger); margin-top:3px;" onclick="setQuestStatus(${q.id}, 'open')">RECALL</button>
                    </div>`;
            }
        }

        qH += `
            <div class="q-row ${q.status === 'pending' ? 'pending-row' : ''}">
                <div>
                    <span style="font-size:10px; color:var(--accent); font-weight:bold;">${q.tier.toUpperCase()}</span><br>
                    ${q.txt}
                </div>
                ${actionBtn}
            </div>`;
    });
    document.getElementById('questList').innerHTML = qH || '<div style="opacity:0.5; text-align:center;">No quests active.</div>';

    // Inventory Sorting
    const gear = state.inv.filter(x => x.s !== 'pet');
    const pets = state.inv.filter(x => x.s === 'pet');
    document.getElementById('gearGrid').innerHTML = gear.map(i => `<div class="inv-item">${i.i}</div>`).join('');
    document.getElementById('petGrid').innerHTML = pets.map(i => `<div class="inv-item">${i.i}</div>`).join('');

    // Money Tracker
    let bal = 0;
    document.getElementById('ledger').innerHTML = state.ledger.map(l => {
        bal += l.amt;
        return `<div style="font-size:11px; border-bottom:1px solid #334155; padding:4px 0;">$${l.amt.toFixed(2)} - ${l.desc}</div>`;
    }).reverse().join('');
    document.getElementById('realBalance').innerText = bal.toFixed(2);

    save();
}

function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }

load();
</script>
</body>
</html>

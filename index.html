<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569;
      --iron: #94a3b8; --wood: #b45309; --steel: #cbd5e1;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    .app { max-width: 1100px; margin: 0 auto; padding: 10px; }

    /* Compact Nav */
    .nav { display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; align-items: center; justify-content: space-between; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 4px 10px; border-radius: 15px; border: 1px solid var(--gold); }
    .token-box { color: var(--accent); font-weight: bold; background: #082f49; padding: 4px 10px; border-radius: 15px; border: 1px solid var(--accent); }
    .nav-btns { display: flex; gap: 5px; width: 100%; margin-top: 5px; }
    .nav-btns .btn { padding: 8px; flex: 1; font-size: 12px; }

    /* Layout */
    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 150px 1fr 150px; } }

    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }

    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 10px; padding: 8px; min-height: 50px; text-align: center; cursor: pointer; }
    .slot.active { border: 1px solid var(--accent); background: #1e293b; }
    .slot-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 2px; }

    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 16px; height: 300px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; z-index: 10; }
    .h-head { width: 35px; height: 35px; background: #fbbf24; border-radius: 50%; margin: 0 auto; position: relative; }
    .h-body { width: 50px; height: 60px; background: #0ea5e9; border-radius: 6px; margin: 3px auto; position: relative; }
    .h-legs { display: flex; justify-content: space-around; width: 40px; margin: 0 auto; }
    .h-leg { width: 15px; height: 40px; background: #1e40af; border-radius: 3px; }

    /* Inventory & Collapsibles */
    .panel { background: var(--card); padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: none; border: none; color: var(--accent); font-weight: bold; padding: 5px 0; cursor: pointer; display: flex; justify-content: space-between; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }

    .inv-grid { display: flex; gap: 8px; padding: 5px; overflow-x: auto; background: var(--bg); border-radius: 8px; min-height: 60px; border: 1px solid var(--border); }
    .inv-item { background: var(--card); min-width: 60px; padding: 6px; border-radius: 8px; border: 1px solid var(--border); text-align: center; font-size: 10px; cursor: pointer; }

    /* Buttons */
    .btn { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-s { background: var(--gold); color: #451a03; }
    .btn-danger { background: var(--danger); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--iron); font-size: 10px !important; }
    .q-row { background: var(--bg); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border: 1px solid var(--border); }
    .q-btns { display: flex; gap: 4px; }

    /* Battle/Shop Modals */
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; align-items:center; justify-content:center; padding: 15px; }
    .arena { position: relative; width: 100%; height: 200px; background: #064e3b; border-radius: 10px; overflow: hidden; border: 1px solid #065f46; }
    .floor { position: absolute; bottom: 0; width: 100%; height: 80px; background: linear-gradient(to bottom, #059669 1px, transparent 1px); opacity: 0.2; }
    .combatant { position: absolute; transition: 0.3s; }
    .hero-team { bottom: 20px; left: 20px; display: flex; align-items: flex-end; gap: 5px; }
    .monster-pos { top: 30px; right: 30px; text-align: center; }
    .hp-bar-container { width: 60px; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); margin-top: 3px; }
  </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:8px;">
          <strong style="color: var(--accent);">🛡️ QUEST KID</strong>
          <button class="btn btn-ghost" onclick="resetSave()">RESET</button>
        </div>
        
        <select onchange="state.role=this.value; render();" id="roleSelect" style="background:var(--card); border:1px solid var(--border); color:white; border-radius:6px; padding:4px;">
            <option value="child">Child</option>
            <option value="parent">Parent</option>
        </select>
        
        <div style="display:flex; gap:8px;">
          <div class="token-box">🎫 <span id="tokens">0</span>/3</div>
          <div class="gold-box">💰 <span id="gold">0</span></div>
        </div>
        
        <div class="nav-btns">
          <button class="btn btn-s" onclick="openM('shopM')">🛒 SHOP</button>
          <button id="battleBtn" class="btn btn-p" onclick="startBattle()">⚔️ BATTLE</button>
        </div>
    </div>

    <div class="char-grid">
        <div class="slot-col">
            <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
            <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Wpn</span><div id="v-weapon"></div></div>
            <div class="slot" onclick="unequip('shield')"><span class="slot-label">Off</span><div id="v-shield"></div></div>
        </div>

        <div class="doll-house">
            <div class="hero-base">
                <div class="h-head"><div id="vis-helmet" style="display:none; width:38px; height:20px; background:var(--iron); border-radius:15px 15px 0 0; position:absolute; top:-2px;"></div></div>
                <div class="h-body">
                    <div id="vis-armor" style="display:none; width:54px; height:64px; background:var(--iron); border-radius:6px; position:absolute; top:-2px; left:-2px;"></div>
                </div>
            </div>
            <div style="position:absolute; bottom:10px; width:100%; text-align:center;">
                <strong style="color: var(--accent); font-size: 11px;">HP: <span id="h-hp-text">100</span> | LVL <span id="lvl">1</span></strong>
                <div style="width:80px; height:4px; background:#0f172a; margin:4px auto; border-radius:2px; overflow:hidden; border: 1px solid var(--border);">
                    <div id="xp-bar" style="width:0%; height:100%; background:var(--accent);"></div>
                </div>
            </div>
        </div>

        <div class="slot-col">
            <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor"></div></div>
            <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes"></div></div>
            <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet"></div></div>
        </div>
    </div>

    <div class="panel">
        <button class="collapse-btn" onclick="toggleCol('invItems')">🎒 GEAR & ITEMS <span>▼</span></button>
        <div id="invItems" class="collapse-content show"><div id="invGrid" class="inv-grid"></div></div>
        
        <button class="collapse-btn" onclick="toggleCol('invPets')" style="margin-top:10px;">🐾 PET COLLECTION <span>▼</span></button>
        <div id="invPets" class="collapse-content"><div id="petGrid" class="inv-grid"></div></div>
    </div>

    <div class="panel">
        <h3 style="margin:0 0 8px 0; font-size:14px;">📜 Quests</h3>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <input id="qIn" style="background:var(--bg); border:1px solid var(--border); color:white; padding:8px; border-radius:6px; flex:1;" placeholder="New task...">
            <button class="btn btn-p" onclick="addQ()" style="width:40px;">+</button>
        </div>
        <div id="qList"></div>

        <button class="collapse-btn" onclick="toggleCol('completedLog')" style="margin-top:10px; color:var(--success)">🌟 COMPLETED <span>▼</span></button>
        <div id="completedLog" class="collapse-content"><div id="hList"></div></div>
    </div>
</div>

<div id="shopM" class="modal-overlay" onclick="if(event.target==this) closeM('shopM')">
    <div class="panel" style="width:90%; max-width:300px;">
        <h3 style="text-align:center; margin:0 0 10px 0;">🛒 Shop</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div style="background:var(--bg); padding:10px; border-radius:8px; text-align:center;">
                🧪<br><small>Heal 50</small><br>
                <button class="btn btn-p" style="width:100%; margin-top:5px;" onclick="buyItem('potion')">20💰</button>
            </div>
            <div style="background:var(--bg); padding:10px; border-radius:8px; text-align:center;">
                🎁<br><small>Random</small><br>
                <button class="btn btn-s" style="width:100%; margin-top:5px;" onclick="buyItem('chest')">100💰</button>
            </div>
        </div>
        <button class="btn" style="margin-top:10px; width:100%; background:var(--border);" onclick="closeM('shopM')">Back</button>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" style="width:95%; max-width:400px;">
        <div class="arena">
            <div class="floor"></div>
            <div class="combatant hero-team" id="hTeam">
                <div style="width:30px; height:60px; background:var(--accent); border-radius:4px;"></div>
                <div class="hp-bar-container" style="position:absolute; bottom:-10px;"><div id="hHp" style="width:100%; height:100%; background:var(--success);"></div></div>
            </div>
            <div class="combatant monster-pos" id="mTeam">
                <div id="mEmoji" style="font-size:40px;">👾</div>
                <div class="hp-bar-container"><div id="mHp" style="width:100%; height:100%; background:var(--danger);"></div></div>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:5px; margin-top:10px;">
            <button id="atkBtn" class="btn btn-p" onclick="heroAttack()">⚔️ STRIKE</button>
            <button class="btn btn-s" onclick="usePotionInBattle()">🧪</button>
            <button class="btn" style="background:var(--border);" onclick="closeM('battleM')">🏃</button>
        </div>
    </div>
</div>

<script>
const DROPS = [
    { name: "Helm", icon: "🪖", slot: "helmet", cssId: "vis-helmet" },
    { name: "Sword", icon: "⚔️", slot: "weapon" },
    { name: "Plate", icon: "🛡️", slot: "armor", cssId: "vis-armor" },
    { name: "Shield", icon: "🛡️", slot: "shield" },
    { name: "Boots", icon: "👢", slot: "shoes" },
    { name: "Cat", icon: "🐱", slot: "pet", type: "cat", color: "#fdba74" },
    { name: "Dragon", icon: "🐲", slot: "pet", type: "dragon", color: "#4ade80" }
];

let state = {
    role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, maxHp: 100, tokens: 0,
    mHp: 50, mMax: 50, quests: [], history: [], inv: [],
    equip: { helmet:null, weapon:null, shield:null, armor:null, shoes:null, pet:null }
};

function saveGame() { localStorage.setItem('questKidV3', JSON.stringify(state)); }
function loadGame() {
    const saved = localStorage.getItem('questKidV3');
    if (saved) state = JSON.parse(saved);
    render();
}
function resetSave() { if(confirm("Start a new game? This clears all progress.")) { localStorage.clear(); location.reload(); } }

function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }
function openM(id) { document.getElementById(id).style.display = 'flex'; }
function closeM(id) { document.getElementById(id).style.display = 'none'; }

function buyItem(type) {
    if (type === 'potion' && state.gold >= 20) { state.gold -= 20; state.inv.push({ name: "Potion", icon: "🧪", type: "consumable" }); }
    if (type === 'chest' && state.gold >= 100) { state.gold -= 100; state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]); }
    saveGame(); render();
}

function addQ() {
    const v = document.getElementById('qIn').value;
    if(!v) return;
    state.quests.push({txt: v, status: 'open'});
    document.getElementById('qIn').value = '';
    saveGame(); render();
}

function updateQ(i, s) {
    if(s === 'done') {
        const q = state.quests.splice(i, 1)[0];
        state.history.push(q);
        state.gold += 50; state.xp += 40; state.tokens += 1;
        if(Math.random() < 0.4) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
    } else {
        state.quests[i].status = s;
    }
    if(state.xp>=100) { state.lvl++; state.xp-=100; }
    saveGame(); render();
}

function startBattle() {
    if(state.tokens < 3) return;
    state.tokens -= 3; state.mMax = 50 + (state.lvl * 10); state.mHp = state.mMax;
    openM('battleM'); render();
}

function heroAttack() {
    document.getElementById('hTeam').style.transform = 'translateX(50px)';
    setTimeout(() => {
        state.mHp -= 20;
        document.getElementById('hTeam').style.transform = 'translateX(0)';
        render();
        if(state.mHp <= 0) { alert("Win!"); closeM('battleM'); state.gold+=30; saveGame(); render(); }
    }, 200);
}

function handleInv(i) {
    const it = state.inv[i];
    if(it.type === 'consumable') { state.hp = Math.min(state.maxHp, state.hp + 50); state.inv.splice(i, 1); }
    else {
        const old = state.equip[it.slot];
        state.equip[it.slot] = it;
        state.inv.splice(i, 1);
        if(old) state.inv.push(old);
    }
    saveGame(); render();
}

function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; saveGame(); render(); } }

function render() {
    document.getElementById('gold').innerText = state.gold;
    document.getElementById('tokens').innerText = state.tokens;
    document.getElementById('lvl').innerText = state.lvl;
    document.getElementById('h-hp-text').innerText = state.hp;
    document.getElementById('xp-bar').style.width = state.xp + "%";
    document.getElementById('mHp').style.width = (state.mHp/state.mMax*100) + "%";
    document.getElementById('hHp').style.width = (state.hp/state.maxHp*100) + "%";

    for(let s in state.equip) {
        document.getElementById('v-'+s).innerText = state.equip[s] ? state.equip[s].icon : '';
        const vis = document.getElementById('vis-'+s);
        if(vis) vis.style.display = state.equip[s] ? 'block' : 'none';
    }

    let qH = '';
    state.quests.forEach((q, i) => {
        let b = '';
        if(state.role === 'child') {
            if(q.status === 'open') b = `<button onclick="updateQ(${i},'pending')" class="btn btn-p" style="padding:4px 8px">Send</button>`;
            else if(q.status === 'pending') b = `<button onclick="updateQ(${i},'open')" class="btn btn-danger" style="padding:4px 8px">↩️</button>`;
        } else {
            if(q.status === 'pending') b = `
                <div class="q-btns">
                    <button onclick="updateQ(${i},'done')" class="btn btn-p" style="padding:4px 8px">✅</button>
                    <button onclick="updateQ(${i},'open')" class="btn btn-danger" style="padding:4px 8px">❌</button>
                </div>`;
        }
        qH += `<div class="q-row"><span>${q.txt} ${q.status==='pending'?'⏳':''}</span>${b}</div>`;
    });
    document.getElementById('qList').innerHTML = qH;

    let hH = '';
    state.history.forEach(h => hH += `<div class="q-row" style="opacity:0.6"><span>✅ ${h.txt}</span></div>`);
    document.getElementById('hList').innerHTML = hH;

    let gearH = '', petH = '';
    state.inv.forEach((it, i) => {
        const html = `<div class="inv-item" onclick="handleInv(${i})"><div>${it.icon}</div><b>${it.name}</b></div>`;
        if(it.slot === 'pet') petH += html; else gearH += html;
    });
    document.getElementById('invGrid').innerHTML = gearH || '<small>Empty</small>';
    document.getElementById('petGrid').innerHTML = petH || '<small>No pets</small>';
}

loadGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>RPG Quest Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #020617;
      color: white;
    }

    h1 {
      text-align: center;
      color: gold;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
    }

    .avatar {
      position: relative;
      width: 150px;
      height: 150px;
      margin: auto;
    }

    .layer {
      position: absolute;
      image-rendering: pixelated;
    }

    /* equipment positioning */
    #base { width: 100%; }
    #helmet { top: 0; left: 25px; width: 60%; }
    #chest { top: 40px; left: 25px; width: 60%; }
    #weapon { top: 50px; left: 90px; width: 40%; }
    #shoes { top: 90px; left: 35px; width: 50%; }

    .pet {
      position: absolute;
      right: -50px;
      bottom: 0;
      width: 60px;
    }

    .inventory {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .item {
      border: 1px solid #334155;
      padding: 5px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .battle {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bar {
      height: 10px;
      background: #1e293b;
      margin: 5px 0;
    }

    .fill {
      height: 100%;
      background: red;
    }

  </style>
</head>

<body>

<h1>⚔️ RPG QUEST GAME</h1>

<div class="layout">

  <!-- CHARACTER -->
  <div class="panel">
    <h3>Character</h3>

    <div class="avatar">
      <img id="base" class="layer" src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png">
      <img id="helmet" class="layer">
      <img id="chest" class="layer">
      <img id="weapon" class="layer">
      <img id="shoes" class="layer">
      <img id="pet" class="pet" src="https://kenney.nl/assets/animal-pack/PNG/Round/bee.png">
    </div>

    <div id="stats"></div>
  </div>

  <!-- QUESTS -->
  <div class="panel">
    <h3>Quests</h3>
    <input id="questInput">
    <button onclick="addQuest()">Add</button>
    <div id="quests"></div>
  </div>

  <!-- BATTLE -->
  <div class="panel">
    <h3>Battle</h3>

    <div class="battle">
      <div>
        <img src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png" width="80">
        <div class="bar"><div id="playerHP" class="fill"></div></div>
      </div>

      <div>
        <img id="monster" src="https://kenney.nl/assets/monster-pack/PNG/Slime/slimeBlock.png" width="80">
        <div class="bar"><div id="monsterHP" class="fill"></div></div>
      </div>
    </div>

    <button onclick="attack()">Attack</button>
    <div id="battleLog"></div>

    <h3>Inventory</h3>
    <div id="inventory" class="inventory"></div>
  </div>

</div>

<script>
let player={
  hp:100,
  maxHp:100,
  atk:5,
  helmet:null,
  chest:null,
  weapon:null,
  shoes:null,
  inventory:[]
};

let monster={
  hp:50,
  maxHp:50
};

let quests=[];

function addQuest(){
  let text=document.getElementById("questInput").value;
  quests.push({text});
  render();
}

function attack(){
  let damage=totalAttack();
  monster.hp-=damage;

  if(monster.hp<=0){
    log("Monster defeated!");
    monster.hp=monster.maxHp;
    reward();
  } else {
    player.hp-=Math.random()*10;
    log("You hit for "+damage);
  }

  render();
}

function reward(){
  if(Math.random()<0.5){
    player.inventory.push(rollLoot());
  }
}

function rollLoot(){
  let r=Math.random();

  if(r<0.25) return {type:"helmet",img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/hat.png"};
  if(r<0.5) return {type:"chest",img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/shirt.png"};
  if(r<0.75) return {type:"shoes",img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/shoes.png"};
  return {type:"weapon",img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/sword.png"};
}

function equip(item){
  player[item.type]=item;
  render();
}

function totalAttack(){
  return player.atk + (player.weapon?3:0);
}

function log(text){
  document.getElementById("battleLog").innerHTML+=text+"<br>";
}

function render(){

  document.getElementById("playerHP").style.width=
    (player.hp/player.maxHp*100)+"%";

  document.getElementById("monsterHP").style.width=
    (monster.hp/monster.maxHp*100)+"%";

  document.getElementById("helmet").src=player.helmet?player.helmet.img:"";
  document.getElementById("chest").src=player.chest?player.chest.img:"";
  document.getElementById("weapon").src=player.weapon?player.weapon.img:"";
  document.getElementById("shoes").src=player.shoes?player.shoes.img:"";

  let inv="";
  player.inventory.forEach(i=>{
    inv+=`<div class="item" onclick='equip(${JSON.stringify(i)})'>
      <img src="${i.img}" width="30">
    </div>`;
  });

  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

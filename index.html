<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Kid RPG - V17.5 Financial Edition</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
            --slot: #334155; --border: #475569; --heal: #fb7185;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow-x: hidden; }
        .app { max-width: 1000px; margin: 0 auto; padding: 10px; }
        
        /* Navigation */
        .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .streak-badge { background: linear-gradient(to right, #f97316, #fbbf24); color: black; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 8px 15px; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        .stats-bar { display: flex; gap: 15px; font-size: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: var(--accent); justify-content: center; border: 1px solid var(--border); position: relative;}
        
        /* Hero View (V16.4 Core) */
        .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 768px) { .char-grid { grid-template-columns: 160px 1fr 160px; } }
        .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
        
        .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; min-height: 60px; text-align: center; cursor: pointer; position: relative; }
        .slot-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
        .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 20px; height: 320px; position: relative; border: 1px solid var(--border); overflow: hidden; }
        .hero-base { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; z-index: 5; }
        .h-head { width: 40px; height: 40px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
        .h-body { width: 55px; height: 70px; background: #3b82f6; border-radius: 8px; margin: 4px auto; }
        
        /* Layout Panels */
        .panel { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid var(--border); }
        .collapse-btn { width: 100%; text-align: left; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--success); font-weight: bold; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; margin-top: 10px; }
        .collapse-content { display: none; margin-top: 10px; }
        .collapse-content.show { display: block; }
        
        /* Inventory System (V16.4 Strict Split) */
        .inv-section-title { font-size: 11px; color: var(--accent); margin: 10px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-left: 3px solid var(--accent); padding-left: 8px; }
        .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: var(--bg); border-radius: 10px; min-height: 60px; border: 1px solid var(--border); margin-bottom: 10px; }
        .inv-item { background: var(--card); min-width: 65px; padding: 10px; border-radius: 10px; border: 2px solid var(--border); text-align: center; cursor: pointer; position: relative; flex-shrink: 0; }
        .lvl-tag { position: absolute; top: -8px; right: -8px; background: var(--gold); color: black; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }

        /* Money Tracker & Analytics (New Additions) */
        .balance-display { font-size: 22px; font-weight: bold; color: var(--gold); text-align: center; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }
        .tracker-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
        .type-income { color: var(--success); font-weight: bold; }
        .type-expense { color: var(--danger); font-weight: bold; }
        
        .chart-container { display: flex; align-items: flex-end; justify-content: space-around; height: 140px; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 25px 10px 10px 10px; margin-top: 10px; border: 1px solid var(--border); gap: 4px; }
        .chart-bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; height: 100%; justify-content: flex-end; }
        .bar-stack { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; }
        .bar { width: 50%; border-radius: 2px 2px 0 0; min-height: 2px; transition: height 0.5s ease; }
        .bar.income { background: var(--success); box-shadow: 0 0 5px var(--success); }
        .bar.expense { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
        .chart-label { font-size: 8px; color: #94a3b8; margin-top: 4px; transform: rotate(-45deg); height: 15px; }

        /* Quests & Form UI */
        .q-row { background: var(--bg); padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid var(--border); }
        .btn { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-p { background: var(--accent); color: #0f172a; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 4px 8px; font-size: 10px; }
        .p-input { background:var(--bg); border:1px solid var(--border); color:white; padding:10px; border-radius:8px; font-size: 13px; }

        /* Modals */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:4000; align-items:center; justify-content:center; padding: 10px; }
        .modal-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

<div class="app">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong style="color:var(--accent); letter-spacing:1px;">HERO'S JOURNEY</strong>
            <span id="streakDisplay" class="streak-badge">🔥 0 DAY STREAK</span>
            <button class="btn btn-sm" style="background:var(--success); color:black;" onclick="save()">💾 SAVE</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box" onclick="openShop()">💰 <span id="goldVal">0</span></div>
            <button class="btn btn-p" onclick="startBattle()" style="padding:6px 12px; font-size:12px;">⚔️ BATTLE (<span id="tokenVal">0</span>/3)</button>
        </div>
    </div>

    <div class="stats-bar">
        <span>⚔️ ATK: <b id="sAtk">0</b></span> | 🛡️ DEF: <b id="sDef">0</b> | ❤️ HP: <b id="sHp">0/0</b>
        <button class="btn btn-sm" style="background:var(--heal); padding:2px 8px; position:absolute; right:10px; top:10px;" onclick="usePotion()">🍷 HEAL (<span id="potCount">0</span>)</button>
    </div>

    <div class="char-grid">
        <div class="slot-col">
            <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet" style="font-size:24px;"></div></div>
            <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Weapon</span><div id="v-weapon" style="font-size:24px;"></div></div>
        </div>
        <div class="doll-house">
            <div class="hero-base"><div class="h-head"></div><div class="h-body"></div></div>
            <div style="position:absolute; bottom:15px; width:100%; text-align:center; font-size:12px;">
                LVL <span id="lvlVal">1</span>
                <div style="width:100px; height:5px; background:rgba(0,0,0,0.5); margin:5px auto; border-radius:3px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                <div id="bossInfo" style="font-size:9px; color:var(--gold);">Boss in: <span id="bossCounter">5</span></div>
            </div>
        </div>
        <div class="slot-col">
            <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor" style="font-size:24px;"></div></div>
            <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet" style="font-size:24px;"></div></div>
        </div>
    </div>

    <button class="collapse-btn" onclick="toggleCol('inventoryBox')"><span>🎒 BAG & PETS</span><span>▼</span></button>
    <div id="inventoryBox" class="collapse-content show">
        <div class="panel" style="margin-top:0; border-top:none; border-radius:0 0 15px 15px;">
            <div class="inv-section-title">⚔️ Equipment</div>
            <div id="gearGrid" class="inv-grid"></div>
            <div class="inv-section-title">🐾 Pets</div>
            <div id="petGrid" class="inv-grid"></div>
        </div>
    </div>

    <div class="panel">
        <h3>📜 Quest Board</h3>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <input id="qInput" class="p-input" style="flex:1;" placeholder="New task...">
            <select id="qDiff" class="p-input">
                <option value="easy">Easy (25g)</option>
                <option value="medium" selected>Medium (50g)</option>
                <option value="hard">Hard (100g)</option>
            </select>
            <button class="btn btn-p" onclick="addQuest()" style="width:50px; font-size:20px;">+</button>
        </div>
        <div id="questList"></div>
    </div>

    <button class="collapse-btn" onclick="toggleCol('moneyBox')" style="color:var(--gold); border-color:var(--gold);"><span>💵 MONEY SPENDER TRACKER</span><span>▼</span></button>
    <div id="moneyBox" class="collapse-content show">
        <div class="panel">
            <div class="balance-display">TOTAL SAVINGS: $<span id="realBalance">0.00</span></div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                <span style="font-size:11px; font-weight:bold; color:var(--accent);">YEARLY PERFORMANCE</span>
                <select id="chartYear" class="p-input" style="padding:4px 8px; font-size:11px;" onchange="render()"></select>
            </div>
            <div id="chartContainer" class="chart-container"></div>
            
            <div style="margin-top:20px; background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; border:1px solid var(--border);">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                    <div>
                        <label style="font-size:10px; display:block; margin-bottom:4px;">DATE & MONTH</label>
                        <input id="mDate" type="date" class="p-input" style="width:100%;">
                    </div>
                    <div>
                        <label style="font-size:10px; display:block; margin-bottom:4px;">TYPE</label>
                        <select id="mType" class="p-input" style="width:100%;">
                            <option value="income">Income (+)</option>
                            <option value="expense">Expense (-)</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <input id="mDesc" class="p-input" style="flex:2;" placeholder="Description (e.g. Allowance, Toy)">
                    <input id="mAmt" type="number" class="p-input" style="flex:1;" placeholder="$ 0.00">
                    <button class="btn btn-p" onclick="addTrans()" style="padding:0 20px;">ADD</button>
                </div>
            </div>

            <h4 style="margin:20px 0 10px 0;">Transaction History</h4>
            <div id="ledgerList" style="max-height:250px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="modal-card" style="text-align:center;">
        <h2 id="battleTitle">ENEMY SPOTTED!</h2>
        <div id="battleArena" style="height:150px; border-radius:15px; margin-bottom:15px; display:flex; align-items:center; justify-content:center; font-size:60px; border: 2px solid var(--border);"></div>
        <div style="margin-bottom:10px; font-weight:bold;">HP: <span id="eHp">0</span></div>
        <div id="battleLog" style="height:60px; font-size:11px; overflow-y:auto; background:rgba(0,0,0,0.2); margin-bottom:15px; padding:5px; border-radius:5px;"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="btn btn-p" style="padding:15px;" onclick="attack()">⚔️ ATTACK</button>
            <button id="fleeBtn" class="btn btn-danger" onclick="flee()">🏃 FLEE (<span id="fleeCount">0</span>)</button>
        </div>
    </div>
</div>

<div id="shopM" class="modal-overlay">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>🏪 SHOP</h3><button onclick="closeModals()" style="background:none; border:none; color:white; font-size:20px;">❌</button></div>
        <div id="shopList"></div>
    </div>
</div>
<div id="itemM" class="modal-overlay">
    <div class="modal-card" id="itemDetails"></div>
</div>

<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let state = { 
    gold:0, lvl:1, xp:0, hp:100, tokens:0, potions:0, fleeTokens:1, 
    quests:[], history:[], inv:[], ledger:[], streak:0, lastDate:null, battleCount:0,
    equip: {helmet:null, weapon:null, shield:null, armor:null, pet:null}
};
let curE = null;

function save() { localStorage.setItem('QuestKid_V17_Spender', JSON.stringify(state)); }
function load() {
    const s = localStorage.getItem('QuestKid_V17_Spender');
    if(s) state = JSON.parse(s);
    document.getElementById('mDate').valueAsDate = new Date();
    populateYearSelect();
    render();
}

function populateYearSelect() {
    const s = document.getElementById('chartYear');
    const y = new Date().getFullYear();
    for(let i = y-2; i <= y+1; i++) {
        let o = document.createElement('option'); o.value = i; o.text = i;
        if(i === y) o.selected = true;
        s.appendChild(o);
    }
}

function render() {
    const atk = 5 + (state.lvl * 3) + (state.equip.weapon ? state.equip.weapon.v : 0);
    const def = 2 + (state.lvl * 2) + (state.equip.armor ? state.equip.armor.v : 0);
    const maxHp = 100 + (state.lvl * 25);

    document.getElementById('goldVal').innerText = state.gold;
    document.getElementById('tokenVal').innerText = state.tokens;
    document.getElementById('sAtk').innerText = atk;
    document.getElementById('sDef').innerText = def;
    document.getElementById('sHp').innerText = Math.floor(state.hp) + "/" + maxHp;
    document.getElementById('lvlVal').innerText = state.lvl;
    document.getElementById('xpBar').style.width = (state.xp / (state.lvl * 100)) * 100 + "%";
    document.getElementById('potCount').innerText = state.potions;
    document.getElementById('bossCounter').innerText = 5 - (state.battleCount % 5);
    document.getElementById('streakDisplay').innerText = `🔥 ${state.streak} DAY STREAK`;

    // Quests (V16.4)
    document.getElementById('questList').innerHTML = state.quests.map(q => `
        <div class="q-row">
            <div><span style="font-size:10px; color:var(--accent);">${q.tier.toUpperCase()}</span><br>${q.txt}</div>
            <button class="btn btn-p btn-sm" onclick="completeQuest(${q.id})">DONE</button>
        </div>`).join('') || '<div style="opacity:0.5; text-align:center;">No active quests.</div>';

    // Inventory (V16.4 Strict Split)
    const gear = state.inv.filter(x => x.s !== 'pet');
    const pets = state.inv.filter(x => x.s === 'pet');
    const buildInv = (arr) => arr.map((item) => `<div class="inv-item" onclick="openItemMenu(${state.inv.indexOf(item)})">${item.v>0?`<div class="lvl-tag">+${item.v}</div>`:''}<div style="font-size:24px;">${item.i}</div></div>`).join('');
    
    document.getElementById('gearGrid').innerHTML = buildInv(gear);
    document.getElementById('petGrid').innerHTML = buildInv(pets);
    for(let s in state.equip) document.getElementById('v-'+s).innerHTML = state.equip[s] ? state.equip[s].i : '';

    // MONEY TRACKER & ANALYTICS
    let bal = 0;
    const year = parseInt(document.getElementById('chartYear').value);
    const monthly = Array.from({length:12}, () => ({i:0, e:0}));
    
    let lH = '';
    state.ledger.forEach(t => {
        const d = new Date(t.date);
        bal += (t.type === 'income' ? t.amt : -t.amt);
        if(d.getFullYear() === year) monthly[d.getMonth()][t.type === 'income' ? 'i' : 'e'] += t.amt;
        lH += `<div class="tracker-row">
            <div>
                <span class="type-${t.type}">${t.type === 'income' ? '+' : '-'}$${t.amt.toFixed(2)}</span>
                <div style="font-size:10px; opacity:0.6;">${t.desc} (${t.date})</div>
            </div>
            <button onclick="deleteTrans(${t.id})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px;">🗑️</button>
        </div>`;
    });
    document.getElementById('realBalance').innerText = bal.toFixed(2);
    document.getElementById('ledgerList').innerHTML = lH || '<div style="text-align:center; opacity:0.5;">No transactions yet.</div>';

    // Bar Graph Generation
    let maxVal = 1; monthly.forEach(m => maxVal = Math.max(maxVal, m.i, m.e));
    document.getElementById('chartContainer').innerHTML = monthly.map((m, i) => `
        <div class="chart-bar-group">
            <div class="bar-stack">
                <div class="bar income" style="height:${(m.i/maxVal)*100}%"></div>
                <div class="bar expense" style="height:${(m.e/maxVal)*100}%"></div>
            </div>
            <div class="chart-label">${MONTHS[i]}</div>
        </div>`).join('');

    save();
}

// RPG MECHANICS (V16.4)
function startBattle() {
    if(state.tokens <= 0) return alert("Earn Battle Tokens via Quests!");
    const isBoss = (state.battleCount + 1) % 5 === 0;
    curE = { 
        hp: isBoss ? 200 + (state.lvl * 50) : 50 + (state.lvl * 20),
        atk: isBoss ? 15 + (state.lvl * 5) : 5 + (state.lvl * 2),
        icon: isBoss ? "👹" : ["👾","👻","🐍","🐅"][Math.floor(Math.random()*4)]
    };
    const bgs = ['linear-gradient(45deg, #064e3b, #0f172a)', 'linear-gradient(45deg, #451a03, #0f172a)', 'linear-gradient(45deg, #1e3a8a, #0f172a)'];
    document.getElementById('battleArena').style.background = isBoss ? 'radial-gradient(circle, #7f1d1d, #000000)' : bgs[Math.floor(Math.random()*bgs.length)];
    document.getElementById('battleArena').innerText = curE.icon;
    document.getElementById('eHp').innerText = curE.hp;
    document.getElementById('battleTitle').innerText = isBoss ? "⚠️ BOSS BATTLE!" : "ENEMY SPOTTED!";
    document.getElementById('fleeCount').innerText = state.fleeTokens;
    document.getElementById('battleLog').innerHTML = "Prepare for combat!";
    document.getElementById('battleM').style.display = 'flex';
}

function attack() {
    const pAtk = 5 + (state.lvl * 3) + (state.equip.weapon ? state.equip.weapon.v : 0);
    const pDef = 2 + (state.lvl * 2) + (state.equip.armor ? state.equip.armor.v : 0);
    curE.hp -= pAtk;
    document.getElementById('eHp').innerText = Math.max(0, curE.hp);
    document.getElementById('battleLog').innerHTML += `<br>You hit for ${pAtk}!`;
    if(curE.hp <= 0) {
        state.battleCount++; state.tokens--; state.xp += 50; state.gold += 10;
        checkLevelUp(); alert("VICTORY!"); closeModals(); render(); return;
    }
    const dmg = Math.max(1, curE.atk - pDef);
    state.hp -= dmg;
    document.getElementById('battleLog').innerHTML += `<br>Monster hits for ${dmg}!`;
    if(state.hp <= 0) { alert("Defeat!"); state.hp = 10; closeModals(); render(); }
}

function checkLevelUp() {
    const target = state.lvl * 100;
    if(state.xp >= target) {
        state.xp -= target; state.lvl++;
        state.hp = 100 + (state.lvl * 25); // V16.4 Full Heal
        state.fleeTokens++;
        alert("LEVEL UP! Health Fully Restored!");
        checkLevelUp();
    }
}

// SPENDER TRACKER LOGIC
function addTrans() {
    const a = parseFloat(document.getElementById('mAmt').value), d = document.getElementById('mDesc').value, t = document.getElementById('mType').value, dt = document.getElementById('mDate').value;
    if(a > 0 && d && dt) { 
        state.ledger.unshift({id: Date.now(), amt:a, desc:d, type:t, date:dt}); 
        document.getElementById('mAmt').value = ''; document.getElementById('mDesc').value = ''; render(); 
    } else alert("Fill in all fields!");
}
function deleteTrans(id) { state.ledger = state.ledger.filter(x => x.id !== id); render(); }

// QUESTS
function addQuest() {
    const v = document.getElementById('qInput').value;
    if(v) { state.quests.push({id:Date.now(), txt:v, tier:document.getElementById('qDiff').value}); document.getElementById('qInput').value = ''; render(); }
}
function completeQuest(id) {
    const idx = state.quests.findIndex(x=>x.id===id);
    const q = state.quests.splice(idx, 1)[0];
    const rew = {easy:25, medium:50, hard:100};
    state.gold += rew[q.tier]; state.xp += 20; state.tokens++;
    checkLevelUp(); render();
}

// UI HELPERS
function openShop() {
    const items = [
        {n:"Potion", i:"🍷", p:20, type:"pot"},
        {n:"Iron Sword", i:"⚔️", p:150, type:"gear", s:"weapon", v:12},
        {n:"Cat Pet", i:"🐱", p:400, type:"gear", s:"pet", v:15}
    ];
    document.getElementById('shopList').innerHTML = items.map(it => `
        <div class="q-row">
            <div>${it.i} ${it.n} (${it.p}g)</div>
            <button class="btn btn-p btn-sm" onclick="buyItem(${JSON.stringify(it).replace(/"/g, '&quot;')})">BUY</button>
        </div>`).join('');
    document.getElementById('shopM').style.display = 'flex';
}
function buyItem(it) {
    if(state.gold >= it.p) { state.gold -= it.p; if(it.type === 'pot') state.potions++; else state.inv.push(it); render(); } 
    else alert("Not enough gold!");
}
function openItemMenu(idx) {
    const it = state.inv[idx];
    document.getElementById('itemDetails').innerHTML = `<h2 style="text-align:center;">${it.i} ${it.n}</h2><button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="equip(${idx})">EQUIP</button><button class="btn btn-danger" style="width:100%; padding:10px;" onclick="state.inv.splice(${idx},1); closeModals(); render();">DISCARD</button>`;
    document.getElementById('itemM').style.display = 'flex';
}
function equip(idx) {
    const it = state.inv.splice(idx, 1)[0];
    if(state.equip[it.s]) state.inv.push(state.equip[it.s]);
    state.equip[it.s] = it; closeModals(); render();
}
function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s] = null; render(); } }
function flee() { if(state.fleeTokens > 0) { state.fleeTokens--; state.tokens--; closeModals(); render(); } }
function usePotion() { if(state.potions > 0) { state.hp = 100 + (state.lvl * 25); state.potions--; render(); } }
function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

load();
</script>
</body>
</html>

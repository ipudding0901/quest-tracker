<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid RPG</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569; --iron: #94a3b8;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    
    /* Login System */
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; }

    .app { max-width: 1100px; margin: 0 auto; padding: 10px; display: none; }

    /* Nav */
    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 4px 12px; border-radius: 15px; border: 1px solid var(--gold); }

    /* Character Grid */
    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 150px 1fr 150px; } }
    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 10px; padding: 8px; min-height: 55px; text-align: center; cursor: pointer; }
    .slot-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 2px; }

    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 16px; height: 300px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; }
    .h-head { width: 35px; height: 35px; background: #fbbf24; border-radius: 50%; margin: 0 auto; position: relative; }
    .h-body { width: 50px; height: 60px; background: #0ea5e9; border-radius: 6px; margin: 3px auto; position: relative; }
    .pet-vis { position: absolute; bottom: 50px; left: calc(50% + 40px); font-size: 28px; z-index: 9; }

    /* Panels & Collapsibles */
    .panel { background: var(--card); padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: none; border: none; color: var(--accent); font-weight: bold; padding: 5px 0; cursor: pointer; display: flex; justify-content: space-between; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }

    .inv-grid { display: flex; gap: 8px; padding: 5px; overflow-x: auto; background: var(--bg); border-radius: 8px; min-height: 60px; border: 1px solid var(--border); }
    .inv-item { background: var(--card); min-width: 60px; padding: 6px; border-radius: 8px; border: 1px solid var(--border); text-align: center; cursor: pointer; }

    .btn { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-s { background: var(--gold); color: #451a03; }
    .q-row { background: var(--bg); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border: 1px solid var(--border); }
    
    .lucky-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); margin-right: 8px; }
    .lucky-active { background: var(--gold); color: black; border-color: var(--gold); font-weight: bold; }

    /* Battle */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:3000; align-items:center; justify-content:center; padding: 15px; }
    .arena { position: relative; width: 100%; height: 220px; background: linear-gradient(to bottom, #1e293b, #0f172a); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color:var(--accent)">QUEST KID</h1>
        <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doLogin('child')">🧒 CHILD LOGIN</button>
        <button class="btn btn-s" style="width:100%; padding:15px;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong id="roleLabel" style="color:var(--accent)">HERO</strong>
            <button class="btn" style="font-size:10px; background:var(--border); padding:2px 8px;" onclick="location.reload()">Switch</button>
        </div>
        <div id="heroStatsNav" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box">💰 <span id="goldVal">0</span></div>
            <button id="battleBtn" class="btn btn-p" onclick="startBattle()" style="padding:4px 10px; font-size:11px;">⚔️ BATTLE (<span id="tokenVal">0</span>/3)</button>
        </div>
    </div>

    <div id="childGameView">
        <div class="char-grid">
            <div class="slot-col">
                <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
                <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Wpn</span><div id="v-weapon"></div></div>
                <div class="slot" onclick="unequip('shield')"><span class="slot-label">Off</span><div id="v-shield"></div></div>
            </div>
            <div class="doll-house">
                <div id="vis-pet" class="pet-vis" style="display:none;"></div>
                <div class="hero-base">
                    <div class="h-head"><div id="vis-helmet" style="display:none; width:38px; height:20px; background:var(--iron); border-radius:15px 15px 0 0; position:absolute; top:-2px; left:-2px;"></div></div>
                    <div class="h-body"><div id="vis-armor" style="display:none; width:54px; height:64px; background:var(--iron); border-radius:6px; position:absolute; top:-2px; left:-2px;"></div></div>
                </div>
                <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:11px;">
                    LVL <span id="lvlVal">1</span> | HP <span id="hpVal">100</span>
                    <div style="width:80px; height:4px; background:#000; margin:4px auto; border-radius:2px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor"></div></div>
                <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes"></div></div>
                <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet"></div></div>
            </div>
        </div>

        <div class="panel">
            <button class="collapse-btn" onclick="toggleCol('invGear')">🎒 GEAR INVENTORY <span>▼</span></button>
            <div id="invGear" class="collapse-content show"><div id="gearGrid" class="inv-grid"></div></div>
            
            <button class="collapse-btn" onclick="toggleCol('invPets')" style="margin-top:10px;">🐾 PET COLLECTION <span>▼</span></button>
            <div id="invPets" class="collapse-content"><div id="petGrid" class="inv-grid"></div></div>
        </div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0">📜 Quests</h3>
        <div style="display:flex; gap:5px; margin-bottom:12px;">
            <input id="qInput" style="background:var(--bg); border:1px solid var(--border); color:white; padding:10px; border-radius:8px; flex:1;" placeholder="New task...">
            <button class="btn btn-p" onclick="addQuest()" style="width:50px;">+</button>
        </div>
        <div id="activeQuestList"></div>

        <button class="collapse-btn" onclick="toggleCol('historyBox')" style="margin-top:10px; color:var(--success)">🌟 COMPLETED TASKS <span>▼</span></button>
        <div id="historyBox" class="collapse-content"><div id="historyList"></div></div>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" style="width:95%; max-width:400px;">
        <div class="arena">
            <div id="battleMsg" style="text-align:center; padding-top:10px; color:var(--gold);">Battle Start!</div>
            <div id="hF" style="position:absolute; bottom:40px; left:40px; width:30px; height:60px; background:var(--accent); transition:0.3s;"></div>
            <div id="hFPet" style="position:absolute; bottom:40px; left:75px; font-size:20px;"></div>
            <div id="mF" style="position:absolute; top:40px; right:40px; font-size:50px; transition:0.3s;">👾</div>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-p" style="flex:1; padding:15px; margin-top:10px;" id="atkBtn" onclick="fightStep()">⚔️ STRIKE</button>
            <button class="btn btn-danger" style="padding:15px; margin-top:10px;" onclick="document.getElementById('battleM').style.display='none'">RUN</button>
        </div>
    </div>
</div>

<script>
const DROPS = [{n:"Sword",i:"⚔️",s:"weapon"},{n:"Shield",i:"🛡️",s:"shield"},{n:"Helm",i:"🪖",s:"helmet"},{n:"Dog",i:"🐶",s:"pet"},{n:"Cat",i:"🐱",s:"pet"}];
const MONSTERS = ["👾","🐉","👺","👻","🕷️"];

let state = {
    role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, maxHp: 100, tokens: 0,
    quests: [], history: [], inv: [],
    equip: {helmet:null, weapon:null, shield:null, armor:null, shoes:null, pet:null}
};

function save() { localStorage.setItem('questKid_Final_Pro', JSON.stringify(state)); }
function load() { const s = localStorage.getItem('questKid_Final_Pro'); if(s) state = JSON.parse(s); }

function doLogin(r) {
    state.role = r;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    render();
}

function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }

function addQuest() {
    const val = document.getElementById('qInput').value;
    if(!val) return;
    state.quests.push({txt: val, status: 'open', lucky: false});
    document.getElementById('qInput').value = '';
    save(); render();
}

function updateQuest(i, s) {
    const q = state.quests[i];
    if(s === 'done') {
        state.gold += 50; state.xp += 40; state.tokens += 1;
        let chance = q.lucky ? 0.8 : 0.3;
        if(Math.random() < chance) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
        state.history.push(state.quests.splice(i, 1)[0]);
        if(state.xp >= 100) { state.lvl++; state.xp -= 100; }
    } else { q.status = s; }
    save(); render();
}

function render() {
    const isP = state.role === 'parent';
    document.getElementById('roleLabel').innerText = isP ? "🔑 PARENT" : "🧒 HERO";
    
    // Toggle Visibility of UI blocks
    document.getElementById('heroStatsNav').style.display = isP ? 'none' : 'flex';
    document.getElementById('childGameView').style.display = isP ? 'none' : 'block';
    
    document.getElementById('goldVal').innerText = state.gold;
    document.getElementById('tokenVal').innerText = state.tokens;
    document.getElementById('lvlVal').innerText = state.lvl;
    document.getElementById('hpVal').innerText = state.hp;
    document.getElementById('xpBar').style.width = state.xp + "%";

    // Quest List logic
    let qH = '';
    state.quests.forEach((q, i) => {
        let actions = '';
        if(isP) {
            actions = `<div>
                <span onclick="state.quests[${i}].lucky=!state.quests[${i}].lucky; render();" class="lucky-tag ${q.lucky?'lucky-active':''}">🍀 x2 Drop</span>
                ${q.status==='pending' ? `<button onclick="updateQuest(${i},'done')" class="btn btn-p" style="display:inline; padding:4px 8px;">✅</button>` : ''}
                <button onclick="state.quests.splice(${i},1); render();" class="btn btn-danger" style="display:inline; padding:4px 8px; margin-left:5px;">🗑️</button>
            </div>`;
        } else {
            actions = q.status === 'open' ? `<button onclick="updateQuest(${i},'pending')" class="btn btn-p" style="padding:4px 10px;">DONE</button>` : `⏳ Pending`;
        }
        qH += `<div class="q-row"><span>${q.txt} ${q.lucky?'🍀':''}</span>${actions}</div>`;
    });
    document.getElementById('activeQuestList').innerHTML = qH || '<small>No active tasks.</small>';

    // History logic
    let hH = '';
    state.history.forEach(h => hH += `<div class="q-row" style="opacity:0.6"><span>✅ ${h.txt}</span></div>`);
    document.getElementById('historyList').innerHTML = hH || '<small>Nothing completed yet.</small>';

    // Gear & Pets logic
    let gearH = '', petH = '';
    state.inv.forEach((it, i) => {
        const html = `<div class="inv-item" onclick="equip(${i})"><div>${it.i}</div><small>${it.n}</small></div>`;
        if(it.s === 'pet') petH += html; else gearH += html;
    });
    document.getElementById('gearGrid').innerHTML = gearH || 'Empty';
    document.getElementById('petGrid').innerHTML = petH || 'Empty';

    // Dollhouse visuals
    for(let s in state.equip) {
        const item = state.equip[s];
        document.getElementById('v-'+s).innerText = item ? item.i : '';
        const vis = document.getElementById('vis-'+s);
        if(vis) vis.style.display = item ? 'block' : 'none';
        if(s === 'pet') {
            document.getElementById('vis-pet').innerText = item ? item.i : '';
            document.getElementById('vis-pet').style.display = item ? 'block' : 'none';
            document.getElementById('hFPet').innerText = item ? item.i : '';
        }
    }
    save();
}

function equip(i) {
    const it = state.inv.splice(i, 1)[0];
    const old = state.equip[it.s];
    state.equip[it.s] = it;
    if(old) state.inv.push(old);
    render();
}

function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; render(); } }

let mHp = 50;
function startBattle() {
    if(state.tokens < 3) return alert("Need 3 Tokens!");
    state.tokens -= 3;
    mHp = 50; 
    document.getElementById('mF').innerText = MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
    document.getElementById('battleMsg').innerText = "Battle Start!";
    document.getElementById('battleM').style.display = 'flex';
}

function fightStep() {
    document.getElementById('hF').style.transform = 'translateX(50px)';
    setTimeout(() => {
        mHp -= 20;
        document.getElementById('hF').style.transform = 'translateX(0)';
        if(mHp <= 0) {
            document.getElementById('battleMsg').innerText = "Victory!";
            setTimeout(() => { document.getElementById('battleM').style.display='none'; render(); }, 1000);
        } else {
            document.getElementById('mF').style.transform = 'translateX(-50px)';
            setTimeout(() => {
                state.hp -= 10;
                document.getElementById('mF').style.transform = 'translateX(0)';
                if(state.hp <= 0) {
                    document.getElementById('battleMsg').innerText = "Defeat...";
                    state.hp = 20;
                    setTimeout(() => { document.getElementById('battleM').style.display='none'; render(); }, 1000);
                }
                render();
            }, 300);
        }
    }, 300);
}

load();
</script>
</body>
</html>

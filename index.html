<!DOCTYPE html>
<html>
<head>
  <title>Quest RPG Enhanced</title>
  <style>
    body { margin:0; font-family:system-ui; background:#0f172a; color:#e2e8f0; }
    .app { max-width:1100px; margin:auto; padding:20px; }
    h1 { text-align:center; }
    .grid { display:grid; grid-template-columns:260px 1fr 300px; gap:15px; }
    .card { background:#1e293b; border-radius:12px; padding:15px; }
    .avatar { position:relative; width:140px; height:140px; margin:auto; }
    .layer { position:absolute; width:100%; image-rendering:pixelated; }
    #helmet { top:0; left:25px; width:60%; }
    #chest { top:40px; left:25px; width:60%; }
    #weapon { top:50px; left:90px; width:40%; }
    #shoes { top:90px; left:35px; width:50%; }
    .shake { animation:shake 0.3s; }
    @keyframes shake {
      0%{transform:translateX(0)}
      25%{transform:translateX(-5px)}
      50%{transform:translateX(5px)}
      75%{transform:translateX(-5px)}
      100%{transform:translateX(0)}
    }
  </style>
</head>
<body>
<div class="app">
<h1>⚔️ Quest RPG+</h1>
<div class="grid">
<div class="card">
<div class="avatar" id="playerAvatar">
<img id="base" class="layer" src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png">
<img id="helmet" class="layer">
<img id="chest" class="layer">
<img id="weapon" class="layer">
<img id="shoes" class="layer">
</div>
<div id="stats"></div>
</div>
<div class="card">
<button onclick="attack()">Attack</button>
<div id="log"></div>
</div>
<div class="card">
<div id="inventory"></div>
</div>
</div>
</div>
<script>
let player={level:1,atk:5,hp:100,maxHp:100,inventory:[],helmet:null,chest:null,weapon:null,shoes:null};

let monsters=[
 {name:"Slime",hp:30,maxHp:30,atk:4},
 {name:"Goblin",hp:50,maxHp:50,atk:6},
 {name:"Dragon",hp:120,maxHp:120,atk:12,boss:true}
];

let currentMonster = JSON.parse(JSON.stringify(monsters[0]));

const rarityColors={common:"white",rare:"#3b82f6",epic:"#a855f7"};

function nextMonster(){
 let index=Math.floor(Math.random()*monsters.length);
 currentMonster = JSON.parse(JSON.stringify(monsters[index]));
 log("⚔️ New enemy: "+currentMonster.name);
}

function rollLoot(){
 let rarities=["common","rare","epic"];
 let r=rarities[Math.floor(Math.random()*rarities.length)];
 let types=["weapon","helmet","chest","shoes"];
 let type=types[Math.floor(Math.random()*types.length)];
 return {
  type,
  rarity:r,
  atk:r==="epic"?5:r==="rare"?3:1,
  img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/hat.png"
 };
}

function equip(i){
 let item=player.inventory[i];
 player[item.type]=item;
 player.atk+=item.atk;
 render();
}

function attack(){
 playSound();
 shake("playerAvatar");
 let dmg=Math.floor(Math.random()*player.atk)+1;
 currentMonster.hp-=dmg;

 if(currentMonster.hp<=0){
  log("Defeated "+currentMonster.name);
  player.inventory.push(rollLoot());
  nextMonster();
 } else {
  player.hp-=currentMonster.atk;
  log("Hit "+dmg+", took "+currentMonster.atk);
 }
 render();
}

function render(){
 document.getElementById("stats").innerHTML="HP:"+player.hp+" ATK:"+player.atk;

 document.getElementById("helmet").src=player.helmet?player.helmet.img:"";
 document.getElementById("chest").src=player.chest?player.chest.img:"";
 document.getElementById("weapon").src=player.weapon?player.weapon.img:"";
 document.getElementById("shoes").src=player.shoes?player.shoes.img:"";

 let inv="";
 player.inventory.forEach((item,i)=>{
  inv+=`<div onclick='equip(${i})' style="color:${rarityColors[item.rarity]}">${item.rarity}</div>`;
 });
 document.getElementById("inventory").innerHTML=inv;
}

function log(t){
 let el=document.getElementById("log");
 el.innerHTML+=t+"<br>";
 el.scrollTop=el.scrollHeight;
}

function shake(id){
 let el=document.getElementById(id);
 el.classList.add("shake");
 setTimeout(()=>el.classList.remove("shake"),300);
}

function playSound(){
 let ctx=new (window.AudioContext||window.webkitAudioContext)();
 let osc=ctx.createOscillator();
 osc.connect(ctx.destination);
 osc.start();
 osc.stop(ctx.currentTime+0.1);
}

nextMonster();
render();
</script>
</body>
</html>

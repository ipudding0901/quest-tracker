<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid RPG - V15.5</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569; --purple: #a855f7; --heal: #fb7185;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow-x: hidden; }
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .app { max-width: 1000px; margin: 0 auto; padding: 10px; display: none; }
    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 8px 15px; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .stats-bar { display: flex; gap: 15px; font-size: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: var(--accent); justify-content: center; border: 1px solid var(--border); position: relative;}
    
    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 160px 1fr 160px; } }
    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
    
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; min-height: 60px; text-align: center; cursor: pointer; position: relative; }
    .slot-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 20px; height: 320px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; z-index: 5; }
    .h-head { width: 40px; height: 40px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
    .h-body { width: 55px; height: 70px; background: #3b82f6; border-radius: 8px; margin: 4px auto; }
    
    .panel { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--success); font-weight: bold; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; margin-top: 10px; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }
    
    .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: var(--bg); border-radius: 10px; min-height: 80px; border: 1px solid var(--border); }
    .inv-item { background: var(--card); min-width: 70px; padding: 10px; border-radius: 10px; border: 2px solid var(--border); text-align: center; cursor: pointer; position: relative; flex-shrink: 0; }
    .lvl-tag { position: absolute; top: -8px; right: -8px; background: var(--gold); color: black; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
    
    .btn { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); }
    .btn-heal { background: var(--heal); color: white; font-size: 10px; padding: 4px 8px; position: absolute; right: 10px; }
    
    .q-row { background: var(--bg); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:4000; align-items:center; justify-content:center; padding: 10px; }
    .arena { position: relative; width: 100%; height: 280px; border-radius: 15px; overflow: hidden; border: 2px solid var(--border); margin-bottom: 15px; }
    .hp-bar-outer { width: 100px; height: 12px; background: #000; border-radius: 6px; border: 1px solid #555; margin-bottom: 5px; overflow: hidden; }
    .hp-bar-inner { width: 100%; height: 100%; transition: width 0.4s; }
    
    .dmg-num { position: absolute; font-weight: 900; font-size: 28px; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 100; text-shadow: 2px 2px #000; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
    
    #hF { position: absolute; bottom: 40px; left: 40px; transition: 0.2s; text-align: center; z-index: 10; }
    #mF { position: absolute; top: 40px; right: 40px; transition: 0.2s; text-align: center; z-index: 10; }
    .bump-right { transform: translate(120px, -40px); }
    .bump-left { transform: translate(-120px, 40px); }
    
    .streak-badge { background: linear-gradient(to right, #f97316, #fbbf24); color: black; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    .p-input { background:var(--bg); border:1px solid var(--border); color:white; padding:10px; border-radius:8px; }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color:var(--accent); margin-bottom: 25px;">QUEST KID</h1>
        <button class="btn btn-p" style="width:100%; padding:20px; margin-bottom:15px; font-size: 16px;" onclick="doLogin('child')">🧒 CHILD LOGIN</button>
        <button class="btn" style="width:100%; padding:20px; background:var(--gold); color:black; font-size: 16px;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong id="roleLabel" style="color:var(--accent); font-size:16px;">HERO</strong>
            <span id="streakDisplay" class="streak-badge">🔥 0 DAY STREAK</span>
            <button class="btn" style="font-size:10px; background:var(--border); padding:4px 10px;" onclick="location.reload()">Log Out</button>
        </div>
        <div id="heroStatsNav" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box" onclick="document.getElementById('shopM').style.display='flex'">💰 <span id="goldVal">0</span></div>
            <button id="battleBtn" class="btn btn-p" onclick="startBattle()" style="padding:6px 12px; font-size:12px;">⚔️ BATTLE (<span id="tokenVal">0</span>/3)</button>
        </div>
    </div>

    <div id="childGameView">
        <div class="stats-bar">
            <span>⚔️ ATK: <b id="sAtk">0</b></span> | 🛡️ DEF: <b id="sDef">0</b> | ❤️ HP: <b id="sHp">0/0</b>
            <button id="usePotionBtn" class="btn btn-heal" onclick="usePotion()" style="display:none;">🍷 HEAL (x<span id="potCount">0</span>)</button>
        </div>
        <div class="char-grid">
            <div class="slot-col">
                <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Weapon</span><div id="v-weapon" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('shield')"><span class="slot-label">Offhand</span><div id="v-shield" style="font-size:24px;"></div></div>
            </div>
            <div class="doll-house">
                <div class="hero-base"><div class="h-head"></div><div class="h-body"></div></div>
                <div style="position:absolute; bottom:15px; width:100%; text-align:center; font-size:12px;">
                    LVL <span id="lvlVal">1</span>
                    <div style="width:100px; height:5px; background:rgba(0,0,0,0.5); margin:5px auto; border-radius:3px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                    <div style="font-size: 8px; margin-top: 2px;">XP: <span id="xpText">0/100</span></div>
                    <div style="font-size: 9px; color: var(--gold);">Battles to Boss: <span id="bossCounter">5</span></div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet" style="font-size:24px;"></div></div>
            </div>
        </div>
        <div class="panel"><strong>🎒 Inventory</strong><div id="gearGrid" class="inv-grid"></div></div>
    </div>

    <div class="panel">
        <h3>📜 Quest Board</h3>
        <div id="questInputContainer" style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="qInput" class="p-input" style="flex:1;" placeholder="Enter a new quest...">
            <select id="qDifficulty" class="p-input">
                <option value="easy">Easy (25g)</option>
                <option value="medium" selected>Medium (50g)</option>
                <option value="hard">Hard (100g)</option>
            </select>
            <button class="btn btn-p" onclick="addQuest()" style="width:60px; font-size: 20px;">+</button>
        </div>
        <div id="activeQuestList"></div>
        <button class="collapse-btn" onclick="toggleCol('historyBox')"><span>🌟 COMPLETED TASKS</span><span>▼</span></button>
        <div id="historyBox" class="collapse-content"><div id="historyList"></div></div>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" id="arenaPanel" style="width:95%; max-width:450px; text-align:center;">
        <h2 id="bossTag" style="display:none; color:var(--danger); margin-top:0;">⚠️ BOSS ENCOUNTER ⚠️</h2>
        <div class="arena" id="arenaBg">
            <div id="battleMsg" style="position:relative; z-index:20; padding:10px; color:white; font-weight:bold; text-shadow:1px 1px #000;">Combat!</div>
            <div id="hF"><div class="hp-bar-outer"><div id="hHpFill" class="hp-bar-inner" style="background:var(--success)"></div></div><div style="width:40px; height:60px; background:var(--accent); border-radius:4px; margin:0 auto; border:2px solid white;"></div></div>
            <div id="mF"><div class="hp-bar-outer"><div id="mHpFill" class="hp-bar-inner" style="background:var(--danger)"></div></div><div id="mEmoji" style="font-size:60px;">👾</div><div id="mStatsLbl" style="font-size:10px; color:white; background:rgba(0,0,0,0.5); border-radius:5px;"></div></div>
        </div>
        <div style="display:flex; gap:10px;"><button class="btn btn-p" style="flex:2; padding:18px;" onclick="heroTurn()">⚔️ ATTACK</button><button class="btn btn-danger" style="flex:1; padding:18px;" onclick="fleeBattle()">🏃 FLEE</button></div>
    </div>
</div>

<div id="shopM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:400px;">
        <h2 style="color:var(--gold); text-align:center;">💰 SHOP</h2>
        <div id="shopList" style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;">
            <button class="btn" style="background:var(--gold); color:black; padding:12px;" onclick="buyChest()">📦 Mystery Chest (250g)</button>
            <button class="btn" style="background:var(--heal); color:white; padding:12px;" onclick="buyPotion()">🍷 Health Potion (50g)</button>
        </div>
        <button class="btn" style="width:100%; background:var(--border);" onclick="document.getElementById('shopM').style.display='none'">CLOSE</button>
    </div>
</div>

<div id="lvlUpM" class="modal-overlay"><div class="panel" style="width:90%; max-width:300px; text-align:center; border: 2px solid var(--gold);"><h1 style="color:var(--gold); margin:0;">🎉 LEVEL UP!</h1><p style="font-size:18px;">Level <span id="lvlUpVal">1</span></p><button class="btn btn-p" style="width:100%; padding:15px;" onclick="document.getElementById('lvlUpM').style.display='none'">AWESOME!</button></div></div>

<div id="itemM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:320px; text-align:center;">
        <h2 id="mItemTitle"></h2>
        <div id="mItemIcon" style="font-size:60px; margin:10px 0;"></div>
        <div id="mItemStats" style="margin-bottom:15px;"></div>
        <div id="equipActions">
            <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doEquipFromMenu()">🛡️ EQUIP</button>
            <button id="upgradeBtn" class="btn" style="width:100%; padding:15px; margin-bottom:10px; background:var(--gold); color:black;" onclick="doUpgrade()">⭐ UPGRADE (Combine)</button>
            <button id="sellBtn" class="btn" style="width:100%; padding:15px; background:var(--danger); color:white;" onclick="doSell()">💰 SELL ITEM</button>
        </div>
        <button class="btn" style="width:100%; margin-top:10px; background:var(--border);" onclick="document.getElementById('itemM').style.display='none'">CANCEL</button>
    </div>
</div>

<script>
const GEAR_DB = [{n:"Sword",i:"⚔️",s:"weapon"},{n:"Axe",i:"🪓",s:"weapon"},{n:"Shield",i:"🛡️",s:"shield"},{n:"Helm",i:"🪖",s:"helmet"},{n:"Plate",i:"👕",s:"armor"},{n:"Boots",i:"👢",s:"shoes"},{n:"Dog",i:"🐶",s:"pet"},{n:"Drake",i:"🐲",s:"pet"}];
const MONSTERS = ["👾","👹","🐉","👻","🧟","🦂"];
const BOSSES = ["🔥🐲🔥", "👿", "💀🔱", "🦾🤖"];

let state = { 
    role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, tokens: 0, potions: 0,
    quests: [], history: [], inv: [], 
    equip: {helmet:null, weapon:null, shield:null, armor:null, shoes:null, pet:null},
    battleCount: 0, streak: 0, lastDate: null
};

let curM = { hp: 0, max: 0, atk: 0, def: 0, isBoss: false }, curH = { atk: 0, def: 0, maxHp: 100 }, isActing = false, selectedIdx = -1;

function save() { localStorage.setItem('QuestKid_V15_5', JSON.stringify(state)); }
function load() { 
    const s = localStorage.getItem('QuestKid_V15_5'); 
    if(s) state = JSON.parse(s);
    checkStreak();
}

function checkStreak() {
    const today = new Date().toDateString();
    if (state.lastDate === today) return;
    if (state.lastDate) {
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
        if (state.lastDate === yesterday.toDateString()) {
            state.streak++;
            state.gold += (state.streak * 50);
        } else { state.streak = 1; }
    } else { state.streak = 1; }
    state.lastDate = today;
    save();
}

function doLogin(r) { state.role = r; document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; render(); }
function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }

function startBattle() {
    if(state.tokens < 3) return alert("Need 3 Tokens!");
    state.tokens -= 3; state.battleCount++;
    curM.isBoss = (state.battleCount % 5 === 0);
    const multiplier = curM.isBoss ? 2 : 1;
    curM.max = (50 + (state.lvl * 25)) * multiplier; curM.hp = curM.max; 
    curM.atk = (6 + (state.lvl * 5)) * multiplier; curM.def = (2 + (state.lvl * 3)) * multiplier;
    document.getElementById('mEmoji').innerText = curM.isBoss ? BOSSES[Math.floor(Math.random()*BOSSES.length)] : MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
    document.getElementById('battleM').style.display = 'flex'; updateBars();
}

function updateQuest(i, act) {
    const isP = state.role === 'parent';
    const q = state.quests[i];
    if(act === 'done') {
        if(!isP) return;
        if(q.status !== 'pending') return;
        const rewards = { easy: {g:25, x:20}, medium: {g:50, x:40}, hard: {g:100, x:80} };
        const tier = q.tier || 'medium';
        state.gold += rewards[tier].g; state.xp += rewards[tier].x; state.tokens++;
        if(Math.random() < 0.3) state.inv.push(generateItem());
        state.history.unshift(state.quests.splice(i, 1)[0]);
        checkLevelUp();
    } else if (act === 'delete') { if(isP) state.quests.splice(i, 1); } 
    else { state.quests[i].status = act; }
    render();
}

function render() {
    calculateStats();
    const isP = state.role === 'parent';
    document.getElementById('heroStatsNav').style.display = isP ? 'none' : 'flex';
    document.getElementById('childGameView').style.display = isP ? 'none' : 'block';
    document.getElementById('goldVal').innerText = state.gold; 
    document.getElementById('tokenVal').innerText = state.tokens;
    document.getElementById('streakDisplay').innerText = `🔥 ${state.streak} DAY STREAK`;
    document.getElementById('lvlVal').innerText = state.lvl; 
    document.getElementById('xpBar').style.width = (state.xp / (state.lvl * 100) * 100) + "%";
    document.getElementById('sAtk').innerText = curH.atk; 
    document.getElementById('sDef').innerText = curH.def; 
    document.getElementById('sHp').innerText = Math.floor(state.hp) + "/" + curH.maxHp;
    document.getElementById('potCount').innerText = state.potions;

    let qH = ''; 
    state.quests.forEach((q, i) => {
        let controls = '';
        if(isP) {
            const approveBtn = q.status === 'pending' ? `<button onclick="updateQuest(${i},'done')" class="btn btn-p" style="padding:5px 10px;">✅ APPROVE</button>` : `<span style="color:#64748b; font-size:10px;">⏳ WAITING</span>`;
            controls = `<div style="display:flex; gap:5px;">${approveBtn}<button onclick="updateQuest(${i},'delete')" class="btn btn-danger" style="padding:5px 10px;">❌</button></div>`;
        } else {
            controls = q.status === 'open' ? `<button onclick="updateQuest(${i},'pending')" class="btn btn-p" style="padding:8px 20px;">DONE</button>` : `<span style="color:var(--gold); font-size:11px;">⏳ PENDING</span>`;
        }
        qH += `<div class="q-row"><span>${q.txt} <small style="color:var(--accent)">(${q.tier})</small></span>${controls}</div>`;
    });
    document.getElementById('activeQuestList').innerHTML = qH || 'No active quests.';
    let hH = ''; state.history.forEach((h) => { hH += `<div class="q-row" style="opacity:0.6;"><span>${h.txt}</span><span style="color:var(--success)">⭐ DONE</span></div>`; });
    document.getElementById('historyList').innerHTML = hH || 'No history.';
    let iH = ''; state.inv.forEach((it, i) => { iH += `<div class="inv-item" onclick="openItemMenu(${i})">${it.v>0?`<div class="lvl-tag">+${it.v}</div>`:''}<div>${it.i}</div></div>`; });
    document.getElementById('gearGrid').innerHTML = iH || 'Empty';
    for(let s in state.equip) document.getElementById('v-'+s).innerHTML = state.equip[s] ? state.equip[s].i : '';
    save();
}

function openItemMenu(i) {
    selectedIdx = i;
    const it = state.inv[i];
    const sellPrice = (it.baseP * 20) + (it.v * 50);
    document.getElementById('mItemTitle').innerText = it.n + (it.v > 0 ? ` +${it.v}` : '');
    document.getElementById('mItemIcon').innerText = it.i;
    document.getElementById('mItemStats').innerText = `Base Power: ${it.baseP} | Upgrade: +${it.v}`;
    document.getElementById('sellBtn').innerText = `💰 SELL FOR ${sellPrice}g`;
    
    // Upgrade check: Need duplicate with same Name, Power, and Upgrade level
    const dupe = state.inv.findIndex((x, idx) => idx !== i && x.n === it.n && x.v === it.v && x.baseP === it.baseP);
    document.getElementById('upgradeBtn').disabled = (dupe === -1);
    document.getElementById('itemM').style.display = 'flex';
}

function doSell() {
    const it = state.inv[selectedIdx];
    const sellPrice = (it.baseP * 20) + (it.v * 50);
    state.gold += sellPrice;
    state.inv.splice(selectedIdx, 1);
    document.getElementById('itemM').style.display = 'none';
    render();
}

function doUpgrade() {
    const it = state.inv[selectedIdx];
    const dupeIdx = state.inv.findIndex((x, idx) => idx !== selectedIdx && x.n === it.n && x.v === it.v && x.baseP === it.baseP);
    state.inv[selectedIdx].v++;
    state.inv.splice(dupeIdx, 1);
    document.getElementById('itemM').style.display = 'none';
    render();
}

function calculateStats() {
    curH.atk = 5 + (state.lvl * 3); curH.def = 2 + (state.lvl * 2); curH.maxHp = 100 + (state.lvl * 25);
    for(let s in state.equip) {
        let it = state.equip[s]; if(!it) continue;
        let power = (it.baseP * 5) + (it.v * 10);
        if(it.s === 'weapon') curH.atk += power; else curH.def += power;
    }
}

function addQuest() {
    const v = document.getElementById('qInput').value;
    const tier = document.getElementById('qDifficulty').value;
    if(!v) return;
    state.quests.push({txt: v, status: 'open', tier: tier});
    document.getElementById('qInput').value = ''; render();
}

function generateItem(isBoss = false) { 
    let r = GEAR_DB[Math.floor(Math.random()*GEAR_DB.length)]; 
    return { ...r, v: isBoss ? 2 : 0, baseP: Math.floor(Math.random()*3)+1 }; 
}

function checkLevelUp() {
    let next = state.lvl * 100;
    if(state.xp >= next) { state.xp -= next; state.lvl++; state.hp = 100 + (state.lvl * 25); checkLevelUp(); }
}

function showDmg(t, a) {
    const b = document.getElementById(t).getBoundingClientRect();
    const ar = document.getElementById('arenaBg').getBoundingClientRect();
    const el = document.createElement('div'); el.className = 'dmg-num'; el.innerText = `-${a}`;
    el.style.left = (b.left - ar.left + 20) + 'px'; el.style.top = (b.top - ar.top) + 'px';
    document.getElementById('arenaBg').appendChild(el); setTimeout(() => el.remove(), 800);
}

function heroTurn() { 
    if(isActing) return; isActing = true; 
    document.getElementById('hF').classList.add('bump-right'); 
    setTimeout(() => { 
        let d = Math.max(5, curH.atk - curM.def); curM.hp = Math.max(0, curM.hp - d); showDmg('mF', d); updateBars();
        document.getElementById('hF').classList.remove('bump-right'); 
        if(curM.hp <= 0) { state.gold += curM.isBoss ? 500 : 100; state.inv.push(generateItem(curM.isBoss)); document.getElementById('battleM').style.display='none'; render(); isActing = false; } 
        else { setTimeout(monsterTurn, 600); } 
    }, 200); 
}

function monsterTurn() { 
    document.getElementById('mF').classList.add('bump-left'); 
    setTimeout(() => { 
        let d = Math.max(5, curM.atk - curH.def); state.hp = Math.max(0, state.hp - d); showDmg('hF', d); updateBars();
        document.getElementById('mF').classList.remove('bump-left'); 
        if(state.hp <= 0) { state.hp = 20; document.getElementById('battleM').style.display='none'; render(); isActing = false; } 
        else { isActing = false; } 
    }, 200); 
}

function doEquipFromMenu() {
    const it = state.inv.splice(selectedIdx, 1)[0];
    const old = state.equip[it.s]; state.equip[it.s] = it;
    if(old) state.inv.push(old);
    document.getElementById('itemM').style.display = 'none'; render();
}

function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; render(); } }
function buyChest() { if(state.gold < 250) return; state.gold -= 250; state.inv.push(generateItem()); render(); }
function buyPotion() { if(state.gold < 50) return; state.gold -= 50; state.potions++; render(); }
function usePotion() { if(state.potions <= 0 || state.hp >= curH.maxHp) return; state.potions--; state.hp = Math.min(state.hp + 50, curH.maxHp); render(); }
function updateBars() { document.getElementById('hHpFill').style.width = (state.hp/curH.maxHp*100) + "%"; document.getElementById('mHpFill').style.width = (curM.hp/curM.max*100) + "%"; document.getElementById('mStatsLbl').innerText = `⚔️${curM.atk} 🛡️${curM.def}`; }
function fleeBattle() { if(!isActing) { state.tokens -= 1; document.getElementById('battleM').style.display = 'none'; render(); } }
load();
</script>
</body>
</html>

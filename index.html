```html
<!DOCTYPE html>
<html>
<head>
  <title>RPG Quest Game</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #020617;
      color: white;
    }

    h1 {
      text-align: center;
      color: gold;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
    }

    .title {
      border-bottom: 1px solid #334155;
      margin-bottom: 5px;
    }

    .avatar {
      font-size: 60px;
      text-align: center;
    }

    .equipment {
      text-align: center;
      font-size: 14px;
    }

    .inventory {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .item {
      border: 1px solid #334155;
      padding: 5px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .common { color: gray; }
    .rare { color: blue; }
    .unique { color: purple; }
    .legendary { color: gold; }

    button { margin: 3px; }

  </style>
</head>

<body>

<h1>⚔️ RPG QUEST GAME</h1>

<div class="layout">

  <!-- CHARACTER -->
  <div class="panel">
    <div class="title">Character</div>

    <div id="avatar" class="avatar">🧑</div>

    <div id="stats"></div>

    <div class="equipment">
      Weapon: <span id="weapon">None</span><br>
      Armor: <span id="armor">None</span>
    </div>

    <button onclick="setRole('child')">Child</button>
    <button onclick="setRole('parent')">Parent</button>
    <p id="mode"></p>
  </div>

  <!-- QUESTS -->
  <div class="panel">
    <div class="title">Quests</div>
    <input id="questInput">
    <button onclick="addQuest()">Add</button>
    <div id="quests"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="title">Inventory (click to equip)</div>
    <div id="inventory" class="inventory"></div>

    <div class="title">Battle</div>
    <button onclick="fight()">Fight</button>
    <div id="battle"></div>
  </div>

</div>

<script>
let role="child";

let player={
  level:1,
  xp:0,
  baseAttack:5,
  weapon:null,
  armor:null,
  inventory:[]
};

let quests=[];

function setRole(r){
  role=r;
  render();
}

function addQuest(){
  let text=document.getElementById("questInput").value;
  if(!text) return;

  quests.push({
    text,
    status: role==="parent"?"assigned":"pending"
  });
  render();
}

function submitQuest(i){
  quests[i].status="pending";
  render();
}

function recallQuest(i){
  quests.splice(i,1);
  render();
}

function approveQuest(i){
  quests[i].status="done";
  reward();
  render();
}

function reward(){
  player.xp+=20;
  if(player.xp>=player.level*100){
    player.xp=0;
    player.level++;
  }

  if(Math.random()<0.3){
    let item=rollLoot();
    player.inventory.push(item);
  }
}

function rollLoot(){
  let r=Math.random();
  if(r<0.6) return {name:"Sword",type:"weapon",rarity:"common",atk:2,icon:"🗡️"};
  if(r<0.85) return {name:"Armor",type:"armor",rarity:"rare",atk:1,icon:"🛡️"};
  if(r<0.97) return {name:"Magic Robe",type:"armor",rarity:"unique",atk:3,icon:"🧥"};
  return {name:"Excalibur",type:"weapon",rarity:"legendary",atk:5,icon:"⚔️"};
}

function equip(item){
  if(item.type==="weapon") player.weapon=item;
  if(item.type==="armor") player.armor=item;
  render();
}

function totalAttack(){
  return player.baseAttack +
    (player.weapon?player.weapon.atk:0) +
    (player.armor?player.armor.atk:0);
}

function fight(){
  let enemy=10+Math.random()*20;
  let power=totalAttack();

  if(power>enemy){
    player.xp+=10;
    document.getElementById("battle").innerText="Victory!";
  }else{
    document.getElementById("battle").innerText="Defeat...";
  }
  render();
}

function render(){
  document.getElementById("mode").innerText=role;

  document.getElementById("stats").innerHTML=
    "Level:"+player.level+
    "<br>XP:"+player.xp+
    "<br>ATK:"+totalAttack();

  document.getElementById("weapon").innerText=
    player.weapon?player.weapon.name:"None";

  document.getElementById("armor").innerText=
    player.armor?player.armor.name:"None";

  // avatar visual change
  let avatar="🧑";
  if(player.weapon) avatar="🧝";
  if(player.armor) avatar="🧙";
  document.getElementById("avatar").innerText=avatar;

  let qHTML="";
  quests.forEach((q,i)=>{
    qHTML+=`
      <div>
        ${q.text} (${q.status})
        ${role==="child" && q.status==="assigned"?`<button onclick="submitQuest(${i})">Submit</button>`:""}
        ${role==="child" && q.status==="pending"?`<button onclick="recallQuest(${i})">Recall</button>`:""}
        ${role==="parent" && q.status==="pending"?`<button onclick="approveQuest(${i})">Approve</button>`:""}
      </div>`;
  });
  document.getElementById("quests").innerHTML=qHTML;

  let inv="";
  player.inventory.forEach(i=>{
    inv+=`<div class="item ${i.rarity}" onclick='equip(${JSON.stringify(i)})'>
      ${i.icon}<br>${i.name}
    </div>`;
  });
  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

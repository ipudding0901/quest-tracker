<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid RPG - MASTER BUILD V6</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569;
      --rarity1: #94a3b8; --rarity2: #34d399; --rarity3: #38bdf8; --rarity4: #a855f7;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; overflow-x: hidden; }
    
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; }

    .app { max-width: 1000px; margin: 0 auto; padding: 10px; display: none; }

    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 8px 15px; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
    .gold-box:hover { transform: scale(1.05); }
    
    .stats-bar { display: flex; gap: 15px; font-size: 12px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: var(--accent); justify-content: center; border: 1px solid var(--border); }

    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 160px 1fr 160px; } }
    
    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
    
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; min-height: 60px; text-align: center; cursor: pointer; position: relative; }
    .slot-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }

    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 20px; height: 320px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; }
    .h-head { width: 40px; height: 40px; background: #ffdbac; border-radius: 50%; margin: 0 auto; }
    .h-body { width: 55px; height: 70px; background: #3b82f6; border-radius: 8px; margin: 4px auto; }

    .panel { background: var(--card); padding: 15px; border-radius: 15px; margin-top: 15px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--success); font-weight: bold; padding: 10px 15px; cursor: pointer; display: flex; justify-content: space-between; border-radius: 8px; margin-top: 10px; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }

    .inv-grid { display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: var(--bg); border-radius: 10px; min-height: 80px; border: 1px solid var(--border); }
    .inv-item { background: var(--card); min-width: 70px; padding: 10px; border-radius: 10px; border: 2px solid var(--border); text-align: center; cursor: pointer; position: relative; flex-shrink: 0; }
    .lvl-tag { position: absolute; top: -8px; right: -8px; background: var(--gold); color: black; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }

    .btn { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .q-row { background: var(--bg); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); }
    .lucky-tag { font-size: 11px; padding: 3px 10px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); margin-right: 10px; }
    .lucky-active { background: var(--gold); color: black; border-color: var(--gold); font-weight: bold; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:4000; align-items:center; justify-content:center; padding: 10px; }
    .shop-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }

    .arena { position: relative; width: 100%; height: 280px; background: linear-gradient(to bottom, #1e293b, #0f172a); border-radius: 15px; overflow: hidden; border: 2px solid var(--border); margin-bottom: 15px; }
    .hp-bar-outer { width: 100px; height: 12px; background: #000; border-radius: 6px; border: 1px solid #555; margin-bottom: 5px; overflow: hidden; }
    .hp-bar-inner { width: 100%; height: 100%; transition: width 0.4s; }
    
    #hF { position: absolute; bottom: 40px; left: 40px; transition: transform 0.2s ease-in; text-align: center; }
    #mF { position: absolute; top: 40px; right: 40px; transition: transform 0.2s ease-in; text-align: center; }
    .bump-right { transform: translate(120px, -40px); }
    .bump-left { transform: translate(-120px, 40px); }
    
    .token-neg { color: var(--danger) !important; font-weight: 900; }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color:var(--accent)">QUEST KID</h1>
        <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doLogin('child')">🧒 CHILD LOGIN</button>
        <button class="btn" style="width:100%; padding:15px; background:var(--gold); color:black;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong id="roleLabel" style="color:var(--accent); font-size:16px;">HERO</strong>
            <button class="btn" style="font-size:10px; background:var(--border); padding:4px 10px;" onclick="location.reload()">Log Out</button>
        </div>
        <div id="heroStatsNav" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box" onclick="document.getElementById('shopM').style.display='flex'">
                💰 <span id="goldVal">0</span>
            </div>
            <button id="battleBtn" class="btn btn-p" onclick="startBattle()" style="padding:6px 12px; font-size:12px;">⚔️ BATTLE (<span id="tokenVal">0</span>/3)</button>
        </div>
    </div>

    <div id="childGameView">
        <div class="stats-bar">
            <span>⚔️ ATK: <b id="sAtk">0</b></span> | 🛡️ DEF: <b id="sDef">0</b> | ❤️ HP: <b id="sHp">0/0</b>
        </div>
        <div class="char-grid">
            <div class="slot-col">
                <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Weapon</span><div id="v-weapon" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('shield')"><span class="slot-label">Offhand</span><div id="v-shield" style="font-size:24px;"></div></div>
            </div>
            <div class="doll-house">
                <div class="hero-base"><div class="h-head"></div><div class="h-body"></div></div>
                <div style="position:absolute; bottom:15px; width:100%; text-align:center; font-size:12px;">
                    LVL <span id="lvlVal">1</span>
                    <div style="width:100px; height:5px; background:rgba(0,0,0,0.5); margin:5px auto; border-radius:3px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                    <div style="font-size: 8px; margin-top: 2px;">XP: <span id="xpText">0/100</span></div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes" style="font-size:24px;"></div></div>
                <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet" style="font-size:24px;"></div></div>
            </div>
        </div>

        <div class="panel">
            <strong>🎒 Inventory</strong>
            <div id="gearGrid" class="inv-grid" style="margin-top:10px;"></div>
        </div>
    </div>

    <div class="panel">
        <h3>📜 Quest Board</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="qInput" style="background:var(--bg); border:1px solid var(--border); color:white; padding:12px; border-radius:10px; flex:1;" placeholder="Add a task...">
            <button class="btn btn-p" onclick="addQuest()" style="width:60px; font-size: 20px;">+</button>
        </div>
        <div id="activeQuestList"></div>
        <button class="collapse-btn" onclick="toggleCol('historyBox')"><span>🌟 HISTORY</span><span id="histArrow">▼</span></button>
        <div id="historyBox" class="collapse-content"><div id="historyList"></div></div>
    </div>
</div>

<div id="lvlUpM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:300px; text-align:center; border: 2px solid var(--gold);">
        <h1 style="color:var(--gold); margin:0;">🎉 LEVEL UP!</h1>
        <p style="font-size:18px;">You reached Level <span id="lvlUpVal">1</span></p>
        <p style="color:var(--success)">Stats increased & HP Refilled!</p>
        <button class="btn btn-p" style="width:100%; padding:15px;" onclick="document.getElementById('lvlUpM').style.display='none'">AWESOME!</button>
    </div>
</div>

<div id="shopM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:400px;">
        <h2 style="color:var(--gold); text-align:center; margin-top:0;">💰 MERCHANT'S VAULT</h2>
        <div class="shop-row">
            <div><strong>Mystery Chest</strong><br><small>Random Gear</small></div>
            <button class="btn" style="background:var(--gold); color:black; padding:10px 15px;" onclick="buyChest()">📦 250g</button>
        </div>
        <div class="shop-row">
            <div><strong>Health Potion</strong><br><small>Heal 50% HP</small></div>
            <button class="btn" style="background:var(--success); color:black; padding:10px 15px;" onclick="buyPotion()">🧪 100g</button>
        </div>
        <button class="btn" style="width:100%; margin-top:15px; background:var(--border);" onclick="document.getElementById('shopM').style.display='none'">CLOSE</button>
    </div>
</div>

<div id="itemM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:320px; text-align:center;">
        <h2 id="mItemTitle"></h2>
        <div id="mItemIcon" style="font-size:60px; margin:10px 0;"></div>
        <div id="mItemStats" style="font-size:12px; color:var(--accent); margin-bottom:15px;"></div>
        <div id="equipActions">
            <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doEquipFromMenu()">🛡️ EQUIP</button>
            <button id="upgradeBtn" class="btn" style="width:100%; padding:15px; margin-bottom:10px; background:var(--gold); color:black;" onclick="doUpgrade()">⭐ UPGRADE</button>
        </div>
        <div id="potionActions" style="display:none;">
            <button class="btn" style="width:100%; padding:15px; margin-bottom:10px; background:var(--success); color:black;" onclick="usePotion()">🧪 USE POTION</button>
        </div>
        <button class="btn btn-danger" style="width:100%; padding:12px;" onclick="doSell()">💰 SELL (50g)</button>
        <button class="btn" style="width:100%; margin-top:15px; background:var(--border);" onclick="document.getElementById('itemM').style.display='none'">CANCEL</button>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" style="width:95%; max-width:450px; text-align:center;">
        <div class="arena">
            <div id="battleMsg" style="padding:10px; color:var(--gold); font-weight:bold;">Combat!</div>
            <div id="hF">
                <div class="hp-bar-outer"><div id="hHpFill" class="hp-bar-inner" style="background:var(--success)"></div></div>
                <div style="width:40px; height:60px; background:var(--accent); border-radius:4px; margin:0 auto;"></div>
            </div>
            <div id="mF">
                <div class="hp-bar-outer"><div id="mHpFill" class="hp-bar-inner" style="background:var(--danger)"></div></div>
                <div id="mEmoji" style="font-size:60px;">👾</div>
                <div style="font-size:10px; color:var(--danger); font-weight:bold;" id="mStatsLbl"></div>
            </div>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-p" style="flex:2; padding:18px;" id="atkBtn" onclick="heroTurn()">⚔️ ATTACK</button>
            <button class="btn btn-danger" style="flex:1; padding:18px;" id="fleeBtn" onclick="fleeBattle()">🏃 FLEE</button>
        </div>
    </div>
</div>

<script>
const GEAR_DB = [{n:"Sword",i:"⚔️",s:"weapon"},{n:"Axe",i:"🪓",s:"weapon"},{n:"Shield",i:"🛡️",s:"shield"},{n:"Helm",i:"🪖",s:"helmet"},{n:"Plate",i:"👕",s:"armor"},{n:"Boots",i:"👢",s:"shoes"},{n:"Dog",i:"🐶",s:"pet"},{n:"Drake",i:"🐲",s:"pet"}];
let state = { role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, tokens: 0, quests: [], history: [], inv: [], equip: {helmet:null, weapon:null, shield:null, armor:null, shoes:null, pet:null} };
let curM = { hp: 50, max: 50, atk: 5, def: 2 }, curH = { atk: 0, def: 0, maxHp: 100 }, selectedIdx = -1, isActing = false;

function save() { localStorage.setItem('QuestKid_Master_V6', JSON.stringify(state)); }
function load() { const s = localStorage.getItem('QuestKid_Master_V6'); if(s) state = JSON.parse(s); }

function doLogin(r) { state.role = r; document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; render(); }
function toggleCol(id) { document.getElementById(id).classList.toggle('show'); }

function addQuest() {
    const v = document.getElementById('qInput').value;
    if(!v) return;
    state.quests.push({txt: v, status: 'open', lucky: false});
    document.getElementById('qInput').value = '';
    render();
}

function updateQuest(i, act) {
    if(act === 'done') {
        const q = state.quests[i];
        state.gold += 50; state.xp += 40; 
        state.tokens++; 
        if(Math.random() < (q.lucky ? 0.8 : 0.3)) state.inv.push(generateItem());
        state.history.unshift(state.quests.splice(i, 1)[0]);
        checkLevelUp();
    } else { state.quests[i].status = act; }
    render();
}

function checkLevelUp() {
    let nextLvlXp = state.lvl * 100;
    if(state.xp >= nextLvlXp) {
        state.xp -= nextLvlXp; state.lvl++;
        calculateStats();
        state.hp = curH.maxHp;
        if(state.role === 'child') {
            document.getElementById('lvlUpVal').innerText = state.lvl;
            document.getElementById('lvlUpM').style.display = 'flex';
        }
        checkLevelUp();
    }
}

function generateItem() {
    let r = GEAR_DB[Math.floor(Math.random()*GEAR_DB.length)];
    let rarRoll = Math.random();
    let rar = rarRoll < 0.05 ? 4 : (rarRoll < 0.15 ? 3 : (rarRoll < 0.4 ? 2 : 1));
    return { ...r, v: 0, baseP: Math.floor(Math.random()*3)+1, r: rar, type: 'gear' };
}

function buyChest() {
    if(state.gold < 250) return alert("Need 250g!");
    state.gold -= 250; state.inv.push(generateItem()); render();
}

function buyPotion() {
    if(state.gold < 100) return alert("Need 100g!");
    state.gold -= 100; state.inv.push({n: "Health Potion", i: "🧪", s: "consumable", type: 'potion'}); render();
}

function calculateStats() {
    curH.atk = 5 + (state.lvl * 3); curH.def = 2 + (state.lvl * 2); curH.maxHp = 100 + (state.lvl * 25);
    for(let s in state.equip) {
        let it = state.equip[s]; if(!it) continue;
        let p = (it.baseP * 4) + (it.v * 7);
        if(s === 'weapon') curH.atk += p * 2;
        if(s === 'shield') curH.atk += p;
        if(['helmet','armor','shoes'].includes(s)) curH.def += p;
        if(s === 'pet') { curH.atk += Math.floor(p/2); curH.maxHp += p * 10; }
    }
}

function render() {
    calculateStats();
    if(state.hp > curH.maxHp) state.hp = curH.maxHp;
    const isP = state.role === 'parent';
    let nextLvlXp = state.lvl * 100;
    
    document.getElementById('roleLabel').innerText = isP ? "🔑 PARENT" : "🧒 HERO";
    document.getElementById('childGameView').style.display = isP ? 'none' : 'block';
    document.getElementById('heroStatsNav').style.visibility = isP ? 'hidden' : 'visible';
    
    document.getElementById('goldVal').innerText = state.gold;
    const tVal = document.getElementById('tokenVal');
    tVal.innerText = state.tokens;
    tVal.className = state.tokens < 0 ? "token-neg" : "";
    
    document.getElementById('lvlVal').innerText = state.lvl;
    document.getElementById('xpBar').style.width = (state.xp / nextLvlXp * 100) + "%";
    document.getElementById('xpText').innerText = `${state.xp}/${nextLvlXp}`;
    document.getElementById('sAtk').innerText = curH.atk;
    document.getElementById('sDef').innerText = curH.def;
    document.getElementById('sHp').innerText = Math.floor(state.hp) + "/" + curH.maxHp;

    let qH = '';
    state.quests.forEach((q, i) => {
        let ui = isP ? `<div><span onclick="state.quests[${i}].lucky=!state.quests[${i}].lucky; render();" class="lucky-tag ${q.lucky?'lucky-active':''}">🍀 x2</span>${q.status==='pending'?`<button onclick="updateQuest(${i},'done')" class="btn btn-p" style="display:inline; padding:5px 10px;">✅</button>`:''}<button onclick="state.quests.splice(${i},1); render();" class="btn btn-danger" style="display:inline; padding:5px 10px; margin-left:5px;">❌</button></div>` : (q.status==='open' ? `<button onclick="updateQuest(${i},'pending')" class="btn btn-p" style="padding:8px 20px;">DONE</button>` : `<span style="color:var(--gold)">⏳ PENDING</span>`);
        qH += `<div class="q-row"><span>${q.txt} ${q.lucky?'🍀':''}</span>${ui}</div>`;
    });
    document.getElementById('activeQuestList').innerHTML = qH || 'No quests.';
    let iH = '';
    state.inv.forEach((it, i) => { iH += `<div class="inv-item" onclick="openItemMenu(${i})" style="border-color:${it.type==='potion'?'var(--success)':'var(--rarity'+it.r+')'}">${it.v>0?`<div class="lvl-tag">+${it.v}</div>`:''}<div>${it.i}</div></div>`; });
    document.getElementById('gearGrid').innerHTML = iH || 'Empty';
    for(let s in state.equip) document.getElementById('v-'+s).innerHTML = state.equip[s] ? state.equip[s].i : '';
    save();
}

function openItemMenu(i) {
    selectedIdx = i; const it = state.inv[i];
    document.getElementById('mItemTitle').innerText = it.n + (it.v>0?` +${it.v}`:'');
    document.getElementById('mItemIcon').innerText = it.i;
    if(it.type === 'potion') {
        document.getElementById('mItemStats').innerText = "Heals 50% HP";
        document.getElementById('equipActions').style.display = 'none';
        document.getElementById('potionActions').style.display = 'block';
    } else {
        document.getElementById('mItemStats').innerText = `Base: ${it.baseP} | Rarity: ${it.r}`;
        document.getElementById('equipActions').style.display = 'block';
        document.getElementById('potionActions').style.display = 'none';
        const dupe = state.inv.findIndex((x, idx) => idx !== i && x.n === it.n && x.v === it.v && x.baseP === it.baseP && x.type !== 'potion');
        document.getElementById('upgradeBtn').disabled = (dupe === -1);
    }
    document.getElementById('itemM').style.display = 'flex';
}

function usePotion() {
    state.hp = Math.min(curH.maxHp, state.hp + (curH.maxHp * 0.5));
    state.inv.splice(selectedIdx, 1);
    document.getElementById('itemM').style.display = 'none';
    render();
}

function doEquipFromMenu() { const it = state.inv.splice(selectedIdx, 1)[0]; const old = state.equip[it.s]; state.equip[it.s] = it; if(old) state.inv.push(old); document.getElementById('itemM').style.display = 'none'; render(); }
function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; render(); } }
function doUpgrade() { const it = state.inv[selectedIdx]; const dupe = state.inv.findIndex((x, idx) => idx !== selectedIdx && x.n === it.n && x.v === it.v && x.baseP === it.baseP); state.inv[selectedIdx].v++; state.inv.splice(dupe, 1); document.getElementById('itemM').style.display = 'none'; render(); }
function doSell() { state.gold += 50; state.inv.splice(selectedIdx, 1); document.getElementById('itemM').style.display = 'none'; render(); }

function startBattle() {
    if(state.tokens < 3) return alert("Need 3 Battle Tokens!");
    state.tokens -= 3;
    curM.max = 50 + (state.lvl * 25); curM.hp = curM.max;
    curM.atk = 6 + (state.lvl * 5); curM.def = 2 + (state.lvl * 3);
    document.getElementById('battleM').style.display = 'flex';
    document.getElementById('atkBtn').disabled = false;
    document.getElementById('fleeBtn').disabled = false;
    isActing = false; updateBars();
}

function fleeBattle() {
    if(isActing) return;
    state.tokens -= 1;
    alert("Fled! -1 Battle Token penalty.");
    document.getElementById('battleM').style.display = 'none';
    render();
}

function updateBars() {
    document.getElementById('hHpFill').style.width = (state.hp/curH.maxHp*100) + "%";
    document.getElementById('mHpFill').style.width = (curM.hp/curM.max*100) + "%";
    document.getElementById('mStatsLbl').innerText = `⚔️${curM.atk} 🛡️${curM.def}`;
}

function heroTurn() {
    if(isActing) return;
    isActing = true;
    document.getElementById('atkBtn').disabled = true;
    document.getElementById('fleeBtn').disabled = true;
    const hero = document.getElementById('hF');
    hero.classList.add('bump-right');
    setTimeout(() => {
        let dmg = Math.max(5, curH.atk - curM.def);
        curM.hp = Math.max(0, curM.hp - dmg);
        updateBars(); hero.classList.remove('bump-right');
        if(curM.hp <= 0) { 
            let dropMsg = "";
            if(Math.random() < 0.25) { let drop = generateItem(); state.inv.push(drop); dropMsg = `\n🎁 Drop: ${drop.i} ${drop.n}!`; }
            alert(`Victory! +100g${dropMsg}`); state.gold += 100; document.getElementById('battleM').style.display='none'; render(); 
        } else { setTimeout(monsterTurn, 600); }
    }, 200);
}

function monsterTurn() {
    const monster = document.getElementById('mF');
    monster.classList.add('bump-left');
    setTimeout(() => {
        let dmg = Math.max(5, curM.atk - curH.def);
        state.hp = Math.max(0, state.hp - dmg);
        updateBars(); monster.classList.remove('bump-left');
        if(state.hp <= 0) { alert("Defeat!"); state.hp = 20; document.getElementById('battleM').style.display='none'; render(); }
        else { isActing = false; document.getElementById('atkBtn').disabled = false; document.getElementById('fleeBtn').disabled = false; }
    }, 200);
}

load();
</script>

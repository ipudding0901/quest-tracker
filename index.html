
<!DOCTYPE html>
<html>
<head>
  <title>RPG Quest Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #020617;
      color: white;
    }

    h1 {
      text-align: center;
      color: gold;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
    }

    .title {
      border-bottom: 1px solid #334155;
      margin-bottom: 5px;
      font-weight: bold;
    }

    /* CHARACTER */
    .avatar {
      position: relative;
      width: 150px;
      height: 150px;
      margin: auto;
    }

    .layer {
      position: absolute;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .pet {
      position: absolute;
      right: -40px;
      bottom: 0;
      width: 60px;
      image-rendering: pixelated;
    }

    /* INVENTORY */
    .inventory {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .item {
      border: 1px solid #334155;
      padding: 5px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .common { color: gray; }
    .rare { color: blue; }
    .unique { color: purple; }
    .legendary { color: gold; }

    button {
      margin: 3px;
      padding: 5px;
      cursor: pointer;
    }

    .quest {
      border-bottom: 1px solid #334155;
      padding: 5px;
    }

    .battle-log {
      font-size: 12px;
      height: 120px;
      overflow-y: auto;
      background: #020617;
      padding: 5px;
    }

  </style>
</head>

<body>

<h1>⚔️ RPG QUEST GAME</h1>

<div class="layout">

  <!-- CHARACTER -->
  <div class="panel">
    <div class="title">Character</div>

    <div class="avatar">
      <img id="base" class="layer" src="https://i.imgur.com/6X12F5O.png">
      <img id="helmet" class="layer">
      <img id="chest" class="layer">
      <img id="weapon" class="layer">
      <img id="shoes" class="layer">
      <img id="pet" class="pet">
    </div>

    <div id="stats"></div>

    <p>
      Helmet: <span id="helmetName">None</span><br>
      Chest: <span id="chestName">None</span><br>
      Weapon: <span id="weaponName">None</span><br>
      Shoes: <span id="shoesName">None</span>
    </p>

    <button onclick="setRole('child')">Child</button>
    <button onclick="setRole('parent')">Parent</button>
    <p id="mode"></p>
  </div>

  <!-- QUESTS -->
  <div class="panel">
    <div class="title">Quests</div>
    <input id="questInput" placeholder="New quest">
    <button onclick="addQuest()">Add</button>
    <div id="quests"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div class="title">Inventory (click to equip)</div>
    <div id="inventory" class="inventory"></div>

    <div class="title">Battle</div>
    <button onclick="fight()">Fight</button>
    <div id="battleLog" class="battle-log"></div>
  </div>

</div>

<script>
let role="child";

let player={
  level:1,
  xp:0,
  baseAttack:5,
  helmet:null,
  chest:null,
  weapon:null,
  shoes:null,
  pet:{
    name:"Slime",
    img:"https://i.imgur.com/jM3yX7G.png"
  },
  inventory:[]
};

let quests=[];

function setRole(r){
  role=r;
  render();
}

function addQuest(){
  let text=document.getElementById("questInput").value;
  if(!text) return;

  quests.push({
    text,
    status: role==="parent"?"assigned":"pending"
  });
  render();
}

function submitQuest(i){
  quests[i].status="pending";
  render();
}

function recallQuest(i){
  quests.splice(i,1);
  render();
}

function approveQuest(i){
  quests[i].status="done";
  reward();
  render();
}

function reward(){
  player.xp+=20;

  if(player.xp>=player.level*100){
    player.xp=0;
    player.level++;
    log("LEVEL UP!");
  }

  if(Math.random()<0.3){
    let item=rollLoot();
    player.inventory.push(item);
    log("Loot: "+item.name);
  }
}

function rollLoot(){
  let r=Math.random();

  if(r<0.4) return {name:"Iron Helmet",type:"helmet",rarity:"common",atk:1,img:"https://i.imgur.com/Z6X6YQb.png"};
  if(r<0.7) return {name:"Steel Armor",type:"chest",rarity:"rare",atk:2,img:"https://i.imgur.com/8Qf6K2G.png"};
  if(r<0.9) return {name:"Boots",type:"shoes",rarity:"unique",atk:1,img:"https://i.imgur.com/3Wb7GQp.png"};
  return {name:"Legend Sword",type:"weapon",rarity:"legendary",atk:4,img:"https://i.imgur.com/0Z8FQ9S.png"};
}

function equip(item){
  player[item.type]=item;
  render();
}

function totalAttack(){
  return player.baseAttack +
    (player.weapon?player.weapon.atk:0) +
    (player.chest?player.chest.atk:0) +
    (player.helmet?player.helmet.atk:0) +
    (player.shoes?player.shoes.atk:0);
}

function fight(){
  let enemy=10+Math.random()*20;

  if(totalAttack()>enemy){
    player.xp+=10;
    log("Victory!");
  } else {
    log("Defeat...");
  }

  render();
}

function log(text){
  document.getElementById("battleLog").innerHTML += text+"<br>";
}

function render(){

  document.getElementById("mode").innerText=role.toUpperCase();

  document.getElementById("stats").innerHTML=
    "Level: "+player.level+
    "<br>XP: "+player.xp+
    "<br>ATK: "+totalAttack();

  // equipment names
  document.getElementById("helmetName").innerText=player.helmet?player.helmet.name:"None";
  document.getElementById("chestName").innerText=player.chest?player.chest.name:"None";
  document.getElementById("weaponName").innerText=player.weapon?player.weapon.name:"None";
  document.getElementById("shoesName").innerText=player.shoes?player.shoes.name:"None";

  // visuals
  document.getElementById("helmet").src=player.helmet?player.helmet.img:"";
  document.getElementById("chest").src=player.chest?player.chest.img:"";
  document.getElementById("weapon").src=player.weapon?player.weapon.img:"";
  document.getElementById("shoes").src=player.shoes?player.shoes.img:"";
  document.getElementById("pet").src=player.pet.img;

  // quests
  let qHTML="";
  quests.forEach((q,i)=>{
    qHTML+=`
      <div class="quest">
        ${q.text} (${q.status})
        ${role==="child" && q.status==="assigned"?`<button onclick="submitQuest(${i})">Submit</button>`:""}
        ${role==="child" && q.status==="pending"?`<button onclick="recallQuest(${i})">Recall</button>`:""}
        ${role==="parent" && q.status==="pending"?`<button onclick="approveQuest(${i})">Approve</button>`:""}
      </div>`;
  });
  document.getElementById("quests").innerHTML=qHTML;

  // inventory
  let inv="";
  player.inventory.forEach(i=>{
    inv+=`
      <div class="item ${i.rarity}" onclick='equip(${JSON.stringify(i)})'>
        <img src="${i.img}" width="30"><br>
        ${i.name}
      </div>`;
  });
  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

<style>
    /* ... (Keep your previous root colors) ... */

    .avatar-viewport { 
        position: relative; 
        width: 240px; 
        height: 240px; 
        margin: 0 auto 20px; 
        background: radial-gradient(circle, #334155, #0f172a); 
        border-radius: 50%; 
        border: 4px solid #475569;
        overflow: hidden;
    }

    /* THE FIX: Absolute positioning with middle-anchoring */
    .layer { 
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%); /* Centers every emoji on the same spot */
        display: block;
        pointer-events: none; 
        transition: all 0.2s ease-out;
        line-height: 1;
    }

    /* Offset each slot relative to the center of the body */
    #layer-body    { z-index: 1; font-size: 110px; }
    
    #layer-shoes   { z-index: 2; font-size: 50px; margin-top: 75px; } /* Bottom */
    
    #layer-armor   { z-index: 3; font-size: 85px; margin-top: 15px; } /* Torso */
    
    #layer-helmet  { z-index: 4; font-size: 75px; margin-top: -65px; } /* Head */
    
    #layer-weapon  { 
        z-index: 5; font-size: 65px; 
        margin-left: -75px; margin-top: 10px; 
        transform: translate(-50%, -50%) rotate(-15deg); 
    }
    
    #layer-shield  { 
        z-index: 5; font-size: 65px; 
        margin-left: 75px; margin-top: 10px; 
    }
    
    #layer-pet     { 
        z-index: 6; font-size: 45px; 
        margin-left: 60px; margin-top: 70px; 
    }

    /* ANIMATIONS */
    .hero-attack { animation: lunge 0.3s ease-in-out; }
    @keyframes lunge {
        0% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-70%, -50%) scale(1.1); } /* Lunges toward monster */
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    .monster-damaged { animation: flashRed 0.4s; }
    @keyframes flashRed {
        0% { filter: none; }
        50% { filter: brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(5); transform: scale(0.9); }
        100% { filter: none; }
    }

    .player-damaged { animation: shakeRed 0.4s; }
    @keyframes shakeRed {
        0% { background-color: transparent; }
        25% { background-color: rgba(255,0,0,0.3); transform: translateX(-10px); }
        75% { transform: translateX(10px); }
        100% { background-color: transparent; }
    }
</style>

<script>
// ... (Your existing state management) ...

function playerAttack() {
    const btn = document.getElementById('atkBtn');
    const hero = document.getElementById('avatar-view');
    const monsterImg = document.getElementById('mImg');
    
    btn.disabled = true;

    // 1. Hero Lunges
    hero.classList.add('hero-attack');
    
    setTimeout(() => {
        // 2. Monster takes damage & Flashes
        monsterImg.classList.add('monster-damaged');
        
        let totalAtk = state.baseAtk + calculateBonus('atk');
        state.mHp -= totalAtk;

        if (state.mHp <= 0) {
            monsterDefeated();
        } else {
            // 3. Monster hits back after a brief delay
            setTimeout(monsterAttack, 400);
        }
        
        render();
    }, 150);

    // Cleanup animations
    setTimeout(() => {
        hero.classList.remove('hero-attack');
        monsterImg.classList.remove('monster-damaged');
        btn.disabled = false;
    }, 600);
}

function monsterAttack() {
    const card = document.getElementById('player-card');
    card.classList.add('player-damaged');
    
    // Logic for taking damage
    state.hp -= state.mAtk;
    
    if (state.hp <= 0) {
        state.hp = 0;
        alert("Oh no! You fainted. Rest up and try again!");
        state.hp = state.baseMaxHp + calculateBonus('hp'); // Respawn
        state.gold = Math.floor(state.gold * 0.9); // 10% Gold penalty
    }
    
    render();
    setTimeout(() => card.classList.remove('player-damaged'), 400);
}

function monsterDefeated() {
    // Better loot logic: Monster drops gold/gems, Quests drop gear
    const goldEarned = 10 + Math.floor(Math.random() * 15);
    state.gold += goldEarned;
    state.xp += 20;
    
    // Scale monster for next fight
    state.mMax = Math.floor(state.mMax * 1.2);
    state.mHp = state.mMax;
    state.mAtk += 2;
    
    checkLevelUp();
    render();
}
// ... (rest of your render and logic) ...
</script>

<html>
<head>
  <title>Quest RPG</title>

  <style>
    body {
      margin: 0;

      max-width: 1100px;

      padding: 6px;

<body>

<div class="app">

  <h1>⚔️ Quest RPG</h1>

  <div class="mode-toggle">
    <button onclick="setRole('child')">Child</button>
    <button onclick="setRole('parent')">Parent</button>
    <div id="mode"></div>
  </div>

  <div class="grid">

    <!-- CHARACTER -->
    <div class="card">
      <div class="title">Character</div>

      <div class="avatar">
        <img id="base" class="layer" src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png">
        <img id="helmet" class="layer">
        <img id="chest" class="layer">
        <img id="weapon" class="layer">
        <img id="shoes" class="layer">
        <img class="pet" src="https://kenney.nl/assets/animal-pack/PNG/Round/bee.png">
      </div>

      <div id="stats"></div>

      XP
      <div class="bar"><div id="xpBar" class="fill"></div></div>

    </div>

    <!-- QUESTS -->
    <div class="card">
      <div class="title">Quests</div>

      <input id="questInput">
      <button onclick="addQuest()">Add</button>

      <div id="quests"></div>
    </div>

    <!-- BATTLE -->
    <div class="card">
      <div class="title">Battle</div>

      <div class="battle">
        <div>
          <img src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png" width="70">
          <div class="bar"><div id="pHP" class="fill"></div></div>
        </div>

        <div>
          <img src="https://kenney.nl/assets/monster-pack/PNG/Slime/slimeBlock.png" width="70">
          <div class="bar"><div id="mHP" class="fill"></div></div>
        </div>
      </div>

      <button onclick="attack()">Attack</button>

      <div id="log" class="log"></div>

      <div class="title">Inventory</div>
      <div id="inventory" class="inventory"></div>
    </div>

  </div>
</div>

<script>
let role="child";

let player={
  level:1,
  xp:0,
  xpNeeded:100,
  hp:100,
  maxHp:100,
  atk:5,
  helmet:null,
  chest:null,
  weapon:null,
  shoes:null,
  inventory:[]
};

let monster={hp:50,maxHp:50};
let quests=[];

function setRole(r){
  role=r;
  document.getElementById("mode").innerText="Mode: "+r;
  render();
}

function addQuest(){
  let t=document.getElementById("questInput").value;
  quests.push({
    text:t,
    status: role==="parent"?"assigned":"pending"
  });
  render();
}

function submitQuest(i){
  quests[i].status="pending";
  render();
}

function recallQuest(i){
  quests.splice(i,1);
  render();
}

function approveQuest(i){
  quests[i].status="done";
  gainXP(30);
  render();
}

function gainXP(amount){
  player.xp+=amount;

  if(player.xp>=player.xpNeeded){
    player.xp-=player.xpNeeded;
    player.level++;
    player.xpNeeded*=1.2;
    log("✨ LEVEL UP!");
  }
}

function attack(){
  monster.hp-=player.atk;

  if(monster.hp<=0){
    log("Monster defeated!");
    monster.hp=50;
    gainXP(20);
    player.inventory.push(rollLoot());
  } else {
    player.hp-=5;
    log("You attacked!");
  }

  render();
}

function rollLoot(){
  let types=["helmet","chest","weapon","shoes"];
  return {
    type:types[Math.floor(Math.random()*4)],
    img:"https://kenney.nl/assets/character-pack-revised/PNG/Accessories/sword.png"
  };
}

function equip(i){
  player[i.type]=i;
  render();
}

function log(t){
  document.getElementById("log").innerHTML+=t+"<br>";
}

function render(){

  document.getElementById("stats").innerHTML=
    "Level: "+player.level+"<br>ATK:"+player.atk;

  document.getElementById("xpBar").style.width=
    (player.xp/player.xpNeeded*100)+"%";

  document.getElementById("pHP").style.width=
    (player.hp/player.maxHp*100)+"%";

  document.getElementById("mHP").style.width=
    (monster.hp/monster.maxHp*100)+"%";

  document.getElementById("helmet").src=player.helmet?player.helmet.img:"";
  document.getElementById("chest").src=player.chest?player.chest.img:"";
  document.getElementById("weapon").src=player.weapon?player.weapon.img:"";
  document.getElementById("shoes").src=player.shoes?player.shoes.img:"";

  let q="";
  quests.forEach((x,i)=>{
    q+=`<div class="quest">
      ${x.text} (${x.status})
      ${role==="child" && x.status==="assigned"?`<button onclick="submitQuest(${i})">Submit</button>`:""}
      ${role==="child" && x.status==="pending"?`<button onclick="recallQuest(${i})">Recall</button>`:""}
      ${role==="parent" && x.status==="pending"?`<button onclick="approveQuest(${i})">Approve</button>`:""}
    </div>`;
  });
  document.getElementById("quests").innerHTML=q;

  let inv="";
  player.inventory.forEach(i=>{
    inv+=`<div class="item" onclick='equip(${JSON.stringify(i)})'>
      <img src="${i.img}" width="30">
    </div>`;
  });
  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

```html
<!DOCTYPE html>
<html>
<head>
  <title>RPG Quest Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #020617;
      color: white;
    }

    h1 {
      text-align: center;
      color: gold;
    }

    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 10px;
      padding: 10px;
    }

    .panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
    }

    .avatar {
      position: relative;
      width: 150px;
      height: 150px;
      margin: auto;
    }

    .layer {
      position: absolute;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .pet {
      position: absolute;
      right: -40px;
      bottom: 0;
      font-size: 40px;
    }

    .inventory {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
    }

    .item {
      border: 1px solid #334155;
      padding: 5px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
    }

    .common { color: gray; }
    .rare { color: blue; }
    .unique { color: purple; }
    .legendary { color: gold; }

    button { margin: 3px; }

  </style>
</head>

<body>

<h1>⚔️ RPG QUEST GAME</h1>

<div class="layout">

  <!-- CHARACTER -->
  <div class="panel">
    <h3>Character</h3>

    <div class="avatar">
      <img id="base" class="layer" src="https://kenney.nl/assets/character-pack-revised/PNG/Characters/characterAdventurer_idle.png">
      <img id="helmet" class="layer">
      <img id="chest" class="layer">
      <img id="weapon" class="layer">
      <img id="shoes" class="layer">
      <div id="pet" class="pet">🐾</div>
    </div>

    <div id="stats"></div>

    <button onclick="setRole('child')">Child</button>
    <button onclick="setRole('parent')">Parent</button>
    <p id="mode"></p>
  </div>

  <!-- QUESTS -->
  <div class="panel">
    <h3>Quests</h3>
    <input id="questInput">
    <button onclick="addQuest()">Add</button>
    <div id="quests"></div>
  </div>

  <!-- INVENTORY -->
  <div class="panel">
    <h3>Inventory</h3>
    <div id="inventory" class="inventory"></div>

    <h3>Battle</h3>
    <button onclick="fight()">Fight</button>
    <div id="battle"></div>
  </div>

</div>

<script>
let role="child";

let player={
  level:1,
  xp:0,
  baseAttack:5,
  helmet:null,
  chest:null,
  weapon:null,
  shoes:null,
  inventory:[]
};

let quests=[];

function setRole(r){
  role=r;
  render();
}

function addQuest(){
  let text=document.getElementById("questInput").value;
  if(!text) return;

  quests.push({
    text,
    status: role==="parent"?"assigned":"pending"
  });
  render();
}

function submitQuest(i){
  quests[i].status="pending";
  render();
}

function recallQuest(i){
  quests.splice(i,1);
  render();
}

function approveQuest(i){
  quests[i].status="done";
  reward();
  render();
}

function reward(){
  player.xp+=20;
  if(player.xp>=player.level*100){
    player.xp=0;
    player.level++;
  }

  if(Math.random()<0.3){
    player.inventory.push(rollLoot());
  }
}

function rollLoot(){
  let r=Math.random();

  if(r<0.4) return {name:"Helmet",type:"helmet",rarity:"common",atk:1};
  if(r<0.7) return {name:"Armor",type:"chest",rarity:"rare",atk:2};
  if(r<0.9) return {name:"Boots",type:"shoes",rarity:"unique",atk:1};
  return {name:"Sword",type:"weapon",rarity:"legendary",atk:4};
}

function equip(item){
  player[item.type]=item;
  render();
}

function totalAttack(){
  return player.baseAttack +
    (player.weapon?.atk||0) +
    (player.chest?.atk||0) +
    (player.helmet?.atk||0) +
    (player.shoes?.atk||0);
}

function fight(){
  let enemy=10+Math.random()*20;
  document.getElementById("battle").innerText =
    totalAttack()>enemy ? "Victory!" : "Defeat...";
}

function render(){
  document.getElementById("mode").innerText=role;

  document.getElementById("stats").innerHTML=
    "Level:"+player.level+
    "<br>XP:"+player.xp+
    "<br>ATK:"+totalAttack();

  let qHTML="";
  quests.forEach((q,i)=>{
    qHTML+=`
      <div>
        ${q.text} (${q.status})
        ${role==="child" && q.status==="assigned"?`<button onclick="submitQuest(${i})">Submit</button>`:""}
        ${role==="child" && q.status==="pending"?`<button onclick="recallQuest(${i})">Recall</button>`:""}
        ${role==="parent" && q.status==="pending"?`<button onclick="approveQuest(${i})">Approve</button>`:""}
      </div>`;
  });
  document.getElementById("quests").innerHTML=qHTML;

  let inv="";
  player.inventory.forEach(i=>{
    inv+=`<div class="item ${i.rarity}" onclick='equip(${JSON.stringify(i)})'>
      ${i.name}
    </div>`;
  });
  document.getElementById("inventory").innerHTML=inv;
}

render();
</script>

</body>
</html>

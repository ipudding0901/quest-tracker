<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569; --iron: #94a3b8;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    
    /* Login System */
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; }

    .app { max-width: 1100px; margin: 0 auto; padding: 10px; display: none; }

    /* Nav */
    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 4px 12px; border-radius: 15px; border: 1px solid var(--gold); }

    /* Layouts */
    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 150px 1fr 150px; } }
    .slot-col { display: flex; flex-direction: column; gap: 8px; }
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 10px; padding: 8px; min-height: 50px; text-align: center; cursor: pointer; }
    .slot-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 2px; }

    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 16px; height: 300px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; }
    .h-head { width: 35px; height: 35px; background: #fbbf24; border-radius: 50%; margin: 0 auto; position: relative; }
    .h-body { width: 50px; height: 60px; background: #0ea5e9; border-radius: 6px; margin: 3px auto; position: relative; }
    .pet-vis { position: absolute; bottom: 50px; left: calc(50% + 40px); font-size: 24px; }

    /* Panels & Buttons */
    .panel { background: var(--card); padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
    .btn { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-s { background: var(--gold); color: #451a03; }
    .btn-danger { background: var(--danger); }
    .q-row { background: var(--bg); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid var(--border); }
    
    /* Drop Rate Toggle */
    .drop-toggle { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); margin-left: 10px; }
    .drop-active { background: var(--gold); color: black; border-color: var(--gold); }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; align-items:center; justify-content:center; padding: 15px; }
    .arena { position: relative; width: 100%; height: 220px; background: linear-gradient(to bottom, #1e293b, #0f172a); border-radius: 12px; overflow: hidden; perspective: 600px; }
    .floor { position: absolute; bottom: 0; width: 100%; height: 100px; background: #334155; transform: rotateX(60deg); transform-origin: bottom; border-top: 4px solid var(--success); opacity: 0.3; }
    .combatant { position: absolute; transition: transform 0.3s; }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--accent)">QUEST KID</h2>
        <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doLogin('child')">🧒 CHILD LOGIN</button>
        <button class="btn btn-s" style="width:100%; padding:15px;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div><strong id="roleDisplay">ROLE</strong> <button class="btn" style="display:inline; font-size:10px; background:var(--border); padding:2px 8px; margin-left:10px;" onclick="doLogout()">Logout</button></div>
        <div id="childStats" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box">💰 <span id="gold">0</span></div>
            <button class="btn btn-p" onclick="startBattle()" style="padding:4px 10px; font-size:11px;">⚔️ BATTLE (<span id="btn-tokens">0</span>/3)</button>
        </div>
    </div>

    <div id="parentView" style="display:none;">
        <div class="panel">
            <h3>➕ Add New Quest</h3>
            <div style="display:flex; gap:5px;">
                <input id="qIn" style="background:var(--bg); border:1px solid var(--border); color:white; padding:10px; border-radius:6px; flex:1;" placeholder="Enter task...">
                <button class="btn btn-p" onclick="addQ()" style="width:60px;">ADD</button>
            </div>
        </div>
        <div class="panel">
            <h3>📋 Manage Tasks</h3>
            <div id="pQList"></div>
        </div>
    </div>

    <div id="childView" style="display:none;">
        <div class="char-grid">
            <div class="slot-col">
                <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head</span><div id="v-helmet"></div></div>
                <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Wpn</span><div id="v-weapon"></div></div>
                <div class="slot" onclick="unequip('shield')"><span class="slot-label">Off</span><div id="v-shield"></div></div>
            </div>
            <div class="doll-house">
                <div id="vis-pet" class="pet-vis"></div>
                <div class="hero-base">
                    <div class="h-head"><div id="vis-helmet" style="display:none; width:38px; height:20px; background:var(--iron); border-radius:15px 15px 0 0; position:absolute; top:-2px;"></div></div>
                    <div class="h-body"><div id="vis-armor" style="display:none; width:54px; height:64px; background:var(--iron); border-radius:6px; position:absolute; top:-2px; left:-2px;"></div></div>
                </div>
                <div style="position:absolute; bottom:10px; width:100%; text-align:center;">
                    <strong style="color:var(--accent); font-size:11px;">LVL <span id="lvl">1</span> | HP <span id="hp">100</span></strong>
                    <div style="width:80px; height:4px; background:#0f172a; margin:4px auto; border-radius:2px; overflow:hidden; border:1px solid var(--border);">
                        <div id="xp-bar" style="width:0%; height:100%; background:var(--accent);"></div>
                    </div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body</span><div id="v-armor"></div></div>
                <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots</span><div id="v-shoes"></div></div>
                <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet</span><div id="v-pet"></div></div>
            </div>
        </div>
        <div class="panel">
            <h3>🎒 Inventory & Pets</h3>
            <div id="invGrid" class="inv-grid" style="display:flex; gap:8px; overflow-x:auto;"></div>
        </div>
        <div class="panel">
            <h3>📜 Current Quests</h3>
            <div id="cQList"></div>
        </div>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" style="width:95%; max-width:400px;">
        <div class="arena">
            <div class="floor"></div>
            <div id="battleMsg" style="position:absolute; top:10px; width:100%; text-align:center; color:var(--gold);">Ready?</div>
            <div class="combatant" id="hFight" style="bottom:40px; left:40px;">
                <div style="width:35px; height:70px; background:var(--accent); border-radius:4px;"></div>
                <div id="hFightPet" style="position:absolute; right:-20px; bottom:0;"></div>
            </div>
            <div class="combatant" id="mFight" style="top:40px; right:40px;">
                <div id="mEmoji" style="font-size:50px;">👾</div>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px; margin-top:15px;">
            <button id="atkBtn" class="btn btn-p" onclick="heroTurn()">⚔️ STRIKE</button>
            <button class="btn btn-danger" onclick="closeM('battleM')">RUN</button>
        </div>
    </div>
</div>

<script>
const DROPS = [{n:"Helm",i:"🪖",s:"helmet"},{n:"Sword",i:"⚔️",s:"weapon"},{n:"Plate",i:"🛡️",s:"armor"},{n:"Cat",i:"🐱",s:"pet"},{n:"Dragon",i:"🐲",s:"pet"}];
const MONSTERS = [{i:"👾",h:50},{i:"🐉",h:80},{i:"👻",h:40}];

let state = {
    role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, tokens: 0,
    quests: [], inv: [],
    equip: {helmet:null, weapon:null, armor:null, pet:null}
};

function doLogin(role) {
    state.role = role;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    render();
}

function doLogout() {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
}

function save() { localStorage.setItem('questKidV4', JSON.stringify(state)); }
function load() { const s = localStorage.getItem('questKidV4'); if(s) state = JSON.parse(s); }

function addQ() {
    const val = document.getElementById('qIn').value;
    if(!val) return;
    state.quests.push({txt: val, status: 'open', lucky: false});
    document.getElementById('qIn').value = '';
    save(); render();
}

function toggleLucky(i) {
    state.quests[i].lucky = !state.quests[i].lucky;
    save(); render();
}

function updateQ(i, s) {
    const q = state.quests[i];
    if(s === 'done') {
        state.gold += 50; state.xp += 40; state.tokens += 1;
        // High Drop Rate Logic
        let chance = q.lucky ? 0.8 : 0.3;
        if(Math.random() < chance) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
        state.quests.splice(i, 1);
    } else {
        q.status = s;
    }
    if(state.xp >= 100) { state.lvl++; state.xp -= 100; }
    save(); render();
}

// BATTLE LOGIC (TURN BASED)
let bActive = false;
let mHp = 0;
function startBattle() {
    if(state.tokens < 3) return alert("Need 3 Tokens!");
    state.tokens -= 3;
    const m = MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
    mHp = m.h; document.getElementById('mEmoji').innerText = m.i;
    document.getElementById('battleMsg').innerText = "Fight!";
    document.getElementById('battleM').style.display = 'flex';
    bActive = false;
}

function heroTurn() {
    if(bActive) return;
    bActive = true;
    document.getElementById('hFight').style.transform = 'translateX(50px)';
    setTimeout(() => {
        mHp -= 20;
        document.getElementById('hFight').style.transform = 'translateX(0)';
        if(mHp <= 0) {
            document.getElementById('battleMsg').innerText = "Victory!";
            state.gold += 20;
            setTimeout(() => { closeM('battleM'); render(); }, 1000);
        } else {
            document.getElementById('battleMsg').innerText = "Monster hits back!";
            setTimeout(monsterTurn, 1000);
        }
    }, 300);
}

function monsterTurn() {
    document.getElementById('mFight').style.transform = 'translateX(-50px)';
    setTimeout(() => {
        state.hp -= 10;
        document.getElementById('mFight').style.transform = 'translateX(0)';
        document.getElementById('battleMsg').innerText = "Your Turn!";
        bActive = false;
        render();
    }, 300);
}

function closeM(id) { document.getElementById(id).style.display = 'none'; }

function render() {
    document.getElementById('roleDisplay').innerText = state.role === 'parent' ? "🔑 PARENT MODE" : "🧒 HERO MODE";
    document.getElementById('childStats').style.display = state.role === 'child' ? 'flex' : 'none';
    document.getElementById('parentView').style.display = state.role === 'parent' ? 'block' : 'none';
    document.getElementById('childView').style.display = state.role === 'child' ? 'block' : 'none';

    // Child Character
    document.getElementById('gold').innerText = state.gold;
    document.getElementById('lvl').innerText = state.lvl;
    document.getElementById('hp').innerText = state.hp;
    document.getElementById('btn-tokens').innerText = state.tokens;
    document.getElementById('xp-bar').style.width = state.xp + "%";

    // Parent List
    let pH = '';
    state.quests.forEach((q, i) => {
        pH += `<div class="q-row">
            <span>${q.txt} ${q.status==='pending'?'⏳':''}</span>
            <div>
                <span onclick="toggleLucky(${i})" class="drop-toggle ${q.lucky?'drop-active':''}">🍀 x2 Drop</span>
                ${q.status==='pending' ? `
                    <button class="btn btn-p" style="display:inline; padding:5px;" onclick="updateQ(${i},'done')">✅</button>
                    <button class="btn btn-danger" style="display:inline; padding:5px;" onclick="updateQ(${i},'open')">❌</button>
                ` : ''}
            </div>
        </div>`;
    });
    document.getElementById('pQList').innerHTML = pH || 'No active tasks.';

    // Child List
    let cH = '';
    state.quests.forEach((q, i) => {
        if(state.role === 'child') {
            let btn = q.status === 'open' ? `<button class="btn btn-p" onclick="updateQ(${i},'pending')">SEND</button>` : `<button class="btn btn-danger" onclick="updateQ(${i},'open')">RECALL</button>`;
            cH += `<div class="q-row"><span>${q.txt} ${q.lucky?'🍀':''}</span>${btn}</div>`;
        }
    });
    document.getElementById('cQList').innerHTML = cH || 'No quests. Ask your parents!';

    // Inventory & Visuals
    let invH = '';
    state.inv.forEach((it, i) => {
        invH += `<div class="slot" style="min-width:50px;" onclick="equip(${i})">${it.i}</div>`;
    });
    document.getElementById('invGrid').innerHTML = invH;

    for(let s in state.equip) {
        const item = state.equip[s];
        document.getElementById('v-'+s).innerText = item ? item.i : '';
        const vis = document.getElementById('vis-'+s);
        if(vis) vis.style.display = item ? 'block' : 'none';
        if(s === 'pet') {
            document.getElementById('vis-pet').innerText = item ? item.i : '';
            document.getElementById('hFightPet').innerText = item ? item.i : '';
        }
    }
}

function equip(i) {
    const it = state.inv.splice(i, 1)[0];
    const old = state.equip[it.s];
    state.equip[it.s] = it;
    if(old) state.inv.push(old);
    save(); render();
}

function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; save(); render(); } }

load();
render();
</script>
</body>
</html>

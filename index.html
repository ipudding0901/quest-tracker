<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Kid RPG - Stat Scaling</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --accent: #38bdf8; --gold: #fbbf24; --danger: #f87171; --success: #34d399;
      --slot: #334155; --border: #475569; --iron: #94a3b8;
      --rarity1: #94a3b8; --rarity2: #34d399; --rarity3: #38bdf8; --rarity4: #a855f7;
    }

    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    
    #loginOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); text-align: center; width: 300px; }

    .app { max-width: 1100px; margin: 0 auto; padding: 10px; display: none; }

    .nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
    .gold-box { color: var(--gold); font-weight: bold; background: #451a03; padding: 4px 12px; border-radius: 15px; border: 1px solid var(--gold); cursor: pointer; transition: 0.2s; }
    
    .stats-bar { display: flex; gap: 10px; font-size: 11px; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px; margin-bottom: 10px; color: var(--accent); }

    .char-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 768px) { .char-grid { grid-template-columns: 150px 1fr 150px; } }
    .slot-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (min-width: 768px) { .slot-col { display: flex; flex-direction: column; } }
    .slot { background: var(--slot); border: 1px dashed var(--border); border-radius: 10px; padding: 8px; min-height: 55px; text-align: center; cursor: pointer; }
    .slot-label { font-size: 8px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 2px; }

    .doll-house { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 16px; height: 300px; position: relative; border: 1px solid var(--border); overflow: hidden; }
    .hero-base { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 60px; height: 140px; }
    .h-head { width: 35px; height: 35px; background: #fbbf24; border-radius: 50%; margin: 0 auto; position: relative; }
    .h-body { width: 50px; height: 60px; background: #0ea5e9; border-radius: 6px; margin: 3px auto; position: relative; }
    .pet-vis { position: absolute; bottom: 50px; left: calc(50% + 40px); font-size: 28px; z-index: 9; }

    .panel { background: var(--card); padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
    .collapse-btn { width: 100%; text-align: left; background: none; border: none; color: var(--accent); font-weight: bold; padding: 5px 0; cursor: pointer; display: flex; justify-content: space-between; }
    .collapse-content { display: none; margin-top: 10px; }
    .collapse-content.show { display: block; }

    .inv-grid { display: flex; gap: 8px; padding: 5px; overflow-x: auto; background: var(--bg); border-radius: 8px; min-height: 60px; border: 1px solid var(--border); }
    .inv-item { background: var(--card); min-width: 60px; padding: 6px; border-radius: 8px; border: 1px solid var(--border); text-align: center; cursor: pointer; position: relative; }
    .lvl-tag { position: absolute; top: -5px; right: -5px; background: var(--gold); color: black; font-size: 9px; padding: 1px 4px; border-radius: 4px; font-weight: bold; }
    .rarity-dot { position: absolute; top: 2px; left: 2px; width: 6px; height: 6px; border-radius: 50%; }

    .btn { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-p { background: var(--accent); color: #0f172a; }
    .btn-s { background: var(--gold); color: #451a03; }
    .btn-danger { background: var(--danger); }
    .q-row { background: var(--bg); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border: 1px solid var(--border); }
    
    .lucky-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); margin-right: 8px; }
    .lucky-active { background: var(--gold); color: black; border-color: var(--gold); font-weight: bold; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:3000; align-items:center; justify-content:center; padding: 15px; }
    .arena { position: relative; width: 100%; height: 260px; background: linear-gradient(to bottom, #1e293b, #0f172a); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .hp-bar-outer { width: 80px; height: 10px; background: #000; border-radius: 5px; border: 1px solid #444; margin-bottom: 5px; overflow: hidden; }
    .hp-bar-inner { width: 100%; height: 100%; transition: width 0.3s; }
    .dmg-text { position: absolute; font-weight: bold; font-size: 20px; color: var(--danger); animation: floatUp 0.8s forwards; pointer-events: none; }
    @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
    @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(5px, 5px); } 50% { transform: translate(-5px, -5px); } 75% { transform: translate(5px, -5px); } }

    .shop-item { background: var(--bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .m-stats-overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 4px; font-size: 10px; text-align: left; }
  </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h1 style="color:var(--accent)">QUEST KID</h1>
        <button class="btn btn-p" style="width:100%; padding:15px; margin-bottom:10px;" onclick="doLogin('child')">🧒 CHILD LOGIN</button>
        <button class="btn btn-s" style="width:100%; padding:15px;" onclick="doLogin('parent')">🔑 PARENT LOGIN</button>
    </div>
</div>

<div class="app" id="mainApp">
    <div class="nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <strong id="roleLabel" style="color:var(--accent)">HERO</strong>
            <button class="btn" style="font-size:10px; background:var(--border); padding:2px 8px;" onclick="location.reload()">Logout</button>
        </div>
        <div id="heroStatsNav" style="display:flex; gap:10px; align-items:center;">
            <div class="gold-box" id="pouchBtn" onclick="openShop()">💰 <span id="goldVal">0</span></div>
            <button id="battleBtn" class="btn btn-p" onclick="startBattle()" style="padding:4px 10px; font-size:11px;">⚔️ BATTLE (<span id="tokenVal">0</span>/3)</button>
        </div>
    </div>

    <div id="childGameView">
        <div class="stats-bar" id="liveStats">
            <span>⚔️ ATK: <b id="sAtk">0</b></span>
            <span>🛡️ DEF: <b id="sDef">0</b></span>
            <span>❤️ HP: <b id="sHp">0/0</b></span>
        </div>

        <div class="char-grid">
            <div class="slot-col">
                <div class="slot" onclick="unequip('helmet')"><span class="slot-label">Head (DEF)</span><div id="v-helmet"></div></div>
                <div class="slot" onclick="unequip('weapon')"><span class="slot-label">Wpn (ATK)</span><div id="v-weapon"></div></div>
                <div class="slot" onclick="unequip('shield')"><span class="slot-label">Off (ATK)</span><div id="v-shield"></div></div>
            </div>
            <div class="doll-house">
                <div id="vis-pet" class="pet-vis" style="display:none;"></div>
                <div class="hero-base">
                    <div class="h-head"><div id="vis-helmet" style="display:none; width:38px; height:20px; background:var(--iron); border-radius:15px 15px 0 0; position:absolute; top:-2px; left:-2px;"></div></div>
                    <div class="h-body"><div id="vis-armor" style="display:none; width:54px; height:64px; background:var(--iron); border-radius:6px; position:absolute; top:-2px; left:-2px;"></div></div>
                </div>
                <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:11px;">
                    LVL <span id="lvlVal">1</span>
                    <div style="width:80px; height:4px; background:#000; margin:4px auto; border-radius:2px; overflow:hidden;"><div id="xpBar" style="width:0%; height:100%; background:var(--accent);"></div></div>
                </div>
            </div>
            <div class="slot-col">
                <div class="slot" onclick="unequip('armor')"><span class="slot-label">Body (DEF)</span><div id="v-armor"></div></div>
                <div class="slot" onclick="unequip('shoes')"><span class="slot-label">Boots (DEF)</span><div id="v-shoes"></div></div>
                <div class="slot" onclick="unequip('pet')"><span class="slot-label">Pet (ATK/HP)</span><div id="v-pet"></div></div>
            </div>
        </div>

        <div class="panel">
            <button class="collapse-btn" onclick="toggleCol('invGear')">🎒 GEAR INVENTORY <span>▼</span></button>
            <div id="invGear" class="collapse-content show"><div id="gearGrid" class="inv-grid"></div></div>
            <button class="collapse-btn" onclick="toggleCol('invPets')" style="margin-top:10px;">🐾 PET COLLECTION <span>▼</span></button>
            <div id="invPets" class="collapse-content"><div id="petGrid" class="inv-grid"></div></div>
        </div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0">📜 Quests</h3>
        <div style="display:flex; gap:5px; margin-bottom:12px;">
            <input id="qInput" style="background:var(--bg); border:1px solid var(--border); color:white; padding:10px; border-radius:8px; flex:1;" placeholder="New task...">
            <button class="btn btn-p" onclick="addQuest()" style="width:50px;">+</button>
        </div>
        <div id="activeQuestList"></div>
    </div>
</div>

<div id="itemM" class="modal-overlay">
    <div class="panel" style="width:90%; max-width:300px; text-align:center;">
        <h2 id="mItemTitle" style="margin-top:0">Item Name</h2>
        <div id="mItemIcon" style="font-size:50px; margin-bottom:5px;"></div>
        <div id="mItemStats" style="font-size:12px; color:var(--accent); margin-bottom:10px;"></div>
        <button class="btn btn-p" style="width:100%; padding:12px; margin-bottom:8px;" onclick="doEquipFromMenu()">🛡️ EQUIP</button>
        <button id="upgradeBtn" class="btn btn-s" style="width:100%; padding:12px; margin-bottom:8px;" onclick="doUpgrade()">⭐ UPGRADE (Need 2)</button>
        <button class="btn btn-danger" style="width:100%; padding:12px; margin-bottom:8px;" onclick="doSell()">💰 SELL (50g)</button>
        <button class="btn" style="width:100%; background:var(--border); padding:10px;" onclick="document.getElementById('itemM').style.display='none'">CANCEL</button>
    </div>
</div>

<div id="battleM" class="modal-overlay">
    <div class="panel" style="width:95%; max-width:400px; text-align:center;">
        <div class="arena" id="battleArena">
            <div id="battleMsg" style="text-align:center; padding-top:10px; color:var(--gold); font-weight:bold;">Fight!</div>
            <div class="m-stats-overlay">
                <span id="mName">Monster</span><br>
                ⚔️ <span id="mAtk">0</span> | 🛡️ <span id="mDef">0</span>
            </div>
            <div id="hF" style="position:absolute; bottom:40px; left:40px; transition:0.3s;">
                <div class="hp-bar-outer"><div id="hHpFill" class="hp-bar-inner" style="background:var(--success)"></div></div>
                <div style="width:30px; height:60px; background:var(--accent); border-radius:4px; margin:0 auto;"></div>
            </div>
            <div id="mF" style="position:absolute; top:40px; right:40px; transition:0.3s;">
                <div class="hp-bar-outer"><div id="mHpFill" class="hp-bar-inner" style="background:var(--danger)"></div></div>
                <div id="mEmoji" style="font-size:50px;">👾</div>
            </div>
        </div>
        <button class="btn btn-p" style="width:100%; padding:15px; margin-top:10px;" id="atkBtn" onclick="heroTurn()">⚔️ ATTACK</button>
    </div>
</div>

<script>
const GEAR_TABLE = [
    {n:"Sword",i:"⚔️",s:"weapon"},{n:"Shield",i:"🛡️",s:"shield"},
    {n:"Helm",i:"🪖",s:"helmet"},{n:"Axe",i:"🪓",s:"weapon"},
    {n:"Bow",i:"🏹",s:"weapon"},{n:"Boots",i:"👢",s:"shoes"},
    {n:"Armor",i:"👕",s:"armor"}
];
const PET_TABLE = [
    {n:"Dog",i:"🐶",s:"pet"},{n:"Cat",i:"🐱",s:"pet"},
    {n:"Dragon",i:"🐲",s:"pet"},{n:"Bird",i:"🐦",s:"pet"}
];
const MONSTERS = [{n:"Slime",i:"👾",h:50,a:5,d:2},{n:"Drake",i:"🐉",h:100,a:12,d:8},{n:"Goblin",i:"👺",h:60,a:8,d:4}];

let state = {
    role: 'child', gold: 0, lvl: 1, xp: 0, hp: 100, maxHp: 100, tokens: 0,
    quests: [], history: [], inv: [],
    equip: {helmet:null, weapon:null, shield:null, armor:null, shoes:null, pet:null}
};

let bActive = false, mHp = 50, mMaxHp = 50, mAtkVal = 0, mDefVal = 0, selectedIdx = -1;
let currentHeroAtk = 0, currentHeroDef = 0;

function save() { localStorage.setItem('questKid_Stats_Build', JSON.stringify(state)); }
function load() { 
    const s = localStorage.getItem('questKid_Stats_Build'); 
    if(s) state = JSON.parse(s); 
}

function getRandomDrop() {
    let raw = (Math.random() < 0.8) ? GEAR_TABLE[Math.floor(Math.random()*GEAR_TABLE.length)] : PET_TABLE[Math.floor(Math.random()*PET_TABLE.length)];
    let roll = Math.random();
    let rarity = roll < 0.05 ? 4 : (roll < 0.15 ? 3 : (roll < 0.4 ? 2 : 1));
    return { ...raw, v: 0, baseP: Math.floor(Math.random() * 3) + 1, r: rarity };
}

function calculateStats() {
    // Base stats scale with Level
    let baseAtk = 5 + (state.lvl * 2);
    let baseDef = 2 + state.lvl;
    let baseMaxHp = 100 + (state.lvl * 20);

    // Gear Additions
    let gearAtk = 0, gearDef = 0, gearHp = 0;

    for (let slot in state.equip) {
        let item = state.equip[slot];
        if (!item) continue;
        let power = (item.baseP * 3) + (item.v * 5) + (item.v); // Request: base + upgrade + 1 per upgrade

        if (slot === 'weapon') gearAtk += power * 2;
        if (slot === 'shield') gearAtk += power; // Offhand atk lower than main
        if (slot === 'helmet' || slot === 'armor' || slot === 'shoes') gearDef += power;
        if (slot === 'pet') { gearAtk += power; gearHp += power * 10; }
    }

    currentHeroAtk = baseAtk + gearAtk;
    currentHeroDef = baseDef + gearDef;
    state.maxHp = baseMaxHp + gearHp;
    if (state.hp > state.maxHp) state.hp = state.maxHp;

    document.getElementById('sAtk').innerText = currentHeroAtk;
    document.getElementById('sDef').innerText = currentHeroDef;
    document.getElementById('sHp').innerText = Math.round(state.hp) + "/" + state.maxHp;
}

function doLogin(r) {
    state.role = r;
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    render();
}

function openItemMenu(i) {
    selectedIdx = i;
    const item = state.inv[i];
    document.getElementById('mItemTitle').innerText = item.n + (item.v > 0 ? ` +${item.v}` : "");
    document.getElementById('mItemIcon').innerText = item.i;
    let type = (item.s === 'pet') ? "ATK/HP" : (['weapon','shield'].includes(item.s) ? "ATK" : "DEF");
    document.getElementById('mItemStats').innerHTML = `Type: ${type} | Rarity: ${item.r}/4<br>Base Power: ${item.baseP} | Upgrade: +${item.v}`;
    const dupe = state.inv.findIndex((it, idx) => idx !== i && it.n === item.n && it.v === item.v && it.baseP === item.baseP);
    document.getElementById('upgradeBtn').disabled = (dupe === -1);
    document.getElementById('itemM').style.display = 'flex';
}

function doEquipFromMenu() {
    const it = state.inv.splice(selectedIdx, 1)[0];
    const old = state.equip[it.s];
    state.equip[it.s] = it;
    if(old) state.inv.push(old);
    document.getElementById('itemM').style.display = 'none';
    render();
}

function doUpgrade() {
    const item = state.inv[selectedIdx];
    const dupeIdx = state.inv.findIndex((it, idx) => idx !== selectedIdx && it.n === item.n && it.v === item.v && it.baseP === item.baseP);
    if(dupeIdx !== -1) {
        state.inv[selectedIdx].v++;
        state.inv.splice(dupeIdx, 1);
        alert("Upgrade Success!");
    }
    document.getElementById('itemM').style.display = 'none';
    render();
}

function addQuest() {
    const val = document.getElementById('qInput').value;
    if(!val) return;
    state.quests.push({txt: val, status: 'open', lucky: false});
    document.getElementById('qInput').value = '';
    render();
}

function updateQuest(i, s) {
    if(s === 'done') {
        state.gold += 50; state.xp += 40; state.tokens += 1;
        if(Math.random() < (state.quests[i].lucky ? 0.8 : 0.3)) state.inv.push(getRandomDrop());
        state.quests.splice(i, 1);
        if(state.xp >= 100) { state.lvl++; state.xp -= 100; state.hp = state.maxHp; alert("Level Up!"); }
    } else { state.quests[i].status = s; }
    render();
}

function render() {
    calculateStats();
    const isP = state.role === 'parent';
    document.getElementById('goldVal').innerText = state.gold;
    document.getElementById('tokenVal').innerText = state.tokens;
    document.getElementById('lvlVal').innerText = state.lvl;
    document.getElementById('xpBar').style.width = state.xp + "%";

    let qH = '';
    state.quests.forEach((q, i) => {
        let act = isP ? `<button onclick="updateQuest(${i},'done')" class="btn btn-p">✅</button>` : `<button onclick="updateQuest(${i},'pending')" class="btn btn-p">DONE</button>`;
        qH += `<div class="q-row"><span>${q.txt}</span>${act}</div>`;
    });
    document.getElementById('activeQuestList').innerHTML = qH || 'No tasks.';

    let gearH = '', petH = '';
    state.inv.forEach((it, i) => {
        const html = `<div class="inv-item" onclick="openItemMenu(${i})" style="border-color:var(--rarity${it.r})">
            <div class="rarity-dot" style="background:var(--rarity${it.r})"></div>
            ${it.v>0?`<div class="lvl-tag">+${it.v}</div>`:''}
            <div>${it.i}</div><small>${it.n}</small>
        </div>`;
        if(it.s === 'pet') petH += html; else gearH += html;
    });
    document.getElementById('gearGrid').innerHTML = gearH;
    document.getElementById('petGrid').innerHTML = petH;

    for(let s in state.equip) {
        document.getElementById('v-'+s).innerHTML = state.equip[s] ? state.equip[s].i : '';
    }
    save();
}

function unequip(s) { if(state.equip[s]) { state.inv.push(state.equip[s]); state.equip[s]=null; render(); } }

function startBattle() {
    if(state.tokens < 3) return alert("Need 3 Tokens!");
    state.tokens -= 3;
    const m = MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
    mMaxHp = m.h + (state.lvl * 15); mHp = mMaxHp;
    mAtkVal = m.a + (state.lvl * 3);
    mDefVal = m.d + (state.lvl * 2);

    document.getElementById('mName').innerText = m.n + " (Lv."+state.lvl+")";
    document.getElementById('mAtk').innerText = mAtkVal;
    document.getElementById('mDef').innerText = mDefVal;
    document.getElementById('mEmoji').innerText = m.i;
    document.getElementById('battleM').style.display = 'flex';
    bActive = false; updateBars();
}

function updateBars() {
    document.getElementById('hHpFill').style.width = (state.hp/state.maxHp * 100) + "%";
    document.getElementById('mHpFill').style.width = (mHp/mMaxHp * 100) + "%";
}

function heroTurn() {
    if(bActive) return; bActive = true;
    let dmg = Math.max(2, currentHeroAtk - mDefVal);
    mHp = Math.max(0, mHp - dmg);
    updateBars();
    if(mHp <= 0) {
        alert("Victory! +30 Gold"); state.gold += 30;
        document.getElementById('battleM').style.display='none'; render();
    } else { setTimeout(monsterTurn, 600); }
}

function monsterTurn() {
    let dmg = Math.max(2, mAtkVal - currentHeroDef);
    state.hp = Math.max(0, state.hp - dmg);
    updateBars();
    if(state.hp <= 0) {
        alert("Fainted! HP reset to 20."); state.hp = 20;
        document.getElementById('battleM').style.display='none'; render();
    } else { bActive = false; }
}

load();
</script>
</body>
</html>

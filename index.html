<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest RPG: Battle Stadium</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
      --accent: #6366f1; --gold: #f59e0b; --danger: #ef4444; --success: #10b981;
    }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
    .app { max-width: 1100px; margin: 20px auto; padding: 20px; }

    /* UI TABS */
    .nav-tabs { display: flex; gap: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; align-items: center; }
    .tab { color: var(--text); font-weight: bold; text-transform: uppercase; font-size: 14px; }
    .gold-count { margin-left: auto; color: var(--gold); font-weight: bold; font-size: 18px; }

    /* CHARACTER GRID */
    .char-layout { display: grid; grid-template-columns: 200px 1fr 200px; gap: 20px; }
    .slot-group { display: flex; flex-direction: column; gap: 10px; }
    .equip-slot { background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 8px; padding: 10px; min-height: 80px; text-align: center; }
    .equip-slot.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }
    .slot-label { font-size: 9px; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px; }

    /* MANNEQUIN */
    .mannequin-container { background: radial-gradient(circle, #1e293b, #0f172a); border-radius: 12px; height: 350px; position: relative; display: flex; justify-content: center; align-items: center; border: 1px solid #334155; }
    .m-body { position: relative; width: 100px; height: 200px; }
    .m-head { width: 45px; height: 45px; background: #eab308; border-radius: 50%; margin: 0 auto; position: relative; }
    .m-torso { width: 70px; height: 80px; background: #334155; border-radius: 8px; margin: 5px auto; }
    .m-legs { display: flex; justify-content: space-around; width: 60px; margin: 0 auto; }
    .m-leg { width: 25px; height: 60px; background: #1e293b; border-radius: 4px; }
    
    /* OVERLAYS */
    .ov { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }
    #ov-helmet { top: -5px; font-size: 55px; z-index: 10; }
    #ov-armor { top: 50px; font-size: 80px; z-index: 9; }
    #ov-weapon { top: 70px; left: -10px; font-size: 50px; z-index: 11; transform: rotate(-15deg); }
    #ov-shield { top: 70px; left: 110px; font-size: 50px; z-index: 11; }
    #ov-shoes { bottom: -20px; font-size: 70px; display: flex; width: 90px; justify-content: space-around; }

    /* 2.5D BATTLE ARENA */
    .arena-container { 
        position: relative; width: 100%; height: 300px; background: #020617; 
        border-radius: 15px; overflow: hidden; perspective: 1000px; 
        margin-top: 20px; border: 2px solid #334155;
    }
    .arena-floor { 
        position: absolute; bottom: 0; width: 100%; height: 150px; 
        background: repeating-linear-gradient(0deg, #1e293b, #1e293b 1px, transparent 1px, transparent 20px),
                    repeating-linear-gradient(90deg, #1e293b, #1e293b 1px, transparent 1px, transparent 20px);
        transform: rotateX(60deg); transform-origin: bottom; opacity: 0.3;
    }
    
    /* Pokemon Positions */
    .hero-pos { position: absolute; bottom: 40px; left: 60px; z-index: 10; transition: 0.3s; }
    .monster-pos { position: absolute; top: 60px; right: 80px; z-index: 5; transition: 0.3s; }
    
    /* Animations */
    .hero-atk-anim { animation: pokemonLunge 0.5s ease; }
    @keyframes pokemonLunge { 0% { transform: translate(0, 0); } 50% { transform: translate(150px, -80px) scale(1.2); } 100% { transform: translate(0, 0); } }
    .shake { animation: shakeAnim 0.3s; }
    @keyframes shakeAnim { 0%, 100% { left: 60px; } 25% { left: 50px; } 75% { left: 70px; } }

    /* UI ELEMENTS */
    .quest-box { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; }
    .q-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: var(--card); padding: 30px; border-radius: 15px; width: 600px; border: 1px solid var(--accent); }
    
    button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: bold; }
    .btn-atk { background: var(--danger); color: white; width: 100%; font-size: 1.2em; padding: 15px; }
    .inventory { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
    .inv-item { background: #1e293b; padding: 15px; border-radius: 8px; font-size: 24px; cursor: pointer; border: 1px solid transparent; }
    .inv-item:hover { border-color: var(--gold); }
  </style>
</head>
<body>

<div class="app">
    <div class="nav-tabs">
        <span class="tab">Character Sheet</span>
        <select id="roleSel" onchange="state.role=this.value; render();" style="background:#1e293b; color:white; border:none; padding:5px;">
            <option value="child">Child View</option>
            <option value="parent">Parent View</option>
        </select>
        <span class="gold-count">💰 <span id="gold">0</span></span>
        <button onclick="openModal('shopModal')" style="background:var(--gold); color:black;">SHOP</button>
        <button onclick="openModal('battleModal')" style="background:var(--accent); color:white;">BATTLE</button>
    </div>

    <div class="char-layout">
        <div class="slot-group">
            <div class="equip-slot" id="s-helmet"><span class="slot-label">Head</span><div id="i-helmet"></div></div>
            <div class="equip-slot" id="s-weapon"><span class="slot-label">Weapon</span><div id="i-weapon"></div></div>
        </div>

        <div class="mannequin-container">
            <div class="m-body">
                <div class="m-head"></div>
                <div class="m-torso"></div>
                <div class="m-legs"><div class="m-leg"></div><div class="m-leg"></div></div>
                <div class="ov" id="ov-helmet"></div>
                <div class="ov" id="ov-armor"></div>
                <div class="ov" id="ov-weapon"></div>
                <div class="ov" id="ov-shield"></div>
                <div class="ov" id="ov-shoes"></div>
            </div>
            <div style="position:absolute; bottom:15px; text-align:center;">
                <strong>Lvl <span id="lvl">1</span></strong>
                <div style="width:120px; height:6px; background:#000; border-radius:3px; margin:5px auto; overflow:hidden;">
                    <div id="xp-bar" style="width:0%; height:100%; background:var(--accent);"></div>
                </div>
            </div>
        </div>

        <div class="slot-group">
            <div class="equip-slot" id="s-shield"><span class="slot-label">Off-hand</span><div id="i-shield"></div></div>
            <div class="equip-slot" id="s-armor"><span class="slot-label">Body</span><div id="i-armor"></div></div>
            <div class="equip-slot" id="s-shoes"><span class="slot-label">Boots</span><div id="i-shoes"></div></div>
        </div>
    </div>

    <h3>🎒 Inventory</h3>
    <div class="inventory" id="inv"></div>

    <div class="quest-box">
        <h2>📜 Quests</h2>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="qIn" style="flex:1; background:#0f172a; border:1px solid #334155; color:white; padding:12px; border-radius:8px;" placeholder="What do you need to do today?">
            <button onclick="addQ()" style="background:var(--accent); color:white;">Add Task</button>
        </div>
        <div id="qList"></div>
    </div>
</div>

<div id="battleModal" class="modal">
    <div class="modal-content" style="width:700px; background:#020617;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="margin:0;">Arena Encounter</h2>
            <button onclick="closeModal('battleModal')" style="background:none; color:var(--text); font-size:24px;">&times;</button>
        </div>

        <div class="arena-container">
            <div class="arena-floor"></div>
            
            <div class="monster-pos" id="mPos">
                <div id="mSprite" style="font-size:90px;">👾</div>
                <div style="width:100px; height:8px; background:#000; border-radius:4px; margin-top:5px; overflow:hidden;">
                    <div id="mHp-bar" style="width:100%; height:100%; background:var(--danger);"></div>
                </div>
            </div>

            <div class="hero-pos" id="hPos">
                <div style="transform: scaleX(-1); font-size:70px;">🧑‍🚀</div>
                <div style="width:100px; height:8px; background:#000; border-radius:4px; margin-top:5px; overflow:hidden;">
                    <div id="hHp-bar" style="width:100%; height:100%; background:var(--success);"></div>
                </div>
            </div>
        </div>

        <div id="battleLog" style="background:#0f172a; height:60px; padding:10px; margin:15px 0; font-size:14px; color:#94a3b8; overflow-y:auto; border-radius:8px;">
            A wild monster appeared! Prepare for battle.
        </div>
        <button id="atkBtn" class="btn-atk" onclick="battleTurn()">FIGHT!</button>
    </div>
</div>

<div id="shopModal" class="modal">
    <div class="modal-content">
        <h2>Village Shop</h2>
        <div class="q-item"><span>🧪 Health Potion (Full Heal)</span> <button onclick="buy('hp')" style="background:var(--gold);">50G</button></div>
        <div class="q-item"><span>⚔️ Sharp Stone (+5 ATK)</span> <button onclick="buy('atk')" style="background:var(--gold);">150G</button></div>
        <button onclick="closeModal('shopModal')" style="width:100%; margin-top:10px; background:#334155; color:white;">Exit</button>
    </div>
</div>

<script>
let state = {
    role: 'child', gold: 100, lvl: 1, xp: 0, 
    hp: 100, maxHp: 100, atk: 12,
    mHp: 60, mMax: 60, mAtk: 8,
    quests: [], inv: [],
    equip: { helmet: null, weapon: null, shield: null, armor: null, shoes: null }
};

const DROPS = [
    { name: "Sword", icon: "🗡️", slot: "weapon", atk: 15, hp: 0 },
    { name: "Shield", icon: "🛡️", slot: "shield", atk: 0, hp: 40 },
    { name: "Helm", icon: "🪖", slot: "helmet", atk: 2, hp: 20 },
    { name: "Cape", icon: "🧥", slot: "armor", atk: 5, hp: 50 },
    { name: "Boots", icon: "👢", slot: "shoes", atk: 5, hp: 10 }
];

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function addQ() {
    const val = document.getElementById('qIn').value;
    if(!val) return;
    state.quests.push({ txt: val, status: 'open' });
    document.getElementById('qIn').value = '';
    render();
}

function updateQ(i, status) {
    if(status === 'done') {
        state.quests.splice(i, 1);
        state.gold += 50; state.xp += 40;
        if(Math.random() < 0.4) state.inv.push(DROPS[Math.floor(Math.random()*DROPS.length)]);
    } else state.quests[i].status = status;
    checkLvl(); render();
}

function battleTurn() {
    const btn = document.getElementById('atkBtn');
    const log = document.getElementById('battleLog');
    const hero = document.getElementById('hPos');
    const monster = document.getElementById('mPos');
    btn.disabled = true;

    // 1. Player Attacks (Lunge)
    hero.classList.add('hero-atk-anim');
    setTimeout(() => {
        let dmg = state.atk + calcBonus('atk');
        state.mHp -= dmg;
        log.innerHTML = `<span style="color:var(--success)">- You hit the monster for ${dmg} DMG!</span><br>` + log.innerHTML;
        
        if(state.mHp <= 0) {
            log.innerHTML = `⭐ <b>Victory! You earned 30 Gold and 20 XP.</b><br>` + log.innerHTML;
            state.gold += 30; state.xp += 20;
            state.mMax = Math.floor(state.mMax * 1.3);
            state.mHp = state.mMax;
            state.mAtk += 2;
            setTimeout(() => { 
                closeModal('battleModal'); 
                hero.classList.remove('hero-atk-anim');
                btn.disabled = false;
                checkLvl(); render();
            }, 1000);
        } else {
            // 2. Monster Counter Attacks
            setTimeout(() => {
                hero.classList.remove('hero-atk-anim');
                hero.classList.add('shake');
                state.hp -= state.mAtk;
                log.innerHTML = `<span style="color:var(--danger)">- Monster counter-attacks for ${state.mAtk} DMG!</span><br>` + log.innerHTML;
                
                if(state.hp <= 0) {
                    alert("You fainted! Respawning at half HP...");
                    state.hp = Math.floor(state.maxHp / 2);
                    closeModal('battleModal');
                }
                setTimeout(() => { hero.classList.remove('shake'); btn.disabled = false; render(); }, 300);
            }, 500);
        }
        render();
    }, 250);
}

function buy(type) {
    if(type === 'hp' && state.gold >= 50) { state.gold -= 50; state.hp = state.maxHp + calcBonus('hp'); }
    else if(type === 'atk' && state.gold >= 150) { state.gold -= 150; state.atk += 5; }
    render();
}

function equip(i) {
    const item = state.inv[i];
    const old = state.equip[item.slot];
    state.equip[item.slot] = item;
    state.inv.splice(i, 1);
    if(old) state.inv.push(old);
    render();
}

function calcBonus(s) { return Object.values(state.equip).reduce((a, b) => a + (b ? b[s] : 0), 0); }
function checkLvl() { if(state.xp >= 100) { state.lvl++; state.xp -= 100; state.maxHp += 20; state.hp = state.maxHp + calcBonus('hp'); } }

function render() {
    document.getElementById('gold').innerText = state.gold;
    document.getElementById('lvl').innerText = state.lvl;
    document.getElementById('xp-bar').style.width = state.xp + "%";
    
    let curMax = state.maxHp + calcBonus('hp');
    document.getElementById('hHp-bar').style.width = (state.hp/curMax*100) + "%";
    document.getElementById('mHp-bar').style.width = (state.mHp/state.mMax*100) + "%";

    // Equipment Visuals
    for(let s in state.equip) {
        const it = state.equip[s];
        document.getElementById('i-'+s).innerText = it ? it.icon : '';
        document.getElementById('ov-'+s).innerText = it ? it.icon : '';
        document.getElementById('s-'+s).className = it ? 'equip-slot active' : 'equip-slot';
    }

    // Quests
    let qH = '';
    state.quests.forEach((q, i) => {
        let b = '';
        if(state.role === 'child' && q.status === 'open') b = `<button onclick="updateQ(${i},'pending')" style="background:var(--accent); color:white;">Submit</button>`;
        if(state.role === 'parent') {
            if(q.status === 'pending') b = `<button onclick="updateQ(${i},'done')" style="background:var(--success); color:white;">Approve</button>`;
            b += ` <button onclick="state.quests.splice(${i},1); render();" style="background:var(--danger); color:white;">&times;</button>`;
        }
        qH += `<div class="q-item"><span>${q.txt} <small>(${q.status})</small></span> <div>${b}</div></div>`;
    });
    document.getElementById('qList').innerHTML = qH || '<p style="text-align:center; opacity:0.5;">No quests posted yet.</p>';

    // Inventory
    let iH = '';
    state.inv.forEach((it, i) => iH += `<div class="inv-item" onclick="equip(${i})">${it.icon}</div>`);
    document.getElementById('inv').innerHTML = iH;
}
render();
</script>
</body>
</html>
